<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiniela 2026</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Outfit:wght@700;900&display=swap');
        
        body { 
            background-color: #53121F; 
            color: white; 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent; 
        }
        
        .font-display { font-family: 'Outfit', sans-serif; }
        .panini-gradient { background: linear-gradient(135deg, #00623B 0%, #033B25 100%); }
        .panini-card { background-color: #033B25; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #C5A97D; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // ==========================================
        // 1. CONFIGURACIÓN FIREBASE & API
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDdCGvIAt4A5AyF_yOvR5SPJsgPtMWpCYY",
            authDomain: "quiniela-2026-59b53.firebaseapp.com",
            projectId: "quiniela-2026-59b53",
            storageBucket: "quiniela-2026-59b53.firebasestorage.app",
            messagingSenderId: "1075755299669",
            appId: "1:1075755299669:web:f565bbd29ee371e60235dc"
        };
        const API_KEY = "176f818a4f007967747803df84e545cf";

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // DICCIONARIO DE BANDERAS
        const BANDERAS = {
            'México': '🇲🇽', 'Camerún': '🇨🇲', 'Croacia': '🇭🇷', 'Brasil': '🇧🇷',
            'Canadá': '🇨🇦', 'Marruecos': '🇲🇦', 'Ecuador': '🇪🇨', 'Italia': '🇮🇹',
            'Estados Unidos': '🇺🇸', 'Uruguay': '🇺🇾', 'Senegal': '🇸🇳', 'Japón': '🇯🇵',
            'Francia': '🇫🇷', 'Colombia': '🇨🇴', 'Corea del Sur': '🇰🇷', 'Nigeria': '🇳🇬',
            'España': '🇪🇸', 'Costa Rica': '🇨🇷', 'Inglaterra': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'Suiza': '🇨🇭',
            'Argentina': '🇦🇷', 'Alemania': '🇩🇪', 'Portugal': '🇵🇹', 'Países Bajos': '🇳🇱',
            'Bélgica': '🇧🇪', 'Chile': '🇨🇱', 'Arabia Saudita': '🇸🇦', 'Serbia': '🇷🇸',
            'Perú': '🇵🇪', 'Suecia': '🇸🇪', 'Argelia': '🇩🇿', 'Australia': '🇦🇺',
            'Dinamarca': '🇩🇰', 'Irán': '🇮🇷', 'Venezuela': '🇻🇪', 'Gales': '🏴󠁧󠁢󠁷󠁬󠁳󠁿',
            'Polonia': '🇵🇱', 'Egipto': '🇪🇬', 'Paraguay': '🇵🇾', 'Austria': '🇦🇹',
            'Ucrania': '🇺🇦', 'Mali': '🇲🇱', 'Nueva Zelanda': '🇳🇿', 'Turquía': '🇹🇷',
            'Qatar': '🇶🇦', 'Jamaica': '🇯🇲', 'Noruega': '🇳🇴', 'Honduras': '🇭🇳'
        };
        const getBandera = (pais) => BANDERAS[pais] || '🏳️';

        const Icon = ({ name, size = 24, className = "" }) => {
            const ref = React.useRef();
            React.useEffect(() => {
                if (ref.current) lucide.createIcons({ icons: { [name]: lucide.icons[name] }, nameAttr: 'data-lucide', attrs: { class: className, width: size, height: size } });
            }, [name, size, className]);
            return <i ref={ref} data-lucide={name}></i>;
        };

        // ==========================================
        // 2. APLICACIÓN PRINCIPAL
        // ==========================================
        const App = () => {
            const [user, setUser] = React.useState(null);
            const [username, setUsername] = React.useState("");
            const [profile, setProfile] = React.useState(null);
            const [partidos, setPartidos] = React.useState([]);
            const [predicciones, setPredicciones] = React.useState({});
            const [activeTab, setActiveTab] = React.useState('grupos');
            
            const [isLoading, setIsLoading] = React.useState(true);
            const [isLoginExiting, setIsLoginExiting] = React.useState(false);
            const [showAdminModal, setShowAdminModal] = React.useState(false);

            // GESTIÓN DE SESIÓN
            React.useEffect(() => {
                const savedUid = localStorage.getItem('quiniela_user_uid');
                auth.onAuthStateChanged(async (u) => {
                    if (u) {
                        const doc = await db.collection('usuarios').doc(u.uid).get();
                        if (doc.exists) {
                            setProfile({ id: u.uid, ...doc.data() });
                            setUser(u);
                            localStorage.setItem('quiniela_user_uid', u.uid);
                        }
                    } else if (savedUid) {
                        try {
                            const doc = await db.collection('usuarios').doc(savedUid).get();
                            if (doc.exists) { setProfile({ id: savedUid, ...doc.data() }); setUser({ uid: savedUid }); }
                        } catch(e) {}
                    }
                    setIsLoading(false);
                });
            }, []);

            React.useEffect(() => {
                if (!user || !profile) return;
                const unsubPartidos = db.collection('partidos').orderBy('orden').onSnapshot(snap => {
                    const pts = [];
                    snap.forEach(d => pts.push({ id: d.id, ...d.data() }));
                    setPartidos(pts);
                });
                const unsubPreds = db.collection('usuarios').onSnapshot(snap => {
                    const data = {};
                    snap.forEach(d => data[d.id] = { id: d.id, ...d.data() });
                    setPredicciones(data);
                    if (data[user.uid]) setProfile(data[user.uid]);
                });
                return () => { unsubPartidos(); unsubPreds(); };
            }, [user, profile]);

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!username.trim()) return;
                setIsLoading(true);
                try {
                    const snapshot = await db.collection('usuarios').where('username', '==', username.trim()).get();
                    let currentUserUid;
                    if (!snapshot.empty) {
                        currentUserUid = snapshot.docs[0].id;
                        setUser({ uid: currentUserUid });
                    } else {
                        const cred = await auth.signInAnonymously();
                        currentUserUid = cred.user.uid;
                        // Novedad: Agregamos locked: false al crear usuario
                        await db.collection('usuarios').doc(currentUserUid).set({
                            username: username.trim(), picks: {}, puntos: 0, locked: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        setUser(cred.user);
                    }
                    localStorage.setItem('quiniela_user_uid', currentUserUid);
                    const doc = await db.collection('usuarios').doc(currentUserUid).get();
                    setProfile({ id: currentUserUid, ...doc.data() });
                    setIsLoading(false); setIsLoginExiting(true); 
                } catch (error) {
                    alert("Error de conexión."); setIsLoading(false);
                }
            };

            // ACTUALIZACIÓN DE MARCADOR
            const guardarPrediccion = async (partidoId, tipo, valor) => {
                if (!profile || profile.locked) return;
                const parseado = valor === '' ? '' : parseInt(valor);
                const picksActuales = profile.picks || {};
                const nuevoPick = { ...picksActuales, [partidoId]: { ...picksActuales[partidoId], [tipo]: parseado } };
                await db.collection('usuarios').doc(user.uid).update({ picks: nuevoPick });
            };

            // BOTONES DE TENDENCIA RÁPIDA
            const guardarPickRapido = async (partidoId, golesL, golesV) => {
                if (!profile || profile.locked) return;
                const picksActuales = profile.picks || {};
                const nuevoPick = { ...picksActuales, [partidoId]: { golesLocal: golesL, golesVisitante: golesV } };
                await db.collection('usuarios').doc(user.uid).update({ picks: nuevoPick });
            };

            // BOTÓN DE BLOQUEO MAESTRO
            const handleBloquearQuiniela = async () => {
                const totalPicks = Object.keys(profile.picks || {}).length;
                if(confirm(`Has pronosticado ${totalPicks} de 72 partidos.\n\n¿Estás completamente seguro de GUARDAR Y BLOQUEAR tu quiniela? Una vez hecho, entrarás al Ranking Oficial y no podrás modificar tus resultados.`)) {
                    await db.collection('usuarios').doc(user.uid).update({ locked: true });
                    setProfile({...profile, locked: true});
                    alert("¡Quiniela Bloqueada Exitosamente! Ya estás participando en el Ranking Oficial.");
                }
            };

            // ==========================================
            // 3. PANEL DE ADMINISTRADOR & GENERADOR
            // ==========================================
            const cargarPartidosBase = async () => {
                const gruposData = {
                    'Grupo A': ['México', 'Camerún', 'Croacia', 'Brasil'],
                    'Grupo B': ['Canadá', 'Marruecos', 'Ecuador', 'Italia'],
                    'Grupo C': ['Estados Unidos', 'Uruguay', 'Senegal', 'Japón'],
                    'Grupo D': ['Francia', 'Colombia', 'Corea del Sur', 'Nigeria'],
                    'Grupo E': ['España', 'Costa Rica', 'Inglaterra', 'Suiza'],
                    'Grupo F': ['Argentina', 'Alemania', 'Portugal', 'Países Bajos'],
                    'Grupo G': ['Bélgica', 'Chile', 'Arabia Saudita', 'Serbia'],
                    'Grupo H': ['Perú', 'Suecia', 'Argelia', 'Australia'],
                    'Grupo I': ['Dinamarca', 'Irán', 'Venezuela', 'Gales'],
                    'Grupo J': ['Polonia', 'Egipto', 'Paraguay', 'Austria'],
                    'Grupo K': ['Ucrania', 'Mali', 'Nueva Zelanda', 'Turquía'],
                    'Grupo L': ['Qatar', 'Jamaica', 'Noruega', 'Honduras']
                };
                
                const sedes = ['Estadio Azteca, CDMX', 'MetLife Stadium, NY', 'SoFi Stadium, LA', 'Hard Rock, Miami', 'AT&T Stadium, Dallas', 'BC Place, Vancouver'];
                let ordenGlobal = 1;
                const batch = db.batch();

                // Generador Matemático de Enfrentamientos Únicos (6 por grupo = 72 total)
                Object.keys(gruposData).forEach(grupo => {
                    const eq = gruposData[grupo];
                    const enfrentamientos = [ [0, 1], [2, 3], [0, 2], [1, 3], [0, 3], [1, 2] ];
                    
                    enfrentamientos.forEach((enf, index) => {
                        const ref = db.collection('partidos').doc();
                        batch.set(ref, {
                            orden: ordenGlobal,
                            grupo: grupo,
                            local: eq[enf[0]],
                            visitante: eq[enf[1]],
                            fecha: `Jornada ${Math.floor(index/2) + 1}`,
                            hora: 'Por definir',
                            sede: sedes[ordenGlobal % 6],
                            estado: 'pendiente', golesL_real: null, golesV_real: null
                        });
                        ordenGlobal++;
                    });
                });

                try {
                    alert("Generando 72 partidos sin repeticiones... Espera un momento.");
                    await batch.commit();
                    alert("¡Los 72 partidos fueron creados y organizados correctamente!");
                } catch(e) { alert("Error al generar partidos."); }
            };

            const borrarTodosLosPartidos = async () => {
                if(confirm("¿Borrar todos los partidos?")) {
                    const snapshot = await db.collection('partidos').get();
                    const batch = db.batch();
                    snapshot.docs.forEach((doc) => batch.delete(doc.ref));
                    await batch.commit();
                    alert("Torneo limpiado.");
                }
            };

            const calcularPuntosGlobal = async () => {
                const snapshotUsuarios = await db.collection('usuarios').get();
                const batch = db.batch();
                snapshotUsuarios.docs.forEach(doc => {
                    const dataUsuario = doc.data();
                    const susPicks = dataUsuario.picks || {};
                    let puntosTotales = 0;
                    partidos.forEach(p => {
                        if (p.estado === 'finalizado') {
                            const pickL = susPicks[p.id]?.golesLocal; const pickV = susPicks[p.id]?.golesVisitante;
                            if (pickL !== undefined && pickV !== undefined && pickL !== '' && pickV !== '') {
                                let tReal = p.golesL_real > p.golesV_real ? 'L' : (p.golesL_real < p.golesV_real ? 'V' : 'E');
                                let tUser = pickL > pickV ? 'L' : (pickL < pickV ? 'V' : 'E');
                                if (tReal === tUser) puntosTotales += 1;
                            }
                        }
                    });
                    batch.update(doc.ref, { puntos: puntosTotales });
                });
                await batch.commit();
                alert("Ranking actualizado.");
            };

            // ==========================================
            // 4. RENDERIZADO UI
            // ==========================================
            if (isLoading && !isLoginExiting) return <div className="min-h-screen flex items-center justify-center bg-[#00623B] font-display text-2xl font-black text-white">CARGANDO...</div>;

            if (!user || !profile?.username || isLoginExiting) {
                return (
                    <div className={`min-h-screen flex flex-col items-center justify-center bg-[#00623B] p-4 transition-all duration-700 ${isLoginExiting ? 'opacity-0 scale-110 pointer-events-none' : 'opacity-100 scale-100'}`}>
                        <div className="text-center mb-10"><h1 className="text-9xl font-black text-white font-display italic">26</h1></div>
                        <form onSubmit={handleLogin} className="w-full max-w-sm bg-white p-8 rounded-3xl text-center">
                            <input type="text" value={username} onChange={e => setUsername(e.target.value)} placeholder="Tu nombre..." className="w-full px-4 py-4 rounded-xl border-4 border-gray-100 text-black font-black focus:border-[#00623B] outline-none mb-6 text-center text-2xl uppercase" required />
                            <button type="submit" disabled={isLoading} className="w-full bg-[#D31145] text-white font-black py-4 rounded-xl hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2">ENTRAR AL MUNDIAL</button>
                        </form>
                    </div>
                );
            }

            // Agrupación visual de partidos para computadora
            const gruposNombres = [...new Set(partidos.map(p => p.grupo))];

            return (
                <div className="min-h-screen pb-24 relative animate-fade-in w-full">
                    
                    {/* Header Premium */}
                    <div className="bg-[#00623B] pt-safe pb-4 px-4 shadow-lg sticky top-0 z-40 w-full border-b border-[#C5A97D]/30">
                        <div className="flex justify-between items-center max-w-6xl mx-auto pt-4 w-full">
                            <h1 className="font-display font-black text-2xl italic flex items-center gap-1">
                                <span className="text-white drop-shadow-md">FIFA</span><span className="bg-white text-[#00623B] px-2 py-0.5 rounded-md">26</span>
                            </h1>
                            <div className="flex items-center gap-2 bg-black/20 px-4 py-2 rounded-full border border-white/10">
                                <span className="font-bold text-sm uppercase text-white">{profile.username}</span>
                            </div>
                        </div>
                        <div className="flex gap-2 mt-6 max-w-6xl mx-auto overflow-x-auto hide-scrollbar pb-2">
                            {['Grupos', 'Eliminatoria', 'Ranking'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab.toLowerCase())} className={`px-5 py-2.5 rounded-full font-black text-sm whitespace-nowrap transition-all flex-shrink-0 ${activeTab === tab.toLowerCase() ? 'bg-white text-[#53121F] shadow-lg scale-105' : 'bg-black/20 text-white/80 hover:bg-black/40'}`}>
                                    {tab === 'Grupos' ? 'Fase de Grupos' : tab === 'Eliminatoria' ? 'Fase Eliminatoria' : tab}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="max-w-6xl mx-auto p-4 pt-6 space-y-4 w-full">
                        
                        {/* ====== FASE DE GRUPOS (COMPUTADORA Y CELULAR) ====== */}
                        {activeTab === 'grupos' && (
                            <div className="animate-fade-in">
                                
                                {/* BARRA DE PROGRESO Y BLOQUEO */}
                                <div className="bg-[#033B25] p-6 rounded-3xl border border-[#00623B] flex flex-col md:flex-row justify-between items-center mb-8 shadow-xl">
                                    <div className="mb-4 md:mb-0 text-center md:text-left">
                                        <h3 className="text-xl font-display font-black text-white">Tu Progreso</h3>
                                        <p className="text-sm text-[#C5A97D] font-bold">Has pronosticado {Object.keys(profile.picks || {}).length} de 72 partidos.</p>
                                    </div>
                                    <button onClick={handleBloquearQuiniela} disabled={profile.locked} className={`px-8 py-4 rounded-xl font-black flex items-center justify-center gap-2 transition-all w-full md:w-auto ${profile.locked ? 'bg-black/50 text-white/50 cursor-not-allowed border border-white/10' : 'bg-[#D31145] hover:bg-red-700 text-white shadow-[0_5px_15px_rgba(211,17,69,0.4)] hover:scale-105'}`}>
                                        <Icon name={profile.locked ? "lock" : "unlock"} size={20} />
                                        {profile.locked ? 'QUINIELA BLOQUEADA' : 'GUARDAR Y BLOQUEAR'}
                                    </button>
                                </div>

                                {partidos.length === 0 ? (
                                    <div className="text-center py-16 opacity-70 bg-black/10 rounded-3xl border border-white/10"><p className="font-display text-xl font-bold">Torneo vacío.</p></div>
                                ) : (
                                    gruposNombres.map(grupo => (
                                        <div key={grupo} className="mb-12">
                                            <h2 className="text-3xl font-display font-black text-white mb-6 border-b border-white/10 pb-2 drop-shadow-md">{grupo}</h2>
                                            
                                            {/* RESPONSIVO: 1 Columna en Celular, 2 en Tablet, 3 en PC */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                {partidos.filter(p => p.grupo === grupo).map(partido => {
                                                    const pickL = profile.picks?.[partido.id]?.golesLocal ?? '';
                                                    const pickV = profile.picks?.[partido.id]?.golesVisitante ?? '';
                                                    
                                                    // Detectar tendencia visual actual
                                                    let activeTrend = 'ninguna';
                                                    if(pickL !== '' && pickV !== '') {
                                                        if(pickL > pickV) activeTrend = 'local';
                                                        else if(pickL < pickV) activeTrend = 'visitante';
                                                        else activeTrend = 'empate';
                                                    }

                                                    return (
                                                        <div key={partido.id} className={`panini-card rounded-3xl p-5 flex flex-col relative overflow-hidden transition-all ${profile.locked ? 'opacity-90' : 'hover:-translate-y-1'}`}>
                                                            {profile.locked && <div className="absolute inset-0 bg-black/10 pointer-events-none z-10"></div>}
                                                            
                                                            <div className="w-full flex justify-between items-center mb-5 border-b border-white/10 pb-3">
                                                                <div className="flex items-center gap-1 text-white/50 text-[10px] font-black tracking-widest uppercase"><Icon name="calendar" size={12}/> {partido.fecha}</div>
                                                                <div className="flex items-center gap-1 text-[#C5A97D]/80 text-[10px] font-black tracking-widest uppercase"><Icon name="map-pin" size={12}/> {partido.sede}</div>
                                                            </div>

                                                            <div className="flex items-center justify-between w-full gap-2 mb-6">
                                                                <div className="flex-1 flex flex-col items-center gap-2">
                                                                    <span className="text-4xl drop-shadow-md">{getBandera(partido.local)}</span>
                                                                    <span className="font-black text-base text-center truncate w-full text-white/90">{partido.local}</span>
                                                                </div>
                                                                
                                                                <div className="flex items-center gap-2 bg-black/40 p-3 rounded-2xl border border-white/5 shadow-inner">
                                                                    <input type="number" value={pickL} onChange={(e) => guardarPrediccion(partido.id, 'golesLocal', e.target.value)} disabled={profile.locked || partido.estado==='finalizado'} className="w-12 h-12 text-center bg-white text-[#53121F] font-black text-2xl rounded-xl focus:ring-4 focus:ring-[#D31145] outline-none shadow-sm disabled:bg-gray-300" />
                                                                    <span className="text-[#C5A97D] font-black text-lg">-</span>
                                                                    <input type="number" value={pickV} onChange={(e) => guardarPrediccion(partido.id, 'golesVisitante', e.target.value)} disabled={profile.locked || partido.estado==='finalizado'} className="w-12 h-12 text-center bg-white text-[#53121F] font-black text-2xl rounded-xl focus:ring-4 focus:ring-[#D31145] outline-none shadow-sm disabled:bg-gray-300" />
                                                                </div>

                                                                <div className="flex-1 flex flex-col items-center gap-2">
                                                                    <span className="text-4xl drop-shadow-md">{getBandera(partido.visitante)}</span>
                                                                    <span className="font-black text-base text-center truncate w-full text-white/90">{partido.visitante}</span>
                                                                </div>
                                                            </div>

                                                            {/* BOTONES DE TENDENCIA */}
                                                            <div className="grid grid-cols-3 gap-2 border-t border-white/5 pt-4">
                                                                <button onClick={() => guardarPickRapido(partido.id, 1, 0)} disabled={profile.locked || partido.estado==='finalizado'} className={`py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${activeTrend === 'local' ? 'bg-[#D31145] text-white shadow-md' : 'bg-black/30 text-white/40 hover:bg-black/50'}`}>Local</button>
                                                                <button onClick={() => guardarPickRapido(partido.id, 0, 0)} disabled={profile.locked || partido.estado==='finalizado'} className={`py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${activeTrend === 'empate' ? 'bg-[#C5A97D] text-[#53121F] shadow-md' : 'bg-black/30 text-white/40 hover:bg-black/50'}`}>Empate</button>
                                                                <button onClick={() => guardarPickRapido(partido.id, 0, 1)} disabled={profile.locked || partido.estado==='finalizado'} className={`py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${activeTrend === 'visitante' ? 'bg-[#00623B] text-white shadow-md' : 'bg-black/30 text-white/40 hover:bg-black/50'}`}>Visita</button>
                                                            </div>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}

                        {/* ====== FASE ELIMINATORIA ====== */}
                        {activeTab === 'eliminatoria' && (
                            <div className="panini-card border-none p-10 rounded-3xl text-center flex flex-col items-center animate-fade-in mt-8 relative">
                                <Icon name="lock" size={64} className="text-[#C5A97D] mb-6 opacity-90 drop-shadow-lg" />
                                <h3 className="text-3xl font-display font-black mb-4 text-white">FASE BLOQUEADA</h3>
                                <p className="text-white/80 font-bold max-w-md mx-auto">Las llaves se desbloquearán el <span className="text-white bg-[#D31145] px-2 py-1 rounded-md mx-1 font-black">28 de Junio de 2026</span> una vez que la FIFA anuncie los clasificados.</p>
                            </div>
                        )}

                        {/* ====== RANKING ====== */}
                        {activeTab === 'ranking' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="panini-gradient p-8 rounded-3xl shadow-xl text-center relative mb-8">
                                    <h2 className="font-display font-black text-4xl mb-2 text-white drop-shadow-lg uppercase tracking-tight">Ranking Oficial</h2>
                                    <p className="text-[#C5A97D] text-xs font-black tracking-widest uppercase">Solo usuarios con Quiniela Bloqueada</p>
                                    <button onClick={() => { if(prompt("Contraseña:")==="26zorras27") setShowAdminModal(true); }} className="absolute top-4 right-4 bg-black/40 hover:bg-black/70 text-white/90 border border-[#C5A97D]/30 px-4 py-2 rounded-xl text-xs font-black tracking-widest transition-all backdrop-blur-sm">⚙️ ADMIN</button>
                                </div>
                                
                                {!profile.locked && (
                                    <div className="bg-red-900/40 border border-red-500/50 p-6 rounded-2xl text-center mb-6">
                                        <p className="text-white font-bold"><Icon name="alert-circle" className="inline mr-2 mb-1 text-red-400"/>Aún no apareces en el ranking. Debes ir a la Fase de Grupos y presionar "Guardar y Bloquear".</p>
                                    </div>
                                )}
                                
                                <div className="space-y-4">
                                    {Object.values(predicciones).filter(j => j.locked).sort((a,b) => (b.puntos||0) - (a.puntos||0)).map((jugador, idx) => (
                                        <div key={jugador.id} className={`p-5 rounded-3xl flex items-center justify-between shadow-lg transition-transform ${jugador.id === profile.id ? 'bg-white text-black ring-4 ring-[#D31145] scale-[1.02]' : 'panini-card text-white'}`}>
                                            <div className="flex items-center gap-5">
                                                <span className={`font-display font-black text-4xl w-12 text-center ${jugador.id === profile.id ? 'text-[#00623B]' : 'text-[#C5A97D]'}`}>{idx + 1}</span>
                                                <div>
                                                    <div className="flex items-center gap-3">
                                                        <span className="font-black text-xl uppercase truncate max-w-[180px]">{jugador.username}</span>
                                                        {jugador.id === profile.id && <span className="bg-[#D31145] text-white text-[10px] font-black px-2 py-0.5 rounded">TÚ</span>}
                                                    </div>
                                                    <span className={`text-xs font-bold uppercase tracking-wider ${jugador.id === profile.id ? 'text-gray-500' : 'text-[#C5A97D]/70'}`}><Icon name="lock" size={10} className="inline mr-1"/>Quiniela Bloqueada</span>
                                                </div>
                                            </div>
                                            <div className="text-right pr-4">
                                                <div className="font-display font-black text-5xl leading-none">{jugador.puntos || 0}</div>
                                                <div className={`text-[10px] font-black tracking-widest uppercase mt-1 ${jugador.id === profile.id ? 'text-[#D31145]' : 'text-white/50'}`}>Puntos</div>
                                            </div>
                                        </div>
                                    ))}
                                    {Object.values(predicciones).filter(j => j.locked).length === 0 && <p className="text-center text-white/50 font-bold py-10">Nadie ha bloqueado su quiniela aún.</p>}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* ====== MODAL ADMIN ====== */}
                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-[#53121F] border-2 border-[#C5A97D] p-6 rounded-3xl max-w-md w-full relative">
                                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-white/50 bg-black/20 rounded-full p-2"><Icon name="x" size={24} /></button>
                                <h2 className="font-display font-black text-2xl text-white mb-6 border-b border-white/10 pb-4">Panel de Control</h2>
                                <div className="space-y-4">
                                    <button onClick={borrarTodosLosPartidos} className="w-full bg-transparent border-2 border-[#D31145] text-[#D31145] font-black py-3 rounded-xl hover:bg-[#D31145] hover:text-white transition-all">Paso 1: Borrar Torneo</button>
                                    <button onClick={cargarPartidosBase} className="w-full bg-white text-[#00623B] font-black py-4 rounded-xl shadow-lg transition-all">Paso 2: Generar 72 Partidos Exactos</button>
                                    <button onClick={calcularPuntosGlobal} className="w-full bg-[#C5A97D] text-[#53121F] font-black py-4 rounded-xl shadow-lg mt-4">Forzar Cálculo de Puntos</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
