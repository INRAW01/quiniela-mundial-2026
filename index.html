<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Mundial 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // --- CONFIGURACIÓN FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDdCGvIAt4A5AyF_yOvR5SPJsgPtMWpCYY",
            authDomain: "quiniela-2026-59b53.firebaseapp.com",
            projectId: "quiniela-2026-59b53",
            storageBucket: "quiniela-2026-59b53.firebasestorage.app",
            messagingSenderId: "1075755299669",
            appId: "1:1075755299669:web:f565bbd29ee371e60235dc",
            measurementId: "G-QC1R3L0261"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = 'quiniela-mundial-26';

        // --- COMPONENTE APP (Lógica idéntica) ---
        function App() {
            const [user, setUser] = React.useState(null);
            
            React.useEffect(() => {
                auth.signInAnonymously().catch(console.error);
                auth.onAuthStateChanged(setUser);
            }, []);

            if (!user) return <div className="flex justify-center items-center h-screen">Cargando...</div>;
            return (
                <div className="p-4 text-center">
                    <h1 className="text-2xl font-bold text-emerald-400">Quiniela Mundial 2026</h1>
                    <p className="mt-4">La aplicación está en vivo. (Nota: Asegúrate de habilitar el Modo Anónimo en Firebase Auth).</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
