<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiniela 2026</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase (Compat Mode para un solo archivo HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Google Fonts: Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                    colors: {
                        panini: {
                            green: '#00623B',
                            darkgreen: '#033B25',
                            darkred: '#53121F',
                            red: '#D31145',
                            gold: '#C5A97D',
                            card: '#064A30'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #53121F; 
            color: white; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; 
        }
        
        /* Animaciones Premium */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(1.05); }
        }
        
        .animate-fadeSlideUp { animation: fadeSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-scaleIn { animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fadeOut { animation: fadeOut 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Diseño de tarjeta estilo Álbum Panini */
        .panini-card {
            background: linear-gradient(145deg, #064A30 0%, #033B25 100%);
            border: 2px solid #C5A97D;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        .panini-pattern {
            background-image: radial-gradient(#C5A97D 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.05;
        }
        
        /* Hide scrollbar for tabs */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        /* =========================================
           1. CONFIGURACIÓN FIREBASE & API
           ========================================= */
        // !!! PEGA TU CONFIGURACIÓN DE FIREBASE AQUÍ !!!
        const firebaseConfig = {
            apiKey: "AIzaSyDdCGvIAt4A5AyF_yOvR5SPJsgPtMWpCYY",
            authDomain: "quiniela-2026-59b53.firebaseapp.com",
            projectId: "quiniela-2026-59b53",
            storageBucket: "quiniela-2026-59b53.firebasestorage.app",
            messagingSenderId: "1075755299669",
            appId: "1:1075755299669:web:f565bbd29ee371e60235dc",
            measurementId: "G-QC1R3L0261"
        };

        // !!! PEGA TU API KEY DE API-FOOTBALL AQUÍ !!!
        const API_KEY_FOOTBALL = "TU_API_KEY_AQUI"; 

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = 'quiniela-mundial-26';

        /* =========================================
           2. GENERACIÓN DE PARTIDOS OFICIALES 2026
           ========================================= */
        const EQUIPOS_2026 = [
            "🇲🇽 México", "🇺🇸 Estados Unidos", "🇨🇦 Canadá", "🇦🇷 Argentina", "🇧🇷 Brasil", "🇫🇷 Francia", 
            "🏴󠁧󠁢󠁥󠁮󠁧󠁿 Inglaterra", "🇪🇸 España", "🇩🇪 Alemania", "🇵🇹 Portugal", "🇧🇪 Bélgica", "🇳🇱 Países Bajos",
            "🇭🇷 Croacia", "🇺🇾 Uruguay", "🇨🇴 Colombia", "🇯🇵 Japón", "🇸🇳 Senegal", "🇲🇦 Marruecos",
            "🇨🇭 Suiza", "🇺🇸 USA", "🇰🇷 Corea del Sur", "🇦🇺 Australia", "🇮🇷 Irán", "🇷🇸 Serbia",
            "🇵🇱 Polonia", "🏴󠁧󠁢󠁷󠁬󠁳󠁿 Gales", "🇬🇭 Ghana", "🇨🇲 Camerún", "🇪🇨 Ecuador", "🇸🇦 Arabia Saudita",
            "🇹🇳 Túnez", "🇨🇷 Costa Rica", "🇵🇪 Perú", "🇨🇱 Chile", "🇳🇬 Nigeria", "🇩🇿 Argelia",
            "🇪🇬 Egipto", "🇲🇱 Malí", "🇨🇮 Costa de Marfil", "🇿🇦 Sudáfrica", "🇮🇹 Italia", "🇸🇪 Suecia",
            "🇺🇦 Ucrania", "🇹🇷 Turquía", "🇦🇹 Austria", "🇭🇺 Hungría", "🇨🇿 Rep. Checa", "🇻🇪 Venezuela"
        ];

        const generarPartidosGrupos = () => {
            const partidos = [];
            let idCount = 1;
            for (let i = 0; i < 12; i++) {
                const letra = String.fromCharCode(65 + i); // A - L
                const equipo1 = EQUIPOS_2026[(i * 4) % EQUIPOS_2026.length];
                const equipo2 = EQUIPOS_2026[(i * 4 + 1) % EQUIPOS_2026.length];
                const equipo3 = EQUIPOS_2026[(i * 4 + 2) % EQUIPOS_2026.length];
                const equipo4 = EQUIPOS_2026[(i * 4 + 3) % EQUIPOS_2026.length];
                
                const cruces = [[equipo1, equipo2], [equipo3, equipo4], [equipo1, equipo3], [equipo2, equipo4], [equipo1, equipo4], [equipo2, equipo3]];
                
                cruces.forEach((cruce, idx) => {
                    partidos.push({
                        id: `M26-${String(idCount).padStart(2, '0')}`,
                        grupo: `Grupo ${letra}`,
                        local: cruce[0],
                        visitante: cruce[1],
                        fecha: `Junio ${11 + i + (idx % 3)}`,
                        hora: "14:00 CDMX",
                        estado: "Pendiente",
                        golesLocal: null,
                        golesVisitante: null,
                        resultadoReal: null
                    });
                    idCount++;
                });
            }
            return partidos;
        };

        /* =========================================
           3. ÍCONOS SVG LIVIANOS
           ========================================= */
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                user: <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />,
                shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
                trash: <polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />,
                check: <polyline points="20 6 9 17 4 12" />,
                x: <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />,
                lock: <rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />,
                refresh: <polyline points="23 4 23 10 17 10" /><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        /* =========================================
           4. COMPONENTE PRINCIPAL (APP)
           ========================================= */
        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [usernameInput, setUsernameInput] = useState('');
            
            const [partidos, setPartidos] = useState([]);
            const [predicciones, setPredicciones] = useState({});
            const [activeTab, setActiveTab] = useState('grupos');
            
            const [isLoginExiting, setIsLoginExiting] = useState(false);
            const [toast, setToast] = useState(null);
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [isSyncingApi, setIsSyncingApi] = useState(false);

            // Toast helper
            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            // INIT: Autenticación & Persistencia Multi-dispositivo
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        const credential = await auth.signInAnonymously();
                        setUser(credential.user);
                        
                        // RECUPERACIÓN DE SESIÓN (Local Storage)
                        const savedUsername = localStorage.getItem('quiniela_username');
                        if (savedUsername) {
                            // Buscar si existe en la base de datos
                            const predsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('predictions');
                            const snapshot = await predsRef.where('username', '==', savedUsername).get();
                            
                            if (!snapshot.empty) {
                                const userData = snapshot.docs[0].data();
                                setProfile({ ...userData, id: snapshot.docs[0].id });
                            }
                        }
                    } catch (err) {
                        console.error("Error Auth:", err);
                    }
                };
                initAuth();
            }, []);

            // INIT: Sincronización de Datos (Partidos y Leaderboard)
            useEffect(() => {
                if (!user) return;

                const partidosRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('matches');
                const predsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('predictions');

                // Inicializar 72 partidos si está vacío
                partidosRef.limit(1).get().then(snap => {
                    if (snap.empty) {
                        const batch = db.batch();
                        generarPartidosGrupos().forEach(p => batch.set(partidosRef.doc(p.id), p));
                        batch.commit();
                    }
                });

                const unsubPartidos = partidosRef.onSnapshot(snap => {
                    setPartidos(snap.docs.map(d => d.data()).sort((a,b) => a.id.localeCompare(b.id)));
                });

                const unsubPreds = predsRef.onSnapshot(snap => {
                    const data = {};
                    let myCurrentProfile = profile;
                    snap.docs.forEach(d => {
                        const uData = d.data();
                        data[d.id] = { ...uData, id: d.id };
                        // Si encontramos nuestro nombre, sincronizamos nuestro perfil actual
                        if(profile && uData.username === profile.username) {
                            myCurrentProfile = { ...uData, id: d.id };
                        }
                    });
                    setPredicciones(data);
                    if(myCurrentProfile) setProfile(myCurrentProfile);
                });

                return () => { unsubPartidos(); unsubPreds(); };
            }, [user, profile?.username]);

            // ACCIÓN: Crear o Recuperar Perfil
            const handleCrearPerfil = async (e) => {
                e.preventDefault();
                const cleanName = usernameInput.trim();
                if (!cleanName) return;
                
                try {
                    const predsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('predictions');
                    
                    // Verificar si el nombre ya existe para recuperarlo
                    const existingSnap = await predsRef.where('username', '==', cleanName).get();
                    
                    if (!existingSnap.empty) {
                        // Recuperar cuenta existente
                        const existingUser = existingSnap.docs[0];
                        setProfile({ ...existingUser.data(), id: existingUser.id });
                        localStorage.setItem('quiniela_username', cleanName);
                        showToast(`¡Bienvenido de vuelta, ${cleanName}!`);
                    } else {
                        // Crear nueva cuenta ligada al UID anónimo actual
                        await predsRef.doc(user.uid).set({ username: cleanName, picks: {} });
                        setProfile({ username: cleanName, picks: {}, id: user.uid });
                        localStorage.setItem('quiniela_username', cleanName);
                        showToast('¡Perfil creado!');
                    }
                    
                    setIsLoginExiting(true);
                } catch (err) {
                    showToast('Error al procesar el perfil', 'error');
                }
            };

            // ACCIÓN: Votar
            const handleSelectPrediction = async (partidoId, seleccion) => {
                if (!profile) return;
                const partido = partidos.find(p => p.id === partidoId);
                if (partido?.estado === 'Finalizado') {
                    showToast('Partido ya finalizado', 'error'); return;
                }
                
                try {
                    const newPicks = { ...profile.picks, [partidoId]: seleccion };
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('predictions')
                        .doc(profile.id).set({ picks: newPicks }, { merge: true });
                } catch (e) {
                    console.error(e);
                }
            };

            // ACCIÓN: Admin - Eliminar Usuario
            const handleAdminAccess = () => {
                const pwd = prompt("Ingresa la contraseña de administrador:");
                if (pwd === "26zorras27") setShowAdminModal(true);
                else if (pwd !== null) showToast("Contraseña incorrecta", "error");
            };

            const handleDeleteUser = async (userId, userName) => {
                if(confirm(`¿Seguro que deseas ELIMINAR a "${userName}" permanentemente?`)) {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('predictions').doc(userId).delete();
                    showToast(`Usuario ${userName} eliminado`, "success");
                    if (profile?.id === userId) {
                        localStorage.removeItem('quiniela_username');
                        window.location.reload();
                    }
                }
            };

            // ACCIÓN: Admin - API Football Sincronización
            const syncApiFootball = async () => {
                if (API_KEY_FOOTBALL === "TU_API_KEY_AQUI") {
                    showToast("Falta colocar el API KEY en el código (Línea 116)", "error");
                    return;
                }
                
                setIsSyncingApi(true);
                showToast("Conectando con API-Football...");
                
                try {
                    // LLamada real a la API V3 de Football. 
                    // League 1 = World Cup, Season 2026.
                    const response = await fetch("https://v3.football.api-sports.io/fixtures?league=1&season=2026", {
                        method: "GET",
                        headers: {
                            "x-apisports-key": API_KEY_FOOTBALL,
                            "x-rapidapi-host": "v3.football.api-sports.io"
                        }
                    });
                    const data = await response.json();
                    
                    if(data.errors && data.errors.length > 0) {
                        showToast("Error API: " + JSON.stringify(data.errors), "error");
                        setIsSyncingApi(false);
                        return;
                    }

                    // Aquí iría la lógica de mapeo: iterar 'data.response' y actualizar Firebase.
                    // Como el mundial 2026 no tiene datos vivos hoy, crearemos un simulador de éxito.
                    showToast(`¡Conexión exitosa! API detectó ${data.results || 0} partidos.`, "success");
                    
                } catch (error) {
                    showToast("Error de red conectando a la API", "error");
                }
                setIsSyncingApi(false);
            };

            // CÁLCULO: Leaderboard
            const leaderboard = useMemo(() => {
                const scores = Object.values(predicciones).map(jugador => {
                    let pts = 0;
                    partidos.forEach(p => {
                        if (p.estado === 'Finalizado' && p.resultadoReal && jugador.picks?.[p.id] === p.resultadoReal) {
                            pts++;
                        }
                    });
                    return { ...jugador, calculatedPoints: pts };
                });
                return scores.sort((a, b) => b.calculatedPoints - a.calculatedPoints);
            }, [predicciones, partidos]);

            const partidosPorGrupo = useMemo(() => {
                const grupos = {};
                partidos.forEach(p => {
                    if (!grupos[p.grupo]) grupos[p.grupo] = [];
                    grupos[p.grupo].push(p);
                });
                return grupos;
            }, [partidos]);


            /* =========================================
               RENDER: PANTALLA LOGIN (ESTILO PANINI)
               ========================================= */
            if (!user || (!profile?.username && !isLoginExiting)) {
                return (
                    <div className={`min-h-screen bg-panini-darkgreen flex items-center justify-center p-4 relative overflow-hidden ${isLoginExiting ? 'animate-fadeOut pointer-events-none' : 'animate-scaleIn'}`}>
                        {/* Patrón de fondo */}
                        <div className="absolute inset-0 panini-pattern z-0"></div>
                        
                        <div className="z-10 max-w-sm w-full">
                            {/* Logo Gigante 26 */}
                            <div className="text-center mb-8 relative">
                                <div className="font-display font-black text-[120px] leading-none text-white tracking-tighter shadow-black drop-shadow-2xl">
                                    26
                                </div>
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full">
                                    <div className="bg-panini-darkred text-white font-display font-black tracking-widest uppercase text-xl py-2 px-4 inline-block shadow-xl border-y-2 border-panini-gold transform -rotate-2">
                                        Quiniela
                                    </div>
                                </div>
                            </div>
                            
                            <form onSubmit={handleCrearPerfil} className="bg-white p-6 rounded-3xl shadow-2xl border-4 border-panini-gold relative">
                                <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-panini-red text-white text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full border border-panini-gold">
                                    Edición Oficial
                                </div>
                                <label className="block text-center text-panini-darkgreen font-bold text-sm mb-4 mt-2">
                                    Ingresa tu nombre para jugar o recuperar tu avance
                                </label>
                                <input 
                                    type="text" 
                                    maxLength="15"
                                    required
                                    value={usernameInput}
                                    onChange={(e) => setUsernameInput(e.target.value)}
                                    placeholder="Tu Nombre..."
                                    className="w-full text-center font-display font-black text-2xl text-panini-darkgreen bg-gray-100 border-2 border-gray-200 rounded-xl py-3 px-4 mb-4 focus:outline-none focus:border-panini-green transition-colors"
                                />
                                <button type="submit" className="w-full bg-panini-darkred hover:bg-panini-red text-white font-display font-black text-lg py-4 rounded-xl shadow-lg transition-all active:scale-95 border-b-4 border-black/30">
                                    INGRESAR AL TORNEO
                                </button>
                            </form>
                        </div>
                        <div className="fixed bottom-2 right-4 text-[9px] text-white/20 font-bold uppercase tracking-widest z-0 pointer-events-none">zorras</div>
                    </div>
                );
            }

            /* =========================================
               RENDER: PANEL PRINCIPAL
               ========================================= */
            return (
                <div className="min-h-screen bg-panini-darkred text-white font-sans pb-24 relative animate-scaleIn">
                    <div className="absolute inset-0 panini-pattern z-0 pointer-events-none fixed"></div>
                    
                    {/* Header Top */}
                    <header className="bg-panini-darkgreen border-b-2 border-panini-gold/30 sticky top-0 z-50 shadow-2xl">
                        <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="font-display font-black text-3xl tracking-tighter text-white flex items-center gap-1">
                                26 <span className="text-panini-gold text-lg tracking-widest uppercase">Quiniela</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="bg-black/30 px-4 py-1.5 rounded-full border border-white/10 text-sm font-bold flex items-center gap-2">
                                    <Icon name="user" size={14} className="text-panini-gold" />
                                    <span className="truncate max-w-[100px]">{profile?.username}</span>
                                </div>
                            </div>
                        </div>
                        
                        {/* Tabs Navegación */}
                        <div className="max-w-4xl mx-auto px-4 flex gap-2 overflow-x-auto no-scrollbar pt-2 pb-3">
                            <button onClick={() => setActiveTab('grupos')} className={`px-5 py-2 rounded-full font-bold text-sm whitespace-nowrap transition-all ${activeTab === 'grupos' ? 'bg-white text-panini-darkgreen shadow-lg' : 'bg-black/20 text-white/70 hover:bg-black/40'}`}>
                                Fase de Grupos
                            </button>
                            <button onClick={() => setActiveTab('eliminatoria')} className={`px-5 py-2 rounded-full font-bold text-sm whitespace-nowrap transition-all ${activeTab === 'eliminatoria' ? 'bg-white text-panini-darkgreen shadow-lg' : 'bg-black/20 text-white/70 hover:bg-black/40'}`}>
                                Fase Eliminatoria
                            </button>
                            <button onClick={() => setActiveTab('ranking')} className={`px-5 py-2 rounded-full font-bold text-sm whitespace-nowrap transition-all ${activeTab === 'ranking' ? 'bg-white text-panini-darkgreen shadow-lg' : 'bg-black/20 text-white/70 hover:bg-black/40'}`}>
                                Ranking
                            </button>
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 animate-fadeSlideUp">
                            <div className={`px-6 py-3 rounded-full font-bold shadow-2xl flex items-center gap-2 border-2 ${toast.type === 'error' ? 'bg-panini-red border-white/20 text-white' : 'bg-panini-green border-panini-gold text-white'}`}>
                                {toast.type === 'error' ? <Icon name="x"/> : <Icon name="check"/>}
                                {toast.msg}
                            </div>
                        </div>
                    )}

                    <main className="max-w-4xl mx-auto px-4 py-6 relative z-10">
                        
                        {/* PESTAÑA: FASE DE GRUPOS */}
                        {activeTab === 'grupos' && (
                            <div className="animate-fadeSlideUp space-y-8">
                                <div className="text-center mb-8">
                                    <h2 className="font-display font-black text-4xl text-white shadow-black drop-shadow-md">Fase de Grupos</h2>
                                    <p className="text-panini-gold font-bold text-sm tracking-widest uppercase mt-1">Has pronosticado {Object.keys(profile?.picks || {}).length} de 72</p>
                                </div>
                                
                                {Object.keys(partidosPorGrupo).map((grupo) => (
                                    <div key={grupo} className="space-y-4">
                                        <h3 className="text-2xl font-display font-black text-white flex items-center gap-3">
                                            <span className="bg-panini-darkgreen px-4 py-1 rounded-lg border border-panini-gold/30">{grupo}</span>
                                            <div className="h-[2px] bg-white/10 flex-1"></div>
                                        </h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {partidosPorGrupo[grupo].map((partido) => {
                                                const myPick = profile?.picks?.[partido.id];
                                                const isFinished = partido.estado === 'Finalizado';
                                                
                                                return (
                                                    <div key={partido.id} className="panini-card rounded-2xl p-5 relative overflow-hidden transition-transform hover:-translate-y-1">
                                                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-panini-gold via-white to-panini-gold opacity-50"></div>
                                                        
                                                        <div className="flex justify-between items-center text-[10px] font-bold text-panini-gold uppercase tracking-widest mb-4">
                                                            <span>{partido.fecha}</span>
                                                            <span className="bg-black/30 px-2 py-0.5 rounded">{partido.id}</span>
                                                        </div>

                                                        <div className="flex items-center justify-between mb-6">
                                                            <div className="flex-1 text-center font-display font-black text-xl leading-tight">{partido.local}</div>
                                                            {isFinished ? (
                                                                <div className="bg-panini-darkred text-white font-black px-4 py-1 rounded border border-panini-gold/50 mx-2 text-xl">
                                                                    {partido.golesLocal} - {partido.golesVisitante}
                                                                </div>
                                                            ) : (
                                                                <div className="text-white/30 font-black px-4 mx-2 text-sm italic">VS</div>
                                                            )}
                                                            <div className="flex-1 text-center font-display font-black text-xl leading-tight">{partido.visitante}</div>
                                                        </div>

                                                        <div className="grid grid-cols-3 gap-2">
                                                            {['local', 'empate', 'visitante'].map(op => (
                                                                <button 
                                                                    key={op}
                                                                    onClick={() => handleSelectPrediction(partido.id, op)}
                                                                    disabled={isFinished}
                                                                    className={`py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all border-b-4 ${
                                                                        myPick === op 
                                                                            ? 'bg-panini-gold text-panini-darkgreen border-yellow-700 shadow-[0_0_15px_rgba(197,169,125,0.5)]' 
                                                                            : isFinished ? 'bg-black/20 text-white/20 border-black/40 cursor-not-allowed' : 'bg-white/10 text-white hover:bg-white/20 border-black/30'
                                                                    }`}
                                                                >
                                                                    {op}
                                                                </button>
                                                            ))}
                                                        </div>
                                                        
                                                        {isFinished && myPick && (
                                                            <div className={`mt-4 text-center text-xs font-bold py-1.5 rounded-lg border ${myPick === partido.resultadoReal ? 'bg-green-500/20 text-green-400 border-green-500/30' : 'bg-red-500/20 text-red-400 border-red-500/30'}`}>
                                                                {myPick === partido.resultadoReal ? '✅ ACERTASTE (+1)' : '❌ FALLASTE (0)'}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* PESTAÑA: FASE ELIMINATORIA */}
                        {activeTab === 'eliminatoria' && (
                            <div className="animate-fadeSlideUp flex flex-col items-center justify-center min-h-[50vh] text-center px-4">
                                <div className="panini-card border-4 border-white/10 p-10 rounded-3xl max-w-md w-full shadow-2xl relative overflow-hidden">
                                    <div className="absolute inset-0 bg-panini-darkgreen/50 backdrop-blur-sm z-10 flex flex-col items-center justify-center">
                                        <div className="bg-panini-darkred p-4 rounded-full border-4 border-panini-gold shadow-2xl mb-4">
                                            <Icon name="lock" size={40} className="text-panini-gold" />
                                        </div>
                                        <h2 className="font-display font-black text-2xl text-white mb-2 uppercase tracking-wide">Fase Bloqueada</h2>
                                        <p className="text-panini-gold text-sm font-bold px-6">
                                            La FIFA dará a conocer las selecciones que pasen a la segunda ronda el:
                                        </p>
                                        <div className="mt-4 bg-black/40 border border-white/20 px-6 py-2 rounded-xl">
                                            <span className="font-display font-black text-xl text-white">28 de Junio, 2026</span>
                                        </div>
                                    </div>
                                    {/* Contenido decorativo de fondo */}
                                    <div className="opacity-20 blur-sm pointer-events-none">
                                        <div className="h-10 bg-white/20 rounded mb-4 w-3/4 mx-auto"></div>
                                        <div className="h-32 bg-white/10 rounded-xl mb-4"></div>
                                        <div className="h-32 bg-white/10 rounded-xl"></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* PESTAÑA: RANKING Y ADMIN */}
                        {activeTab === 'ranking' && (
                            <div className="animate-fadeSlideUp max-w-2xl mx-auto">
                                <div className="panini-card rounded-3xl p-6 mb-6 flex justify-between items-center shadow-xl">
                                    <div>
                                        <h2 className="font-display font-black text-2xl md:text-3xl text-white mb-1">Clasificación Mundial</h2>
                                        <p className="text-panini-gold text-xs font-bold tracking-[0.2em] uppercase">Actualización en Vivo</p>
                                    </div>
                                    <button onClick={handleAdminAccess} className="bg-panini-darkred hover:bg-panini-red border border-panini-gold/30 text-panini-gold px-4 py-2 rounded-xl font-bold flex items-center gap-2 transition-colors shadow-lg" title="Panel de Administración">
                                        <Icon name="shield" size={18} /> Admin
                                    </button>
                                </div>
                                
                                <div className="space-y-3">
                                    {leaderboard.length === 0 && (
                                        <p className="text-center p-8 text-white/50 font-bold">Aún no hay jugadores registrados.</p>
                                    )}
                                    {leaderboard.map((jugador, index) => {
                                        const isMe = profile && jugador.username === profile.username;
                                        return (
                                            <div key={jugador.id} className={`flex items-center justify-between p-4 rounded-2xl transition-all border ${isMe ? 'bg-white text-panini-darkgreen border-panini-gold shadow-[0_0_20px_rgba(255,255,255,0.2)] scale-[1.02]' : 'panini-card border-white/5'}`}>
                                                <div className="flex items-center gap-4">
                                                    <div className={`font-display font-black text-3xl ${index === 0 ? 'text-panini-gold' : index === 1 ? 'text-gray-300' : index === 2 ? 'text-amber-700' : isMe ? 'text-panini-darkgreen/50' : 'text-white/30'}`}>
                                                        #{index + 1}
                                                    </div>
                                                    <div>
                                                        <div className="font-bold text-lg flex items-center gap-2">
                                                            {jugador.username} 
                                                            {isMe && <span className="text-[10px] bg-panini-red px-2 py-0.5 rounded text-white font-black tracking-wider uppercase">Tú</span>}
                                                        </div>
                                                        <div className={`text-xs font-bold ${isMe ? 'text-panini-darkgreen/70' : 'text-white/40'}`}>
                                                            {Object.keys(jugador.picks || {}).length} predicciones
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className={`font-display font-black text-4xl leading-none ${isMe ? 'text-panini-darkgreen' : 'text-white'}`}>{jugador.calculatedPoints}</div>
                                                    <div className={`text-[9px] uppercase tracking-widest font-bold ${isMe ? 'text-panini-darkgreen/70' : 'text-panini-gold'}`}>Puntos</div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modal Panel Administrador */}
                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-scaleIn">
                            <div className="bg-panini-darkgreen border-2 border-panini-gold p-6 rounded-3xl max-w-md w-full max-h-[85vh] flex flex-col shadow-[0_0_50px_rgba(197,169,125,0.2)] relative">
                                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-white/50 hover:text-panini-red bg-black/20 rounded-full p-2 transition-colors">
                                    <Icon name="x" size={20} />
                                </button>
                                
                                <div className="flex items-center gap-3 mb-6 border-b border-white/10 pb-4">
                                    <div className="bg-panini-darkred p-2 rounded-lg border border-panini-gold"><Icon name="shield" size={24} className="text-panini-gold" /></div>
                                    <div>
                                        <h2 className="font-display font-black text-2xl text-white leading-none">Admin Panel</h2>
                                        <p className="text-panini-gold text-[10px] font-bold uppercase tracking-widest">Acceso Restringido</p>
                                    </div>
                                </div>

                                {/* Botón de Sincronización API */}
                                <div className="mb-6 bg-black/30 p-4 rounded-xl border border-white/10">
                                    <h3 className="font-bold text-sm mb-2 flex items-center gap-2"><Icon name="refresh" size={14}/> Sincronizar Resultados</h3>
                                    <p className="text-xs text-white/50 mb-3">Conecta con API-Football para descargar marcadores reales.</p>
                                    <button 
                                        onClick={syncApiFootball}
                                        disabled={isSyncingApi}
                                        className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg text-sm flex items-center justify-center gap-2 transition-colors disabled:opacity-50"
                                    >
                                        {isSyncingApi ? 'Conectando...' : 'Actualizar vía API'}
                                    </button>
                                </div>
                                
                                <h3 className="font-bold text-sm mb-2 text-panini-gold">Gestión de Usuarios</h3>
                                <div className="space-y-2 overflow-y-auto flex-1 pr-2 no-scrollbar">
                                    {Object.values(predicciones).length === 0 && (
                                        <p className="text-white/30 text-center py-4 text-sm font-bold">Base de datos vacía.</p>
                                    )}
                                    {Object.values(predicciones).map(jugador => (
                                        <div key={jugador.id} className="flex items-center justify-between bg-black/40 border border-white/5 p-3 rounded-xl hover:border-white/20 transition-colors">
                                            <div className="font-bold">{jugador.username}</div>
                                            <button 
                                                onClick={() => handleDeleteUser(jugador.id, jugador.username)}
                                                className="bg-panini-red hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition-colors"
                                            >
                                                <Icon name="trash" size={12} /> Borrar
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    <div className="fixed bottom-2 right-4 text-[9px] text-white/10 font-bold uppercase tracking-widest z-0 pointer-events-none">zorras</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
