                    { orden: 66, grupo: 'Grupo K', local: 'Mali', visitante: 'Nueva Zelanda', fecha: '29 Jun', hora: '17:00', sede: 'NRG Stadium, Houston', ...baseMatch },
                    // GRUPO L (Qatar, Jamaica, Noruega, Honduras)
                    { orden: 67, grupo: 'Grupo L', local: 'Qatar', visitante: 'Jamaica', fecha: '19 Jun', hora: '12:00', sede: 'BMO Field, Toronto', ...baseMatch },
                    { orden: 68, grupo: 'Grupo L', local: 'Noruega', visitante: 'Honduras', fecha: '19 Jun', hora: '18:00', sede: 'BC Place, Vancouver', ...baseMatch },
                    { orden: 69, grupo: 'Grupo L', local: 'Qatar', visitante: 'Noruega', fecha: '25 Jun', hora: '12:00', sede: 'BMO Field, Toronto', ...baseMatch },
                    { orden: 70, grupo: 'Grupo L', local: 'Jamaica', visitante: 'Honduras', fecha: '25 Jun', hora: '18:00', sede: 'BC Place, Vancouver', ...baseMatch },
                    { orden: 71, grupo: 'Grupo L', local: 'Qatar', visitante: 'Honduras', fecha: '30 Jun', hora: '15:00', sede: 'BMO Field, Toronto', ...baseMatch },
                    { orden: 72, grupo: 'Grupo L', local: 'Jamaica', visitante: 'Noruega', fecha: '30 Jun', hora: '15:00', sede: 'BC Place, Vancouver', ...baseMatch },
                ];
                try {
                    for(let i=0; i<llavesIniciales.length; i++) {
                        await db.collection('partidos').add(llavesIniciales[i]);
                    }
                    alert("¡Los 72 partidos de Fase de Grupos cargados con éxito!");
                } catch(e) { alert("Error cargando partidos."); }
            };

            const calcularPuntosGlobal = async () => {
                try {
                    const snapshotUsuarios = await db.collection('usuarios').get();
                    const batch = db.batch();

                    snapshotUsuarios.docs.forEach(doc => {
                        const dataUsuario = doc.data();
                        const susPicks = dataUsuario.picks || {};
                        let puntosTotales = 0;

                        partidos.forEach(partido => {
                            if (partido.estado === 'finalizado') {
                                const pickL = susPicks[partido.id]?.golesLocal;
                                const pickV = susPicks[partido.id]?.golesVisitante;
                                
                                if (pickL !== undefined && pickV !== undefined && pickL !== '' && pickV !== '') {
                                    let tendenciaReal = 'ninguna';
                                    if (partido.golesL_real > partido.golesV_real) tendenciaReal = 'local';
                                    else if (partido.golesL_real < partido.golesV_real) tendenciaReal = 'visitante';
                                    else if (partido.golesL_real === partido.golesV_real) tendenciaReal = 'empate';

                                    let tendenciaUser = 'ninguna';
                                    if (pickL > pickV) tendenciaUser = 'local';
                                    else if (pickL < pickV) tendenciaUser = 'visitante';
                                    else if (pickL === pickV) tendenciaUser = 'empate';

                                    if (tendenciaReal !== 'ninguna' && tendenciaReal === tendenciaUser) {
                                        puntosTotales += 1;
                                    }
                                }
                            }
                        });
                        batch.update(doc.ref, { puntos: puntosTotales });
                    });

                    await batch.commit();
                    alert("¡Puntos recalculados exitosamente basados en la tendencia!");
                } catch(error) { alert("Hubo un error al calcular los puntos."); }
            };

            const handleSyncAPI = async () => {
                setIsSyncing(true);
                try {
                    const res = await fetch("https://v3.football.api-sports.io/fixtures?league=1&season=2026", {
                        method: "GET",
                        headers: { "x-apisports-key": API_KEY }
                    });
                    
                    if (!res.ok) throw new Error("Error en la respuesta de la API");
                    const data = await res.json();
                    console.log("Datos de API-Football:", data);
                    alert("Conexión con API Exitosa. Revisa la consola.");
                } catch (error) {
                    alert("Hubo un error al conectar con la API.");
                } finally { setIsSyncing(false); }
            };

            // ==========================================
            // 4. RENDERIZADO
            // ==========================================
            if (isLoading && !isLoginExiting) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#00623B] font-display text-2xl font-black text-white">
                        <div className="animate-pulse flex items-center gap-2">
                            <Icon name="loader" size={28} className="animate-spin" /> CARGANDO...
                        </div>
                    </div>
                );
            }

            if (!user || !profile?.username || isLoginExiting) {
                return (
                    <div className={`min-h-screen flex flex-col items-center justify-center bg-[#00623B] p-4 transition-all duration-700 ${isLoginExiting ? 'opacity-0 scale-110 pointer-events-none' : 'opacity-100 scale-100'}`}>
                        <div className="text-center mb-10 animate-fade-in">
                            <h1 className="text-9xl font-black text-white drop-shadow-2xl font-display mb-0 tracking-tighter italic">26</h1>
                            <h2 className="text-2xl font-black tracking-widest text-[#C5A97D] uppercase">Quiniela Mundial</h2>
                        </div>
                        <form onSubmit={handleLogin} className="w-full max-w-sm bg-white p-8 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] text-center animate-scale-in">
                            <p className="text-gray-500 mb-6 font-bold text-sm">Ingresa tu nombre para jugar o recuperar tus predicciones.</p>
                            <input 
                                type="text" value={username} onChange={e => setUsername(e.target.value)} placeholder="Tu nombre aquí..."
                                className="w-full px-4 py-4 rounded-xl border-4 border-gray-100 text-black font-black focus:border-[#00623B] focus:outline-none mb-6 text-center text-2xl uppercase transition-colors"
                                required
                            />
                            <button type="submit" disabled={isLoading} className="w-full bg-[#D31145] text-white font-black py-4 rounded-xl hover:bg-red-700 transition-transform hover:scale-[1.02] active:scale-95 shadow-xl flex items-center justify-center gap-2 disabled:opacity-50">
                                {isLoading ? <Icon name="loader" className="animate-spin" /> : <Icon name="play" size={20} />} 
                                {isLoading ? 'CONECTANDO...' : 'ENTRAR AL MUNDIAL'}
                            </button>
                        </form>
                        <div className="fixed bottom-2 right-4 text-[10px] text-white/30 font-black uppercase tracking-widest pointer-events-none">zorras</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-24 relative animate-fade-in w-full">
                    
                    <div className="bg-[#00623B] pt-safe pb-4 px-4 shadow-[0_4px_20px_rgba(0,0,0,0.5)] sticky top-0 z-40 w-full border-b border-[#C5A97D]/30">
                        <div className="flex justify-between items-center max-w-2xl mx-auto pt-4 w-full">
                            <h1 className="font-display font-black text-2xl italic tracking-tight flex items-center gap-1">
                                <span className="text-white drop-shadow-md">FIFA</span>
                                <span className="bg-white text-[#00623B] px-2 py-0.5 rounded-md shadow-inner">26</span>
                            </h1>
                            <div className="flex items-center gap-2 bg-black/20 px-4 py-2 rounded-full border border-white/10 max-w-[50%] backdrop-blur-sm">
                                <Icon name="user" size={14} className="text-[#C5A97D]" />
                                <span className="font-bold text-sm uppercase truncate text-white">{profile.username}</span>
                            </div>
                        </div>
                        
                        <div className="flex gap-2 mt-6 max-w-2xl mx-auto overflow-x-auto hide-scrollbar pb-2 px-1">
                            {['Grupos', 'Eliminatoria', 'Ranking'].map(tab => (
                                <button 
                                    key={tab} onClick={() => setActiveTab(tab.toLowerCase())}
                                    className={`px-5 py-2.5 rounded-full font-black text-sm whitespace-nowrap transition-all flex-shrink-0 duration-300 ${activeTab === tab.toLowerCase() ? 'bg-white text-[#53121F] shadow-[0_4px_15px_rgba(255,255,255,0.3)] scale-105' : 'bg-black/20 text-white/80 hover:bg-black/40'}`}
                                >
                                    {tab === 'Grupos' ? 'Fase de Grupos' : tab === 'Eliminatoria' ? 'Fase Eliminatoria' : tab}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="max-w-2xl mx-auto p-4 pt-6 space-y-4 w-full">
                        
                        {/* ====== FASE DE GRUPOS ====== */}
                        {activeTab === 'grupos' && (
                            <div className="space-y-5 animate-fade-in">
                                {partidos.length === 0 ? (
                                    <div className="text-center py-16 opacity-70 bg-black/10 rounded-3xl border border-white/10">
                                        <Icon name="calendar-x" size={56} className="mx-auto mb-4 opacity-50 text-[#C5A97D]" />
                                        <p className="font-bold text-xl font-display">El torneo está vacío</p>
                                        <p className="text-sm mt-2 font-semibold">Dile al administrador que cargue los partidos.</p>
                                    </div>
                                ) : (
                                    partidos.map(partido => (
                                        <div key={partido.id} className="panini-card rounded-2xl p-5 flex flex-col items-center relative overflow-hidden transition-transform hover:scale-[1.01]">
                                            
                                            <div className="w-full flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                                                <div className="text-[#C5A97D] text-[10px] font-black uppercase tracking-widest bg-black/40 px-2 py-1 rounded shadow-inner">
                                                    {partido.grupo}
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-white text-xs font-bold">{partido.fecha} • {partido.hora}</div>
                                                    <div className="text-[#C5A97D]/80 text-[9px] font-black uppercase tracking-wider mt-0.5">{partido.sede}</div>
                                                </div>
                                            </div>

                                            <div className="flex items-center justify-between w-full gap-2">
                                                {/* Local con Bandera */}
                                                <div className="flex-1 flex justify-end items-center gap-2">
                                                    <span className="font-black text-lg sm:text-2xl truncate drop-shadow-md text-right">{partido.local}</span>
                                                    <span className="text-2xl drop-shadow-md">{getBandera(partido.local)}</span>
                                                </div>
                                                
                                                {/* Inputs de Goles */}
                                                <div className="flex flex-col items-center gap-1 mx-2">
                                                    <div className="flex items-center gap-2 bg-black/50 p-2.5 rounded-xl border border-white/10 shadow-inner">
                                                        <input 
                                                            type="number" min="0" value={profile.picks?.[partido.id]?.golesLocal ?? ''} onChange={(e) => guardarPrediccion(partido.id, 'golesLocal', e.target.value)} 
                                                            className="w-10 h-10 sm:w-12 sm:h-12 text-center bg-white text-[#53121F] font-black text-xl sm:text-2xl rounded-lg focus:ring-4 focus:ring-[#D31145] outline-none transition-all shadow-sm" disabled={partido.estado === 'finalizado'}
                                                        />
                                                        <span className="text-[#C5A97D] font-black text-xl">-</span>
                                                        <input 
                                                            type="number" min="0" value={profile.picks?.[partido.id]?.golesVisitante ?? ''} onChange={(e) => guardarPrediccion(partido.id, 'golesVisitante', e.target.value)} 
                                                            className="w-10 h-10 sm:w-12 sm:h-12 text-center bg-white text-[#53121F] font-black text-xl sm:text-2xl rounded-lg focus:ring-4 focus:ring-[#D31145] outline-none transition-all shadow-sm" disabled={partido.estado === 'finalizado'}
                                                        />
                                                    </div>
                                                    {partido.estado === 'finalizado' && (
                                                        <div className="text-[10px] bg-[#D31145] text-white px-2 py-0.5 rounded font-black uppercase tracking-widest shadow-md mt-1">Finalizado</div>
                                                    )}
                                                </div>

                                                {/* Visitante con Bandera */}
                                                <div className="flex-1 flex justify-start items-center gap-2">
                                                    <span className="text-2xl drop-shadow-md">{getBandera(partido.visitante)}</span>
                                                    <span className="font-black text-lg sm:text-2xl truncate drop-shadow-md text-left">{partido.visitante}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}

                        {/* ====== FASE ELIMINATORIA ====== */}
                        {activeTab === 'eliminatoria' && (
                            <div className="panini-card border-none p-10 rounded-3xl text-center flex flex-col items-center mx-2 animate-scale-in mt-8 relative overflow-hidden">
                                <div className="absolute inset-0 bg-black/20 z-0"></div>
                                <Icon name="lock" size={64} className="text-[#C5A97D] mb-6 opacity-90 drop-shadow-lg z-10" />
                                <h3 className="text-3xl font-display font-black mb-4 text-white drop-shadow-md z-10">FASE BLOQUEADA</h3>
                                <p className="text-white/80 font-bold max-w-sm mx-auto leading-relaxed z-10">
                                    Las llaves de la Fase Eliminatoria se revelarán y desbloquearán el 
                                    <span className="text-white bg-[#D31145] px-2 py-1 rounded-md mx-1 font-black inline-block transform -skew-x-6 shadow-md">28 de Junio de 2026</span>
                                    una vez que la FIFA anuncie oficialmente las selecciones clasificadas.
                                </p>
                            </div>
                        )}

                        {/* ====== RANKING ====== */}
                        {activeTab === 'ranking' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="panini-gradient p-6 rounded-2xl shadow-xl text-center relative mx-2 mb-6">
                                    <h2 className="font-display font-black text-3xl mb-1 text-white drop-shadow-lg uppercase tracking-tight">Clasificación</h2>
                                    <p className="text-[#C5A97D] text-[10px] font-black tracking-widest uppercase">1 Punto por Acierto de Tendencia</p>
                                    
                                    <button onClick={handleAdminAccess} className="absolute top-4 right-4 text-white/30 hover:text-white p-2 transition-colors" title="Panel de Administración">
                                        <Icon name="shield-alert" size={22} />
                                    </button>
                                </div>
                                
                                <div className="px-2 space-y-3">
                                    {Object.values(predicciones).sort((a,b) => (b.puntos||0) - (a.puntos||0)).map((jugador, idx) => (
                                        <div key={jugador.id} className={`p-4 rounded-2xl flex items-center justify-between shadow-lg transition-transform hover:scale-[1.02] ${jugador.id === profile.id ? 'bg-white text-black ring-4 ring-[#D31145]' : 'panini-card text-white'}`}>
                                            <div className="flex items-center gap-4">
                                                <span className={`font-display font-black text-3xl sm:text-4xl w-10 text-center ${jugador.id === profile.id ? 'text-[#00623B]' : 'text-[#C5A97D]'}`}>
                                                    {idx + 1}
                                                </span>
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-black text-lg sm:text-xl leading-tight uppercase truncate max-w-[140px] drop-shadow-sm">{jugador.username}</span>
                                                        {jugador.id === profile.id && <span className="bg-[#D31145] text-white text-[10px] font-black px-2 py-0.5 rounded shadow-sm">TÚ</span>}
                                                    </div>
                                                    <span className={`text-xs font-bold uppercase tracking-wider ${jugador.id === profile.id ? 'text-gray-500' : 'text-[#C5A97D]/70'}`}>{Object.keys(jugador.picks || {}).length} picks</span>
                                                </div>
                                            </div>
                                            <div className="text-right pr-2">
                                                <div className="font-display font-black text-4xl sm:text-5xl leading-none drop-shadow-md">{jugador.puntos || 0}</div>
                                                <div className={`text-[9px] font-black tracking-widest uppercase mt-1 ${jugador.id === profile.id ? 'text-[#D31145]' : 'text-white/50'}`}>Puntos</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    <div className="fixed bottom-2 right-4 text-[10px] text-white/10 font-black uppercase tracking-widest pointer-events-none z-0">zorras</div>

                    {/* ====== MODAL DE ADMINISTRADOR ====== */}
                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-[#53121F] border-2 border-[#C5A97D] p-6 rounded-3xl max-w-md w-full shadow-[0_0_50px_rgba(197,169,125,0.2)] relative">
                                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-white/50 hover:text-white p-2 transition-colors bg-black/20 rounded-full"><Icon name="x" size={24} /></button>
                                
                                <div className="flex items-center gap-3 mb-6 border-b border-[#C5A97D]/20 pb-4">
                                    <Icon name="settings" size={32} className="text-[#C5A97D]" />
                                    <h2 className="font-display font-black text-2xl text-white tracking-wide">Panel de Control</h2>
                                </div>
                                
                                <div className="space-y-5 max-h-[65vh] overflow-y-auto pr-2 custom-scrollbar">
                                    
                                    <div className="p-5 bg-black/30 rounded-2xl border border-white/10 text-center shadow-inner">
                                        <p className="text-[11px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Motor de Resultados</p>
                                        <div className="space-y-3">
                                            <button onClick={handleSyncAPI} disabled={isSyncing} className="w-full bg-[#00623B] hover:bg-[#00824B] border border-[#C5A97D]/50 text-white font-black py-3 rounded-xl transition-all shadow-lg flex justify-center items-center gap-2 disabled:opacity-50">
                                                <Icon name={isSyncing ? "loader" : "globe"} size={18} className={isSyncing ? "animate-spin" : ""} /> 
                                                {isSyncing ? 'CONECTANDO API...' : '1. Sincronizar API-Football'}
                                            </button>
                                            <button onClick={calcularPuntosGlobal} className="w-full bg-[#C5A97D] text-[#53121F] font-black py-3 rounded-xl transition-all shadow-lg flex justify-center items-center gap-2 hover:scale-[1.02]">
                                                <Icon name="calculator" size={18} /> 2. Recalcular Puntos (Ranking)
                                            </button>
                                        </div>
                                    </div>

                                    <div className="p-5 bg-black/30 rounded-2xl border border-white/10 text-center shadow-inner">
                                        <p className="text-[11px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Gestión de Torneo</p>
                                        <div className="space-y-3">
                                            <button onClick={borrarTodosLosPartidos} className="w-full bg-transparent border-2 border-[#D31145] text-[#D31145] font-black py-2.5 rounded-xl transition-all hover:bg-[#D31145] hover:text-white">
                                                Borrar Todos los Partidos
                                            </button>
                                            <button onClick={cargarPartidosBase} className="w-full bg-white text-[#00623B] font-black py-3 rounded-xl transition-all shadow-lg hover:bg-gray-100 flex items-center justify-center gap-2">
                                                <Icon name="database" size={18} /> Cargar Partidos Base (72 Matches)
                                            </button>
                                        </div>
                                    </div>

                                    <div className="p-5 bg-black/30 rounded-2xl border border-white/10 shadow-inner">
                                        <p className="text-[11px] text-[#C5A97D] font-black uppercase tracking-widest mb-4 text-center">Usuarios ({Object.values(predicciones).length})</p>
                                        {Object.values(predicciones).length === 0 && <p className="text-sm text-white/50 text-center font-bold">No hay jugadores registrados.</p>}
                                        <div className="space-y-2">
                                            {Object.values(predicciones).map(j => (
                                                <div key={j.id} className="flex justify-between items-center bg-black/40 p-3 rounded-xl border border-white/5">
                                                    <span className="font-bold text-sm uppercase truncate max-w-[150px]">{j.username}</span>
                                                    <button onClick={() => handleDeleteUser(j.id, j.username)} className="bg-[#D31145] text-white px-3 py-1.5 rounded-lg text-xs font-black hover:bg-red-700 transition-colors flex items-center gap-1">
                                                        <Icon name="trash-2" size={14}/> 
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
