                                                        {jugador.id === profile.id && <span className="bg-[#D31145] text-white text-[10px] font-black px-2 py-0.5 rounded">TÚ</span>}
                                                    </div>
                                                    <span className={`text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 ${jugador.id === profile.id ? 'text-gray-500' : 'text-[#C5A97D]/80'}`}>
                                                        <Icon name={modoEspiaActivo || jugador.id === profile.id ? "eye" : "lock"} size={12} /> 
                                                        {modoEspiaActivo || jugador.id === profile.id ? 'Toca para espiar' : 'Espionaje Bloqueado 🔒'}
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="text-right pr-2">
                                                <div className="font-display font-black text-4xl leading-none">{jugador.puntos || 0}</div>
                                                <div className={`text-[10px] font-black tracking-widest uppercase mt-1 ${jugador.id === profile.id ? 'text-[#D31145]' : 'text-[#C5A97D]'}`}>Puntos</div>
                                            </div>
                                        </div>
                                    ))}
                                    {Object.values(predicciones).filter(j => j.locked).length === 0 && <p className="text-center text-[#C5A97D]/50 font-black tracking-widest uppercase py-10">La mesa está vacía</p>}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* ====== MODAL ESPÍA ====== */}
                    {spyUser && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[90] flex items-center justify-center p-2 md:p-4 animate-fade-in">
                            <div className="bg-[#033B25] border border-[#C5A97D]/50 rounded-3xl w-full max-w-2xl max-h-[95vh] flex flex-col relative shadow-[0_0_40px_rgba(197,169,125,0.3)] overflow-hidden">
                                
                                <div className="sticky top-0 bg-[#033B25] z-20 border-b border-[#C5A97D]/20 px-4 py-4 md:px-6 md:py-5 shadow-lg">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h2 className="font-display font-black text-2xl text-white uppercase tracking-wide drop-shadow-md leading-tight">
                                                Apuestas de <br className="block md:hidden"/><span className="text-[#C5A97D]">{spyUser.username}</span>
                                            </h2>
                                        </div>
                                        <button onClick={handleCloseSpy} className="text-[#C5A97D] bg-black/40 rounded-full p-3 hover:bg-black transition-colors active:scale-95 touch-manipulation">
                                            <Icon name="x" size={24} />
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-3 gap-2 mb-4">
                                        <div className="bg-green-900/40 border border-green-500/50 rounded-xl p-2 flex flex-col items-center justify-center shadow-inner">
                                            <span className="text-xl md:text-2xl font-black text-green-400 leading-none">{spyStats.aciertos}</span>
                                            <span className="text-[9px] md:text-[10px] uppercase font-bold text-green-200 mt-1 tracking-widest">Aciertos</span>
                                        </div>
                                        <div className="bg-red-900/40 border border-red-500/50 rounded-xl p-2 flex flex-col items-center justify-center shadow-inner">
                                            <span className="text-xl md:text-2xl font-black text-red-400 leading-none">{spyStats.fallos}</span>
                                            <span className="text-[9px] md:text-[10px] uppercase font-bold text-red-200 mt-1 tracking-widest">Fallos</span>
                                        </div>
                                        <div className="bg-black/30 border border-[#C5A97D]/20 rounded-xl p-2 flex flex-col items-center justify-center shadow-inner">
                                            <span className="text-xl md:text-2xl font-black text-[#C5A97D] leading-none">{spyStats.pendientes}</span>
                                            <span className="text-[9px] md:text-[10px] uppercase font-bold text-[#C5A97D]/70 mt-1 tracking-widest">Pendientes</span>
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-3">
                                        <div className="relative w-full">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                <Icon name="search" size={16} className="text-[#C5A97D]/50" />
                                            </div>
                                            <input 
                                                type="text" 
                                                placeholder="Buscar por equipo..." 
                                                value={spySearchTerm}
                                                onChange={e => setSpySearchTerm(e.target.value)}
                                                className="w-full bg-black/40 border border-white/10 rounded-xl py-3 pl-10 pr-4 text-white text-sm font-bold focus:outline-none focus:border-[#C5A97D] transition-colors shadow-inner"
                                            />
                                        </div>
                                        <div className="flex gap-2 w-full overflow-x-auto hide-scrollbar pb-1">
                                            {['all', 'aciertos', 'fallos'].map(f => (
                                                <button 
                                                    key={f}
                                                    onClick={() => setSpyFilter(f)}
                                                    className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest whitespace-nowrap transition-all ${
                                                        spyFilter === f 
                                                            ? 'bg-[#C5A97D] text-[#53121F] shadow-[0_0_10px_rgba(197,169,125,0.4)]' 
                                                            : 'bg-black/30 text-[#C5A97D]/70 border border-white/5 hover:bg-black/50'
                                                    }`}
                                                >
                                                    {f === 'all' ? 'Todos' : f === 'aciertos' ? '✅ Aciertos' : '❌ Fallos'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="overflow-y-auto custom-scrollbar p-4 space-y-3 bg-[#033B25]/90 flex-1">
                                    {spyPartidosFiltrados.length === 0 ? (
                                        <div className="text-center py-10">
                                            <Icon name="search-x" size={48} className="mx-auto text-white/20 mb-4" />
                                            <p className="text-[#C5A97D]/50 font-black tracking-widest uppercase text-sm">No se encontraron resultados</p>
                                        </div>
                                    ) : (
                                        spyPartidosFiltrados.map(partido => {
                                            const suPick = spyUser.picks?.[partido.id];
                                            
                                            let esCorrecto = null;
                                            if (partido.estado === 'finalizado') {
                                                let tReal = partido.golesL_real > partido.golesV_real ? 'local' : (partido.golesL_real < partido.golesV_real ? 'visitante' : 'empate');
                                                esCorrecto = (tReal === suPick);
                                            }

                                            return (
                                                <div key={partido.id} className={`flex items-center justify-between p-3 rounded-2xl border transition-all shadow-md ${
                                                    esCorrecto === true ? 'bg-green-900/40 border-green-500 shadow-[0_0_10px_rgba(34,197,94,0.3)]' : 
                                                    esCorrecto === false ? 'bg-red-900/40 border-red-500 shadow-[0_0_10px_rgba(239,68,68,0.3)]' : 
                                                    'bg-black/40 border-white/10'
                                                }`}>
                                                    <div className="flex items-center gap-2 w-1/2 md:gap-3">
                                                        <span className="text-2xl drop-shadow-md">{getBandera(partido.local)}</span>
                                                        <span className="text-[10px] text-white/40 font-black italic">VS</span>
                                                        <span className="text-2xl drop-shadow-md">{getBandera(partido.visitante)}</span>
                                                    </div>
                                                    <div className="w-1/2 flex justify-end">
                                                        <span className={`text-[9px] md:text-[10px] font-black uppercase tracking-widest px-3 py-2 rounded-xl text-center shadow-inner flex items-center gap-1 ${
                                                            esCorrecto === true ? 'bg-green-500 text-white' : 
                                                            esCorrecto === false ? 'bg-red-500 text-white' : 
                                                            'bg-[#C5A97D] text-[#53121F]'
                                                        }`}>
                                                            {esCorrecto === true && <Icon name="check" size={14} />}
                                                            {esCorrecto === false && <Icon name="x" size={14} />}
                                                            {suPick === 'local' ? partido.local : suPick === 'visitante' ? partido.visitante : 'Empate'}
                                                        </span>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ====== MODAL ADMIN ====== */}
                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-[#53121F] border-2 border-[#C5A97D] p-6 rounded-3xl max-w-md w-full relative">
                                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-white/50 bg-black/20 rounded-full p-2"><Icon name="x" size={24} /></button>
                                <h2 className="font-display font-black text-2xl text-white mb-6 border-b border-[#C5A97D]/20 pb-4">Panel de Control</h2>
                                
                                <div className="space-y-6 max-h-[65vh] overflow-y-auto pr-2 custom-scrollbar">
                                    
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Motor de Resultados</p>
                                        <button onClick={() => handleSyncAPI(false)} disabled={isSyncing} className="w-full bg-[#00623B] text-white font-black py-3 rounded-xl shadow-lg mb-3 disabled:opacity-50 flex justify-center items-center gap-2">
                                            <Icon name={isSyncing ? "loader" : "globe"} size={16} className={isSyncing ? "animate-spin" : ""} /> 1. Sincronizar API y Puntos
                                        </button>
                                        <button onClick={calcularPuntosGlobal} className="w-full bg-[#C5A97D] text-[#53121F] font-black py-3 rounded-xl shadow-lg">2. Forzar Recálculo Puntos</button>
                                    </div>

                                    {/* CONFIGURACIÓN DE PREMIOS */}
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Configuración de Premios</p>
                                        <div className="space-y-3 mb-4">
                                            <div>
                                                <label className="text-[10px] text-white/60 font-black uppercase tracking-wider block mb-1">Premio en Pesos (MXN)</label>
                                                <input 
                                                    type="text" 
                                                    value={inputMxn} 
                                                    onChange={e => setInputMxn(e.target.value)} 
                                                    className="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-white text-sm font-bold focus:outline-none focus:border-[#C5A97D]" 
                                                />
                                            </div>
                                            <div>
                                                <label className="text-[10px] text-white/60 font-black uppercase tracking-wider block mb-1">Premio en Colones (CRC)</label>
                                                <input 
                                                    type="text" 
                                                    value={inputCrc} 
                                                    onChange={e => setInputCrc(e.target.value)} 
                                                    className="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-white text-sm font-bold focus:outline-none focus:border-[#C5A97D]" 
                                                />
                                            </div>
                                        </div>
                                        <button 
                                            onClick={handleActualizarPremios} 
                                            className="w-full bg-[#C5A97D] text-[#53121F] font-black py-2.5 rounded-xl text-xs uppercase tracking-widest hover:bg-amber-600 transition-colors"
                                        >
                                            Guardar Montos
                                        </button>
                                    </div>

                                    {/* CONTROL DE ESPIONAJE */}
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Control de Espionaje</p>
                                        <button 
                                            onClick={toggleModoEspia} 
                                            className={`w-full font-black py-3 rounded-xl shadow-lg transition-all flex justify-center items-center gap-2 ${modoEspiaActivo ? 'bg-[#D31145] text-white' : 'bg-[#00623B] text-white'}`}
                                        >
                                            <Icon name={modoEspiaActivo ? "lock" : "unlock"} size={18} />
                                            {modoEspiaActivo ? 'BLOQUEAR MODO ESPÍA' : 'HABILITAR MODO ESPÍA'}
                                        </button>
                                    </div>

                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Torneo Oficial FIFA</p>
                                        <button onClick={borrarTodosLosPartidos} className="w-full bg-transparent border border-[#D31145] text-[#D31145] font-black py-2 rounded-xl hover:bg-[#D31145] hover:text-white transition-all mb-3">Borrar Todo</button>
                                        <button onClick={cargarPartidosBase} className="w-full bg-white text-[#00623B] font-black py-3 rounded-xl shadow-lg">Generar 72 Partidos Reales</button>
                                    </div>

                                    {/* GESTIÓN DE USUARIOS CON DESBLOQUEO */}
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Gestionar Usuarios</p>
                                        <div className="space-y-2">
                                            {Object.values(predicciones).map(j => (
                                                <div key={j.id} className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-black/40 p-3 rounded-xl border border-white/5 gap-2">
                                                    <span className="font-bold text-sm uppercase truncate w-full sm:max-w-[150px] flex items-center gap-2">
                                                        {j.locked ? '🔒' : '🔓'} {j.username}
                                                    </span>
                                                    <div className="flex gap-2 w-full sm:w-auto justify-end">
                                                        {j.locked && (
                                                            <button onClick={() => handleUnlockUser(j.id, j.username)} className="bg-[#00623B] text-white px-3 py-1.5 rounded-lg text-xs font-black hover:bg-green-700 transition-colors">
                                                                Desbloquear
                                                            </button>
                                                        )}
                                                        <button onClick={() => handleDeleteUser(j.id, j.username)} className="bg-[#D31145] text-white px-3 py-1.5 rounded-lg text-xs font-black hover:bg-red-700 transition-colors">
                                                            Eliminar
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* MARCA DE AGUA EASTER EGG (SUPER SUTIL) */}
                    <div className="fixed bottom-2 right-3 z-0 pointer-events-none opacity-[0.03] text-white font-black text-xs tracking-widest">
                        ZORRAS
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
