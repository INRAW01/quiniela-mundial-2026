<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiniela 2026</title>
    <!-- Librerías Core -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@700;900&display=swap');
        body { 
            background-color: #53121F; 
            color: white; 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; 
        }
        .font-display { font-family: 'Outfit', sans-serif; }
        .panini-gradient { background: linear-gradient(135deg, #00623B 0%, #033B25 100%); }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // ==========================================
        // CONFIGURACIÓN DE FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDdCGvIAt4A5AyF_yOvR5SPJsgPtMWpCYY",
            authDomain: "quiniela-2026-59b53.firebaseapp.com",
            projectId: "quiniela-2026-59b53",
            storageBucket: "quiniela-2026-59b53.firebasestorage.app",
            messagingSenderId: "1075755299669",
            appId: "1:1075755299669:web:f565bbd29ee371e60235dc",
            measurementId: "G-QC1R3L0261"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const Icon = ({ name, size = 24, className = "" }) => {
            const ref = React.useRef();
            React.useEffect(() => {
                if (ref.current) lucide.createIcons({ icons: { [name]: lucide.icons[name] }, nameAttr: 'data-lucide', attrs: { class: className, width: size, height: size } });
            }, [name, size, className]);
            return <i ref={ref} data-lucide={name}></i>;
        };

        const App = () => {
            const [user, setUser] = React.useState(null);
            const [username, setUsername] = React.useState("");
            const [profile, setProfile] = React.useState(null);
            const [partidos, setPartidos] = React.useState([]);
            const [predicciones, setPredicciones] = React.useState({});
            const [activeTab, setActiveTab] = React.useState('grupos');
            const [isLoginExiting, setIsLoginExiting] = React.useState(false);
            const [showAdminModal, setShowAdminModal] = React.useState(false);
            const [isLoading, setIsLoading] = React.useState(true);

            // SISTEMA MULTI-DISPOSITIVO Y PERSISTENCIA
            React.useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (u) => {
                    if (u) {
                        setUser(u);
                        const doc = await db.collection('usuarios').doc(u.uid).get();
                        if (doc.exists) {
                            setProfile({ id: u.uid, ...doc.data() });
                            localStorage.setItem('quiniela_user_uid', u.uid);
                        }
                    } else {
                        const savedUid = localStorage.getItem('quiniela_user_uid');
                        if (savedUid) {
                            try {
                                const doc = await db.collection('usuarios').doc(savedUid).get();
                                if (doc.exists) {
                                    setProfile({ id: savedUid, ...doc.data() });
                                    setUser({ uid: savedUid }); 
                                }
                            } catch(e) { console.log("Error recuperando sesión local"); }
                        }
                    }
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // LECTURA DE PARTIDOS Y PREDICCIONES
            React.useEffect(() => {
                if (!user || !profile) return;
                
                const unsubPartidos = db.collection('partidos').orderBy('orden').onSnapshot(snap => {
                    const pts = [];
                    snap.forEach(d => pts.push({ id: d.id, ...d.data() }));
                    setPartidos(pts);
                });

                const unsubPreds = db.collection('usuarios').onSnapshot(snap => {
                    const data = {};
                    snap.forEach(d => data[d.id] = { id: d.id, ...d.data() });
                    setPredicciones(data);
                    if (data[user.uid]) setProfile(data[user.uid]);
                });

                return () => { unsubPartidos(); unsubPreds(); };
            }, [user, profile]);

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!username.trim()) return;
                try {
                    setIsLoading(true);
                    const snapshot = await db.collection('usuarios').where('username', '==', username.trim()).get();
                    let currentUserUid;
                    if (!snapshot.empty) {
                        currentUserUid = snapshot.docs[0].id;
                        setUser({ uid: currentUserUid });
                    } else {
                        const cred = await auth.signInAnonymously();
                        currentUserUid = cred.user.uid;
                        await db.collection('usuarios').doc(currentUserUid).set({
                            username: username.trim(), picks: {}, puntos: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        setUser(cred.user);
                    }
                    localStorage.setItem('quiniela_user_uid', currentUserUid);
                    setIsLoginExiting(true);
                    setTimeout(() => { setIsLoading(false); setIsLoginExiting(false); }, 500);
                } catch (error) {
                    alert("Error de conexión con la base de datos.");
                    setIsLoading(false);
                }
            };

            const guardarPrediccion = async (partidoId, tipo, valor) => {
                if (!profile) return;
                const parseado = valor === '' ? '' : parseInt(valor);
                const picksActuales = profile.picks || {};
                const nuevoPick = {
                    ...picksActuales,
                    [partidoId]: {
                        ...picksActuales[partidoId],
                        [tipo]: parseado
                    }
                };
                await db.collection('usuarios').doc(user.uid).update({ picks: nuevoPick });
            };

            // ==========================================
            // LÓGICA DE ADMINISTRADOR Y CÁLCULO DE PUNTOS
            // ==========================================
            const handleAdminAccess = () => {
                const pwd = prompt("Ingresa la contraseña maestra de administrador:");
                if (pwd === "26zorras27") {
                    setShowAdminModal(true);
                } else if (pwd !== null) {
                    alert("Contraseña incorrecta.");
                }
            };

            const handleDeleteUser = async (userId, userName) => {
                if(confirm(`¿Estás seguro que deseas ELIMINAR al usuario "${userName}"?`)) {
                    await db.collection('usuarios').doc(userId).delete();
                    if (userId === user.uid) {
                        localStorage.removeItem('quiniela_user_uid');
                        window.location.reload();
                    }
                }
            };

            const borrarTodosLosPartidos = async () => {
                if(confirm("¿Seguro que deseas borrar TODOS los partidos de la base de datos?")) {
                    try {
                        const snapshot = await db.collection('partidos').get();
                        const batch = db.batch();
                        snapshot.docs.forEach((doc) => {
                            batch.delete(doc.ref);
                        });
                        await batch.commit();
                        alert("Partidos antiguos borrados con éxito.");
                    } catch(e) { alert("Error borrando partidos"); }
                }
            };

            const cargarPartidosBase = async () => {
                const llavesIniciales = [
                    { orden: 1, grupo: 'Grupo A', local: 'México', visitante: 'Camerún', fecha: '11 Jun 2026', hora: '13:00', sede: 'Estadio Azteca, CDMX', estado: 'pendiente', golesL_real: null, golesV_real: null },
                    { orden: 2, grupo: 'Grupo A', local: 'Croacia', visitante: 'Brasil', fecha: '12 Jun 2026', hora: '15:00', sede: 'Estadio Akron, Guadalajara', estado: 'pendiente', golesL_real: null, golesV_real: null },
                    { orden: 3, grupo: 'Grupo B', local: 'Canadá', visitante: 'Marruecos', fecha: '12 Jun 2026', hora: '12:00', sede: 'BMO Field, Toronto', estado: 'pendiente', golesL_real: null, golesV_real: null },
                    { orden: 4, grupo: 'Grupo B', local: 'Ecuador', visitante: 'Italia', fecha: '12 Jun 2026', hora: '18:00', sede: 'BC Place, Vancouver', estado: 'pendiente', golesL_real: null, golesV_real: null },
                    { orden: 5, grupo: 'Grupo C', local: 'Estados Unidos', visitante: 'Uruguay', fecha: '13 Jun 2026', hora: '14:00', sede: 'SoFi Stadium, Los Angeles', estado: 'pendiente', golesL_real: null, golesV_real: null },
                    { orden: 6, grupo: 'Grupo C', local: 'Senegal', visitante: 'Japón', fecha: '13 Jun 2026', hora: '17:00', sede: 'Lumen Field, Seattle', estado: 'pendiente', golesL_real: null, golesV_real: null },
                    { orden: 7, grupo: 'Grupo D', local: 'Francia', visitante: 'Colombia', fecha: '14 Jun 2026', hora: '13:00', sede: 'MetLife Stadium, NY/NJ', estado: 'pendiente', golesL_real: null, golesV_real: null },
                    { orden: 8, grupo: 'Grupo D', local: 'Corea del Sur', visitante: 'Nigeria', fecha: '14 Jun 2026', hora: '16:00', sede: 'Gillette Stadium, Boston', estado: 'pendiente', golesL_real: null, golesV_real: null }
                ];
                try {
                    for(let p of llavesIniciales) {
                        await db.collection('partidos').add(p);
                    }
                    alert("¡Partidos enriquecidos cargados exitosamente!");
                } catch(e) { alert("Error cargando partidos."); }
            };

            // MOTOR INTELIGENTE DE CÁLCULO DE PUNTOS (3 VARIABLES EXACTAS)
            const calcularPuntosGlobal = async () => {
                try {
                    const snapshotUsuarios = await db.collection('usuarios').get();
                    const batch = db.batch();

                    snapshotUsuarios.docs.forEach(doc => {
                        const dataUsuario = doc.data();
                        const susPicks = dataUsuario.picks || {};
                        let puntosTotales = 0;

                        partidos.forEach(partido => {
                            if (partido.estado === 'finalizado') {
                                const pickL = susPicks[partido.id]?.golesLocal;
                                const pickV = susPicks[partido.id]?.golesVisitante;
                                
                                if (pickL !== undefined && pickV !== undefined && pickL !== '' && pickV !== '') {
                                    
                                    // 1. Calcular Tendencia Real (3 variables)
                                    let tendenciaReal = 'ninguna';
                                    if (partido.golesL_real > partido.golesV_real) tendenciaReal = 'local';
                                    else if (partido.golesL_real < partido.golesV_real) tendenciaReal = 'visitante';
                                    else if (partido.golesL_real === partido.golesV_real) tendenciaReal = 'empate';

                                    // 2. Calcular Tendencia del Usuario (3 variables)
                                    let tendenciaUser = 'ninguna';
                                    if (pickL > pickV) tendenciaUser = 'local';
                                    else if (pickL < pickV) tendenciaUser = 'visitante';
                                    else if (pickL === pickV) tendenciaUser = 'empate';

                                    // 3. Sumar 1 punto si coinciden exactamente
                                    if (tendenciaReal !== 'ninguna' && tendenciaReal === tendenciaUser) {
                                        puntosTotales += 1;
                                    }
                                }
                            }
                        });

                        batch.update(doc.ref, { puntos: puntosTotales });
                    });

                    await batch.commit();
                    alert("¡Cálculo de Puntos completado! Se ha evaluado la tendencia (Local, Visitante o Empate) y el ranking se ha actualizado.");
                } catch(error) {
                    console.error("Error calculando puntos:", error);
                    alert("Hubo un error al calcular los puntos.");
                }
            };

            const handleSyncAPI = async () => {
                const API_KEY = "176f818a4f007967747803df84e545cf";
                
                if (API_KEY === "176f818a4f007967747803df84e545cf") {
                    alert("Para conectar a la API en vivo, reemplaza la línea 242 en el código con tu llave de api-football.com");
                    return;
                }
                alert("Conectando con API-Football para buscar resultados reales...");
                // Aquí el fetch descargará los resultados, actualizará `golesL_real` y `golesV_real` en la DB, 
                // pondrá estado='finalizado', y luego se ejecutará calcularPuntosGlobal() automáticamente.
            };

            // PANTALLA DE CARGA
            if (isLoading && !isLoginExiting) {
                return <div className="min-h-screen flex items-center justify-center font-display text-2xl font-black bg-[#00623B]">CARGANDO...</div>;
            }

            // PANTALLA DE REGISTRO
            if (!user || !profile?.username) {
                return (
                    <div className={`min-h-screen flex flex-col items-center justify-center bg-[#00623B] p-4 transition-all duration-500 ${isLoginExiting ? 'opacity-0 scale-95' : 'opacity-100 scale-100'}`}>
                        <div className="text-center mb-10 animate-fade-in">
                            <h1 className="text-8xl font-black text-white drop-shadow-2xl font-display mb-2 tracking-tighter">26</h1>
                            <h2 className="text-2xl font-black tracking-widest text-white uppercase">Quiniela 2026</h2>
                        </div>
                        <form onSubmit={handleLogin} className="w-full max-w-sm bg-white p-8 rounded-3xl shadow-2xl text-center">
                            <p className="text-gray-500 mb-6 font-bold text-sm">Crea un usuario nuevo o ingresa el tuyo para recuperar tus predicciones.</p>
                            <input 
                                type="text" 
                                value={username} 
                                onChange={e => setUsername(e.target.value)}
                                placeholder="Escribe tu nombre..."
                                className="w-full px-4 py-4 rounded-xl border-2 border-gray-100 text-black font-black focus:border-[#D31145] focus:outline-none mb-4 text-center text-xl uppercase transition-colors"
                                required
                            />
                            <button type="submit" className="w-full bg-[#D31145] text-white font-black py-4 rounded-xl hover:bg-red-700 transition-transform hover:scale-105 active:scale-95 shadow-lg flex items-center justify-center gap-2">
                                <Icon name="play" size={20} /> ENTRAR AL MUNDIAL
                            </button>
                        </form>
                        <div className="fixed bottom-2 right-4 text-[9px] text-white/20 font-bold uppercase tracking-widest pointer-events-none">zorras</div>
                    </div>
                );
            }

            // PANTALLA PRINCIPAL
            return (
                <div className="min-h-screen pb-24 relative animate-fade-in w-full">
                    
                    <div className="bg-[#00623B] pt-safe pb-4 px-4 shadow-xl sticky top-0 z-40 w-full">
                        <div className="flex justify-between items-center max-w-2xl mx-auto pt-4 w-full">
                            <h1 className="font-display font-black text-2xl italic tracking-tight flex items-center gap-1">
                                <span className="text-white">FIFA</span>
                                <span className="bg-white text-[#00623B] px-2 py-0.5 rounded-md">26</span>
                            </h1>
                            <div className="flex items-center gap-2 bg-black/20 px-4 py-2 rounded-full border border-white/10 max-w-[50%]">
                                <span className="font-bold text-sm uppercase truncate text-white">{profile.username}</span>
                            </div>
                        </div>
                        
                        <div className="flex gap-2 mt-6 max-w-2xl mx-auto overflow-x-auto hide-scrollbar pb-2">
                            {['Grupos', 'Eliminatoria', 'Ranking'].map(tab => (
                                <button 
                                    key={tab}
                                    onClick={() => setActiveTab(tab.toLowerCase())}
                                    className={`px-5 py-2.5 rounded-full font-black text-sm whitespace-nowrap transition-all flex-shrink-0 ${activeTab === tab.toLowerCase() ? 'bg-white text-[#00623B] shadow-lg scale-105' : 'bg-black/20 text-white/80 hover:bg-black/30'}`}
                                >
                                    {tab === 'Grupos' ? 'Fase de Grupos' : tab === 'Eliminatoria' ? 'Fase Eliminatoria' : tab}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="max-w-2xl mx-auto p-4 pt-6 space-y-4 w-full">
                        
                        {/* ====== FASE DE GRUPOS ====== */}
                        {activeTab === 'grupos' && (
                            <div className="space-y-4">
                                {partidos.length === 0 ? (
                                    <div className="text-center py-10 opacity-70">
                                        <Icon name="calendar" size={48} className="mx-auto mb-4 opacity-50" />
                                        <p className="font-bold text-xl">El torneo está vacío</p>
                                        <p className="text-sm mt-2">Dile al administrador que cargue los partidos.</p>
                                    </div>
                                ) : (
                                    partidos.map(partido => (
                                        <div key={partido.id} className="bg-[#033B25] border border-[#00623B] rounded-2xl p-5 shadow-lg flex flex-col items-center relative overflow-hidden">
                                            
                                            {/* Detalles Ricos del Partido */}
                                            <div className="w-full flex justify-between items-center mb-4 border-b border-white/10 pb-2">
                                                <div className="text-[#C5A97D] text-[10px] font-black uppercase tracking-widest bg-black/30 px-2 py-1 rounded">
                                                    {partido.grupo}
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-white text-xs font-bold">{partido.fecha} • {partido.hora}</div>
                                                    <div className="text-white/50 text-[9px] uppercase tracking-wider">{partido.sede}</div>
                                                </div>
                                            </div>

                                            {/* Equipos e Inputs */}
                                            <div className="flex items-center justify-between w-full gap-2">
                                                <div className="flex-1 text-right font-black text-lg sm:text-xl truncate">{partido.local}</div>
                                                
                                                <div className="flex flex-col items-center gap-1">
                                                    <div className="flex items-center gap-2 bg-black/40 p-2 rounded-xl border border-white/10">
                                                        <input 
                                                            type="number" min="0" 
                                                            value={profile.picks?.[partido.id]?.golesLocal ?? ''} 
                                                            onChange={(e) => guardarPrediccion(partido.id, 'golesLocal', e.target.value)} 
                                                            className="w-10 h-10 sm:w-12 sm:h-12 text-center bg-white text-black font-black text-xl sm:text-2xl rounded-lg focus:ring-4 focus:ring-[#D31145] outline-none transition-all" 
                                                            disabled={partido.estado === 'finalizado'}
                                                        />
                                                        <span className="text-white/50 font-black">-</span>
                                                        <input 
                                                            type="number" min="0" 
                                                            value={profile.picks?.[partido.id]?.golesVisitante ?? ''} 
                                                            onChange={(e) => guardarPrediccion(partido.id, 'golesVisitante', e.target.value)} 
                                                            className="w-10 h-10 sm:w-12 sm:h-12 text-center bg-white text-black font-black text-xl sm:text-2xl rounded-lg focus:ring-4 focus:ring-[#D31145] outline-none transition-all" 
                                                            disabled={partido.estado === 'finalizado'}
                                                        />
                                                    </div>
                                                    {partido.estado === 'finalizado' && (
                                                        <div className="text-[10px] bg-[#D31145] text-white px-2 py-0.5 rounded font-bold uppercase tracking-widest">Finalizado</div>
                                                    )}
                                                </div>

                                                <div className="flex-1 text-left font-black text-lg sm:text-xl truncate">{partido.visitante}</div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}

                        {/* ====== FASE ELIMINATORIA ====== */}
                        {activeTab === 'eliminatoria' && (
                            <div className="bg-[#033B25] border border-white/10 p-8 rounded-3xl text-center shadow-xl flex flex-col items-center mx-2 animate-fade-in mt-10">
                                <Icon name="lock" size={56} className="text-[#C5A97D] mb-6 opacity-80" />
                                <h3 className="text-3xl font-display font-black mb-3 text-white drop-shadow-md">FASE BLOQUEADA</h3>
                                <p className="text-white/80 font-bold max-w-sm mx-auto leading-relaxed">
                                    Las llaves de la Fase Eliminatoria se revelarán y desbloquearán el 
                                    <span className="text-white bg-[#D31145] px-2 py-1 rounded-md mx-1 font-black inline-block transform -skew-x-6">28 de Junio de 2026</span>
                                    una vez que la FIFA anuncie oficialmente las selecciones clasificadas.
                                </p>
                            </div>
                        )}

                        {/* ====== RANKING ====== */}
                        {activeTab === 'ranking' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="panini-gradient p-6 rounded-2xl shadow-xl text-center border border-[#C5A97D]/30 relative mx-2">
                                    <h2 className="font-display font-black text-2xl mb-1 drop-shadow-lg text-white">Clasificación Mundial</h2>
                                    <p className="text-[#C5A97D] text-xs font-black tracking-widest uppercase">1 Punto por Acierto de Tendencia</p>
                                    
                                    <button onClick={handleAdminAccess} className="absolute top-4 right-4 text-white/40 hover:text-white p-2 transition-colors" title="Panel Admin">
                                        <Icon name="shield-alert" size={24} />
                                    </button>
                                </div>
                                
                                <div className="px-2 space-y-3">
                                    {Object.values(predicciones).sort((a,b) => (b.puntos||0) - (a.puntos||0)).map((jugador, idx) => (
                                        <div key={jugador.id} className={`p-4 rounded-2xl flex items-center justify-between shadow-lg transition-transform ${jugador.id === profile.id ? 'bg-white text-black ring-4 ring-[#C5A97D] scale-[1.02]' : 'bg-[#033B25] border border-white/5 text-white'}`}>
                                            <div className="flex items-center gap-4">
                                                <span className={`font-display font-black text-3xl ${jugador.id === profile.id ? 'text-[#00623B]' : 'text-[#C5A97D]'}`}>#{idx + 1}</span>
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-black text-lg leading-tight uppercase truncate max-w-[120px]">{jugador.username}</span>
                                                        {jugador.id === profile.id && <span className="bg-[#D31145] text-white text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow-sm">Tú</span>}
                                                    </div>
                                                    <span className={`text-xs font-bold ${jugador.id === profile.id ? 'text-gray-500' : 'text-white/50'}`}>{Object.keys(jugador.picks || {}).length} predicciones</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-display font-black text-4xl leading-none">{jugador.puntos || 0}</div>
                                                <div className={`text-[9px] font-black tracking-widest uppercase mt-1 ${jugador.id === profile.id ? 'text-gray-400' : 'text-[#C5A97D]'}`}>Puntos</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    <div className="fixed bottom-2 right-4 text-[9px] text-white/10 font-bold uppercase tracking-widest pointer-events-none z-0">zorras</div>

                    {/* ====== MODAL ADMIN ====== */}
                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-[#033B25] border-2 border-[#C5A97D] p-6 rounded-3xl max-w-md w-full shadow-2xl relative">
                                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-white/50 hover:text-white p-2 transition-colors"><Icon name="x" size={24} /></button>
                                
                                <div className="flex items-center gap-3 mb-6 border-b border-white/10 pb-4">
                                    <Icon name="shield-check" size={32} className="text-[#C5A97D]" />
                                    <h2 className="font-display font-black text-2xl text-white">Centro de Control</h2>
                                </div>
                                
                                <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                                    
                                    {/* SECCIÓN PUNTOS Y API */}
                                    <div className="p-4 bg-black/40 rounded-2xl border border-white/10 text-center">
                                        <p className="text-xs text-[#C5A97D] mb-3 font-black uppercase tracking-wider">Cálculo de Resultados</p>
                                        <div className="space-y-2">
                                            <button onClick={handleSyncAPI} className="w-full bg-[#00623B] hover:bg-[#00824B] border border-[#C5A97D] text-white font-black py-3 rounded-xl transition-all shadow-lg flex justify-center items-center gap-2">
                                                <Icon name="globe" size={18} /> API: Buscar Finalizados
                                            </button>
                                            <button onClick={calcularPuntosGlobal} className="w-full bg-[#C5A97D] text-black font-black py-3 rounded-xl transition-all shadow-lg flex justify-center items-center gap-2">
                                                <Icon name="calculator" size={18} /> Recalcular Puntos
                                            </button>
                                        </div>
                                    </div>

                                    {/* SECCIÓN PARTIDOS */}
                                    <div className="p-4 bg-black/40 rounded-2xl border border-white/10 text-center">
                                        <p className="text-xs text-[#C5A97D] mb-3 font-black uppercase tracking-wider">Gestión de Torneo</p>
                                        <div className="space-y-2">
                                            <button onClick={borrarTodosLosPartidos} className="w-full bg-transparent border-2 border-[#D31145] text-[#D31145] font-black py-2 rounded-xl transition-all">
                                                Paso 1: Borrar Todos
                                            </button>
                                            <button onClick={cargarPartidosBase} className="w-full bg-white text-[#53121F] font-black py-3 rounded-xl transition-all shadow-lg">
                                                Paso 2: Cargar Partidos a BD
                                            </button>
                                        </div>
                                    </div>

                                    {/* SECCIÓN USUARIOS */}
                                    <div className="p-4 bg-black/40 rounded-2xl border border-white/10">
                                        <p className="text-xs text-[#C5A97D] font-black uppercase tracking-wider mb-3 text-center">Usuarios Registrados</p>
                                        {Object.values(predicciones).length === 0 && <p className="text-sm text-white/50 text-center">No hay jugadores.</p>}
                                        <div className="space-y-2">
                                            {Object.values(predicciones).map(j => (
                                                <div key={j.id} className="flex justify-between items-center bg-black/50 p-3 rounded-xl border border-white/5">
                                                    <span className="font-bold truncate max-w-[150px]">{j.username}</span>
                                                    <button onClick={() => handleDeleteUser(j.id, j.username)} className="bg-[#D31145] text-white px-3 py-1.5 rounded-lg text-xs font-black hover:bg-red-700 transition-colors flex items-center gap-1">
                                                        <Icon name="trash" size={14}/> Borrar
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
