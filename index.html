<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiniela 2026</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Outfit:wght@700;900&display=swap');
        
        body { 
            background-color: #53121F; 
            color: white; 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
        }
        
        .font-display { font-family: 'Outfit', sans-serif; }
        .panini-gradient { background: linear-gradient(135deg, #00623B 0%, #033B25 100%); }
        .panini-card { background-color: #033B25; border: 1px solid rgba(197, 169, 125, 0.2); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #C5A97D; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // ==========================================
        // 1. CONFIGURACIÓN FIREBASE & API
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDdCGvIAt4A5AyF_yOvR5SPJsgPtMWpCYY",
            authDomain: "quiniela-2026-59b53.firebaseapp.com",
            projectId: "quiniela-2026-59b53",
            storageBucket: "quiniela-2026-59b53.firebasestorage.app",
            messagingSenderId: "1075755299669",
            appId: "1:1075755299669:web:f565bbd29ee371e60235dc"
        };
        const API_KEY = "176f818a4f007967747803df84e545cf";

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // BANDERAS BASE (Se irán sumando según el sorteo)
        const BANDERAS = { 'México': '🇲🇽', 'Canadá': '🇨🇦', 'Estados Unidos': '🇺🇸' };
        const getBandera = (pais) => BANDERAS[pais] || '🏳️';

        const Icon = ({ name, size = 24, className = "" }) => {
            const ref = React.useRef();
            React.useEffect(() => {
                if (ref.current) lucide.createIcons({ icons: { [name]: lucide.icons[name] }, nameAttr: 'data-lucide', attrs: { class: className, width: size, height: size } });
            }, [name, size, className]);
            return <i ref={ref} data-lucide={name}></i>;
        };

        // NORMALIZADOR DE TEXTO PARA LA API (MATCH PERFECTO)
        const normalizeName = (str) => {
            if(!str) return "";
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        };

        // TRADUCTOR DE API (Inglés -> Español) para que la base de datos entienda a la API de Football
        const TRADUCTOR_API = {
            "usa": "estados unidos",
            "united states": "estados unidos",
            "mexico": "mexico",
            "canada": "canada",
            "spain": "españa",
            "germany": "alemania",
            "england": "inglaterra",
            "brazil": "brasil",
            "france": "francia",
            "netherlands": "paises bajos",
            "italy": "italia",
            "south korea": "corea del sur",
            "japan": "japon"
            // Nota: Aquí se agregarán los nombres de los clasificados finales en 2025.
        };

        const traducirNombre = (nombreIngles) => {
            const normalizado = normalizeName(nombreIngles);
            return TRADUCTOR_API[normalizado] || normalizado;
        };

        // ==========================================
        // 2. APLICACIÓN PRINCIPAL
        // ==========================================
        const App = () => {
            const [user, setUser] = React.useState(null);
            const [username, setUsername] = React.useState("");
            const [profile, setProfile] = React.useState(null);
            const [partidos, setPartidos] = React.useState([]);
            const [predicciones, setPredicciones] = React.useState({});
            const [activeTab, setActiveTab] = React.useState('grupos');
            
            const [isLoading, setIsLoading] = React.useState(true);
            const [isLoginExiting, setIsLoginExiting] = React.useState(false);
            const [showAdminModal, setShowAdminModal] = React.useState(false);
            const [isSyncing, setIsSyncing] = React.useState(false);

            React.useEffect(() => {
                const savedUid = localStorage.getItem('quiniela_user_uid');
                auth.onAuthStateChanged(async (u) => {
                    if (u) {
                        const doc = await db.collection('usuarios').doc(u.uid).get();
                        if (doc.exists) {
                            setProfile({ id: u.uid, ...doc.data() });
                            setUser(u);
                            localStorage.setItem('quiniela_user_uid', u.uid);
                        }
                    } else if (savedUid) {
                        try {
                            const doc = await db.collection('usuarios').doc(savedUid).get();
                            if (doc.exists) { setProfile({ id: savedUid, ...doc.data() }); setUser({ uid: savedUid }); }
                        } catch(e) {}
                    }
                    setIsLoading(false);
                });
            }, []);

            React.useEffect(() => {
                if (!user || !profile) return;
                const unsubPartidos = db.collection('partidos').orderBy('orden').onSnapshot(snap => {
                    const pts = [];
                    snap.forEach(d => pts.push({ id: d.id, ...d.data() }));
                    setPartidos(pts);
                });
                const unsubPreds = db.collection('usuarios').onSnapshot(snap => {
                    const data = {};
                    snap.forEach(d => data[d.id] = { id: d.id, ...d.data() });
                    setPredicciones(data);
                    if (data[user.uid]) setProfile(data[user.uid]);
                });
                return () => { unsubPartidos(); unsubPreds(); };
            }, [user, profile]);

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!username.trim()) return;
                setIsLoading(true);
                try {
                    const snapshot = await db.collection('usuarios').where('username', '==', username.trim()).get();
                    let currentUserUid;
                    if (!snapshot.empty) {
                        currentUserUid = snapshot.docs[0].id;
                        setUser({ uid: currentUserUid });
                    } else {
                        const cred = await auth.signInAnonymously();
                        currentUserUid = cred.user.uid;
                        await db.collection('usuarios').doc(currentUserUid).set({
                            username: username.trim(), picks: {}, puntos: 0, locked: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        setUser(cred.user);
                    }
                    localStorage.setItem('quiniela_user_uid', currentUserUid);
                    const doc = await db.collection('usuarios').doc(currentUserUid).get();
                    setProfile({ id: currentUserUid, ...doc.data() });
                    
                    setIsLoginExiting(true); 
                    setTimeout(() => {
                        setIsLoginExiting(false);
                        setIsLoading(false);
                    }, 500);

                } catch (error) {
                    alert("Error de conexión."); setIsLoading(false);
                }
            };

            const guardarTendencia = async (partidoId, tendencia) => {
                if (!profile || profile.locked) return;
                const picksActuales = profile.picks || {};
                const nuevoPick = { ...picksActuales, [partidoId]: tendencia };
                await db.collection('usuarios').doc(user.uid).update({ picks: nuevoPick });
            };

            const handleBloquearQuiniela = async () => {
                const totalPicks = Object.keys(profile.picks || {}).length;
                if(confirm(`Has pronosticado ${totalPicks} de 72 partidos.\n\n¿Estás seguro de GUARDAR Y BLOQUEAR tu quiniela para entrar al Ranking Oficial? No podrás hacer cambios.`)) {
                    await db.collection('usuarios').doc(user.uid).update({ locked: true });
                    setProfile({...profile, locked: true});
                    alert("¡Quiniela Bloqueada Exitosamente!");
                }
            };

            // ==========================================
            // 3. PANEL ADMIN & GENERADOR EXACTO FIFA 2026
            // ==========================================
            const cargarPartidosBase = async () => {
                // ESTRUCTURA OFICIAL FIFA 2026 (12 Grupos, 72 Partidos)
                const gruposData = {
                    'Grupo A': ['México', 'Equipo A2', 'Equipo A3', 'Equipo A4'],
                    'Grupo B': ['Canadá', 'Equipo B2', 'Equipo B3', 'Equipo B4'],
                    'Grupo C': ['Equipo C1', 'Equipo C2', 'Equipo C3', 'Equipo C4'],
                    'Grupo D': ['Estados Unidos', 'Equipo D2', 'Equipo D3', 'Equipo D4'],
                    'Grupo E': ['Equipo E1', 'Equipo E2', 'Equipo E3', 'Equipo E4'],
                    'Grupo F': ['Equipo F1', 'Equipo F2', 'Equipo F3', 'Equipo F4'],
                    'Grupo G': ['Equipo G1', 'Equipo G2', 'Equipo G3', 'Equipo G4'],
                    'Grupo H': ['Equipo H1', 'Equipo H2', 'Equipo H3', 'Equipo H4'],
                    'Grupo I': ['Equipo I1', 'Equipo I2', 'Equipo I3', 'Equipo I4'],
                    'Grupo J': ['Equipo J1', 'Equipo J2', 'Equipo J3', 'Equipo J4'],
                    'Grupo K': ['Equipo K1', 'Equipo K2', 'Equipo K3', 'Equipo K4'],
                    'Grupo L': ['Equipo L1', 'Equipo L2', 'Equipo L3', 'Equipo L4']
                };
                
                let ordenGlobal = 1;
                const batch = db.batch();

                Object.keys(gruposData).forEach((grupo, idxGrupo) => {
                    const eq = gruposData[grupo];
                    // Formato FIFA: J1(1v2, 3v4), J2(1v3, 4v2), J3(4v1, 2v3)
                    const enfrentamientos = [ [0, 1], [2, 3], [0, 2], [3, 1], [3, 0], [1, 2] ];
                    
                    enfrentamientos.forEach((enf, index) => {
                        const ref = db.collection('partidos').doc();
                        
                        let sedeAsignada = 'Sede por sorteo';
                        let fechaAsignada = 'Junio 2026';

                        // --- DATOS CONFIRMADOS OFICIALES POR FIFA (Mundial 2026) ---
                        // MÉXICO (Grupo A)
                        if (eq[enf[0]] === 'México' && eq[enf[1]] === 'Equipo A2') { sedeAsignada = 'Estadio Azteca, CDMX'; fechaAsignada = '11 Jun 2026'; }
                        if (eq[enf[0]] === 'México' && eq[enf[1]] === 'Equipo A3') { sedeAsignada = 'Estadio Akron, GDL'; fechaAsignada = '18 Jun 2026'; }
                        if (eq[enf[0]] === 'Equipo A4' && eq[enf[1]] === 'México') { sedeAsignada = 'Estadio Azteca, CDMX'; fechaAsignada = '24 Jun 2026'; }
                        
                        // CANADÁ (Grupo B)
                        if (eq[enf[0]] === 'Canadá' && eq[enf[1]] === 'Equipo B2') { sedeAsignada = 'BMO Field, Toronto'; fechaAsignada = '12 Jun 2026'; }
                        if (eq[enf[0]] === 'Canadá' && eq[enf[1]] === 'Equipo B3') { sedeAsignada = 'BC Place, Vancouver'; fechaAsignada = '18 Jun 2026'; }
                        if (eq[enf[0]] === 'Equipo B4' && eq[enf[1]] === 'Canadá') { sedeAsignada = 'BC Place, Vancouver'; fechaAsignada = '24 Jun 2026'; }

                        // ESTADOS UNIDOS (Grupo D)
                        if (eq[enf[0]] === 'Estados Unidos' && eq[enf[1]] === 'Equipo D2') { sedeAsignada = 'SoFi Stadium, LA'; fechaAsignada = '12 Jun 2026'; }
                        if (eq[enf[0]] === 'Estados Unidos' && eq[enf[1]] === 'Equipo D3') { sedeAsignada = 'Lumen Field, Seattle'; fechaAsignada = '19 Jun 2026'; }
                        if (eq[enf[0]] === 'Equipo D4' && eq[enf[1]] === 'Estados Unidos') { sedeAsignada = 'SoFi Stadium, LA'; fechaAsignada = '25 Jun 2026'; }

                        batch.set(ref, {
                            orden: ordenGlobal,
                            grupo: grupo,
                            local: eq[enf[0]],
                            visitante: eq[enf[1]],
                            fecha: fechaAsignada,
                            hora: 'TBD (Pendiente FIFA)',
                            sede: sedeAsignada,
                            estado: 'pendiente', 
                            golesL_real: null, golesV_real: null 
                        });
                        ordenGlobal++;
                    });
                });

                try {
                    alert("Generando 72 partidos de la Fase de Grupos Oficial... Espera.");
                    await batch.commit();
                    alert("¡Los 72 partidos de Fase de Grupos fueron creados con las fechas y sedes oficiales para los anfitriones!");
                } catch(e) { alert("Error al generar partidos."); }
            };

            const borrarTodosLosPartidos = async () => {
                if(confirm("¿Estás seguro de borrar TODOS los partidos de la base de datos?")) {
                    const snapshot = await db.collection('partidos').get();
                    const batch = db.batch();
                    snapshot.docs.forEach((doc) => batch.delete(doc.ref));
                    await batch.commit();
                    alert("Torneo limpiado con éxito.");
                }
            };

            const handleDeleteUser = async (userId, userName) => {
                if(confirm(`¿ELIMINAR a "${userName}" permanentemente de la base de datos?`)) {
                    await db.collection('usuarios').doc(userId).delete();
                    if (userId === user.uid) {
                        localStorage.removeItem('quiniela_user_uid');
                        window.location.reload();
                    }
                }
            };

            // MOTOR DE ASIGNACIÓN DE PUNTOS
            const calcularPuntosGlobal = async () => {
                const snapshotUsuarios = await db.collection('usuarios').get();
                const batch = db.batch();
                
                snapshotUsuarios.docs.forEach(doc => {
                    const dataUsuario = doc.data();
                    const susPicks = dataUsuario.picks || {};
                    let puntosTotales = 0;
                    
                    partidos.forEach(p => {
                        if (p.estado === 'finalizado') {
                            const pickUsuario = susPicks[p.id]; 
                            if (pickUsuario) {
                                // Calculamos la tendencia real del partido finalizado
                                let tReal = p.golesL_real > p.golesV_real ? 'local' : (p.golesL_real < p.golesV_real ? 'visitante' : 'empate');
                                if (tReal === pickUsuario) puntosTotales += 1;
                            }
                        }
                    });
                    batch.update(doc.ref, { puntos: puntosTotales });
                });
                
                await batch.commit();
                alert("Ranking actualizado. Se evaluaron las tendencias y asignaron los puntos.");
            };

            // ALGORITMO MATCH PERFECTO CON LA API
            const handleSyncAPI = async () => {
                setIsSyncing(true);
                try {
                    // Endpoint Liga Mundial FIFA = 1, Temporada 2026
                    const res = await fetch("https://v3.football.api-sports.io/fixtures?league=1&season=2026", {
                        method: "GET", headers: { "x-apisports-key": API_KEY }
                    });
                    const data = await res.json();
                    
                    if (!data.response) throw new Error("Sin datos de la API");

                    let actualizados = 0;
                    const batch = db.batch();

                    data.response.forEach(fixture => {
                        if (fixture.fixture.status.short === 'FT') { // Match Finished
                            const apiHomeTranslated = traducirNombre(fixture.teams.home.name);
                            const apiAwayTranslated = traducirNombre(fixture.teams.away.name);
                            
                            // Hacemos MATCH usando el nombre normalizado de tu Base de Datos vs Nombre Traducido de la API
                            const matchEncontrado = partidos.find(p => 
                                normalizeName(p.local) === apiHomeTranslated && 
                                normalizeName(p.visitante) === apiAwayTranslated
                            );
                            
                            if(matchEncontrado && matchEncontrado.estado === 'pendiente') {
                                const ref = db.collection('partidos').doc(matchEncontrado.id);
                                batch.update(ref, {
                                    golesL_real: fixture.goals.home,
                                    golesV_real: fixture.goals.away,
                                    estado: 'finalizado'
                                });
                                actualizados++;
                            }
                        }
                    });

                    if(actualizados > 0) {
                        await batch.commit();
                        await calcularPuntosGlobal(); // Se disparan los puntos automáticamente al haber match
                        alert(`¡API Sincronizada! ${actualizados} partidos finalizados encontrados. Puntos repartidos en el Ranking.`);
                    } else {
                        alert("Conexión con la API Exitosa. No hay partidos nuevos finalizados que coincidan con la base de datos.");
                    }
                } catch (error) {
                    alert("Error conectando con la API.");
                } finally { setIsSyncing(false); }
            };

            // ==========================================
            // 4. RENDERIZADO UI
            // ==========================================
            if (isLoading && !isLoginExiting) return <div className="min-h-screen flex items-center justify-center bg-[#53121F] font-display text-2xl font-black text-[#C5A97D]">CARGANDO...</div>;

            // PANTALLA DE LOGIN DISEÑO PANINI
            if (!user || !profile?.username || isLoginExiting) {
                return (
                    <div className={`min-h-screen flex flex-col items-center justify-center bg-[#00623B] p-4 transition-all duration-700 ${isLoginExiting ? 'opacity-0 scale-110 pointer-events-none' : 'opacity-100 scale-100'}`}>
                        
                        <div className="w-full max-w-sm panini-gradient p-2 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.6)] transform -rotate-1 hover:rotate-0 transition-transform duration-500">
                            <div className="border-4 border-[#C5A97D] rounded-xl p-8 text-center bg-[#53121F] relative overflow-hidden">
                                
                                <div className="absolute top-3 left-3 w-3 h-3 bg-white/20 rounded-full"></div>
                                <div className="absolute top-3 right-3 w-3 h-3 bg-white/20 rounded-full"></div>
                                <div className="absolute bottom-3 left-3 w-3 h-3 bg-white/20 rounded-full"></div>
                                <div className="absolute bottom-3 right-3 w-3 h-3 bg-white/20 rounded-full"></div>

                                <h1 className="text-8xl font-black text-white font-display italic drop-shadow-lg tracking-tighter mt-4">26</h1>
                                <h2 className="text-3xl font-black tracking-widest text-[#C5A97D] uppercase mt-0 mb-8">Quiniela</h2>
                                
                                <form onSubmit={handleLogin} className="relative z-10">
                                    <input type="text" value={username} onChange={e => setUsername(e.target.value)} placeholder="Ingresa tu nombre" className="w-full px-4 py-4 rounded-xl border-4 border-gray-200 text-black font-black focus:border-[#C5A97D] outline-none mb-6 text-center text-xl uppercase shadow-inner" required />
                                    <button type="submit" disabled={isLoading} className="w-full bg-[#D31145] border-2 border-white/20 text-white font-black py-4 rounded-xl hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2 shadow-xl">
                                        ENTRAR AL JUEGO
                                    </button>
                                </form>
                            </div>
                        </div>

                        <div className="fixed bottom-2 right-4 text-[10px] text-white/30 font-black uppercase tracking-widest pointer-events-none">zorras</div>
                    </div>
                );
            }

            const gruposNombres = [...new Set(partidos.map(p => p.grupo))];

            return (
                <div className="min-h-screen pb-24 relative animate-fade-in w-full">
                    
                    {/* Header Premium */}
                    <div className="bg-[#00623B] pt-safe pb-4 px-4 shadow-lg sticky top-0 z-40 w-full border-b border-[#C5A97D]/30">
                        <div className="flex justify-between items-center max-w-6xl mx-auto pt-4 w-full">
                            <h1 className="font-display font-black text-2xl italic flex items-center gap-1">
                                <span className="text-white drop-shadow-md">FIFA</span><span className="bg-white text-[#00623B] px-2 py-0.5 rounded-md shadow-inner">26</span>
                            </h1>
                            <div className="flex items-center gap-2 bg-black/20 px-4 py-2 rounded-full border border-[#C5A97D]/30">
                                <span className="font-bold text-sm uppercase text-[#C5A97D]">{profile.username}</span>
                            </div>
                        </div>
                        <div className="flex gap-2 mt-6 max-w-6xl mx-auto overflow-x-auto hide-scrollbar pb-2">
                            {['Grupos', 'Eliminatoria', 'Ranking'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab.toLowerCase())} className={`px-5 py-2.5 rounded-full font-black text-sm whitespace-nowrap transition-all flex-shrink-0 ${activeTab === tab.toLowerCase() ? 'bg-white text-[#53121F] shadow-lg scale-105' : 'bg-black/20 text-white/80 hover:bg-black/40'}`}>
                                    {tab === 'Grupos' ? 'Fase de Grupos' : tab === 'Eliminatoria' ? 'Fase Eliminatoria' : tab}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="max-w-6xl mx-auto p-4 pt-6 space-y-4 w-full">
                        
                        {/* ====== FASE DE GRUPOS ====== */}
                        {activeTab === 'grupos' && (
                            <div className="animate-fade-in">
                                
                                <div className="bg-[#033B25] p-6 rounded-3xl border border-[#C5A97D]/30 flex flex-col md:flex-row justify-between items-center mb-8 shadow-xl">
                                    <div className="mb-4 md:mb-0 text-center md:text-left">
                                        <h3 className="text-xl font-display font-black text-white">Tu Progreso</h3>
                                        <p className="text-sm text-[#C5A97D] font-bold">Has pronosticado {Object.keys(profile.picks || {}).length} de 72 partidos.</p>
                                    </div>
                                    <button onClick={handleBloquearQuiniela} disabled={profile.locked} className={`px-8 py-4 rounded-xl font-black flex items-center justify-center gap-2 transition-all w-full md:w-auto ${profile.locked ? 'bg-black/50 text-white/50 cursor-not-allowed border border-white/10' : 'bg-[#D31145] hover:bg-red-700 text-white shadow-[0_5px_15px_rgba(211,17,69,0.4)] hover:scale-105'}`}>
                                        <Icon name={profile.locked ? "lock" : "unlock"} size={20} />
                                        {profile.locked ? 'QUINIELA BLOQUEADA' : 'GUARDAR Y BLOQUEAR'}
                                    </button>
                                </div>

                                {partidos.length === 0 ? (
                                    <div className="text-center py-16 opacity-70 bg-black/10 rounded-3xl border border-white/10"><p className="font-display text-xl font-bold">El torneo está vacío.</p></div>
                                ) : (
                                    gruposNombres.map(grupo => (
                                        <div key={grupo} className="mb-12">
                                            <h2 className="text-3xl font-display font-black text-white mb-6 border-b border-white/10 pb-2 drop-shadow-md">{grupo}</h2>
                                            
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                {partidos.filter(p => p.grupo === grupo).map(partido => {
                                                    const miPick = profile.picks?.[partido.id];

                                                    return (
                                                        <div key={partido.id} className={`panini-card rounded-3xl p-5 flex flex-col relative overflow-hidden transition-all ${profile.locked ? 'opacity-90' : 'hover:-translate-y-1'}`}>
                                                            {profile.locked && <div className="absolute inset-0 bg-black/10 pointer-events-none z-10"></div>}
                                                            {partido.estado === 'finalizado' && <div className="absolute top-0 right-0 bg-[#D31145] text-white text-[9px] px-2 py-1 font-black uppercase tracking-widest rounded-bl-lg z-20">Finalizado</div>}
                                                            
                                                            <div className="w-full flex justify-between items-center mb-6 border-b border-[#C5A97D]/20 pb-3">
                                                                <div className="flex flex-col gap-1">
                                                                    <div className="flex items-center gap-1 text-[#C5A97D] text-[10px] font-black tracking-widest uppercase"><Icon name="calendar" size={12}/> {partido.fecha}</div>
                                                                    <div className="flex items-center gap-1 text-[#C5A97D] text-[10px] font-black tracking-widest uppercase"><Icon name="clock" size={12}/> {partido.hora}</div>
                                                                </div>
                                                                <div className="flex items-center gap-1 text-white/50 text-[10px] font-black tracking-widest uppercase text-right max-w-[50%]"><Icon name="map-pin" size={12}/> {partido.sede}</div>
                                                            </div>

                                                            <div className="flex items-center justify-between w-full gap-2 mb-8">
                                                                <div className="flex-1 flex flex-col items-center gap-2">
                                                                    <span className="text-4xl drop-shadow-md">{getBandera(partido.local)}</span>
                                                                    <span className="font-black text-sm text-center w-full text-white/90 leading-tight">{partido.local}</span>
                                                                </div>
                                                                
                                                                <div className="flex flex-col items-center justify-center mx-2 w-16">
                                                                    <span className="text-[#C5A97D] font-display font-black text-2xl drop-shadow-sm opacity-60">VS</span>
                                                                </div>

                                                                <div className="flex-1 flex flex-col items-center gap-2">
                                                                    <span className="text-4xl drop-shadow-md">{getBandera(partido.visitante)}</span>
                                                                    <span className="font-black text-sm text-center w-full text-white/90 leading-tight">{partido.visitante}</span>
                                                                </div>
                                                            </div>

                                                            <div className="grid grid-cols-3 gap-2 border-t border-white/5 pt-4">
                                                                <button onClick={() => guardarTendencia(partido.id, 'local')} disabled={profile.locked || partido.estado==='finalizado'} className={`py-3 rounded-xl text-xs font-black uppercase tracking-widest transition-all ${miPick === 'local' ? 'bg-[#D31145] text-white shadow-[0_4px_10px_rgba(211,17,69,0.5)] scale-105' : 'bg-black/40 text-white/50 hover:bg-black/60'}`}>Local</button>
                                                                
                                                                <button onClick={() => guardarTendencia(partido.id, 'empate')} disabled={profile.locked || partido.estado==='finalizado'} className={`py-3 rounded-xl text-xs font-black uppercase tracking-widest transition-all ${miPick === 'empate' ? 'bg-[#C5A97D] text-[#53121F] shadow-[0_4px_10px_rgba(197,169,125,0.4)] scale-105' : 'bg-black/40 text-white/50 hover:bg-black/60'}`}>Empate</button>
                                                                
                                                                <button onClick={() => guardarTendencia(partido.id, 'visitante')} disabled={profile.locked || partido.estado==='finalizado'} className={`py-3 rounded-xl text-xs font-black uppercase tracking-widest transition-all ${miPick === 'visitante' ? 'bg-[#00623B] text-white shadow-[0_4px_10px_rgba(0,98,59,0.5)] scale-105' : 'bg-black/40 text-white/50 hover:bg-black/60'}`}>Visita</button>
                                                            </div>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}

                        {/* ====== FASE ELIMINATORIA ====== */}
                        {activeTab === 'eliminatoria' && (
                            <div className="panini-card border-none p-10 rounded-3xl text-center flex flex-col items-center animate-fade-in mt-8 relative">
                                <Icon name="lock" size={64} className="text-[#C5A97D] mb-6 opacity-90 drop-shadow-lg" />
                                <h3 className="text-3xl font-display font-black mb-4 text-white">FASE BLOQUEADA</h3>
                                <p className="text-white/80 font-bold max-w-md mx-auto">Las llaves se desbloquearán el <span className="text-white bg-[#D31145] px-2 py-1 rounded-md mx-1 font-black">28 de Junio de 2026</span> una vez que la FIFA anuncie los clasificados.</p>
                            </div>
                        )}

                        {/* ====== RANKING ====== */}
                        {activeTab === 'ranking' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="panini-gradient p-8 rounded-3xl shadow-xl text-center relative mb-8 border border-[#C5A97D]/50">
                                    <h2 className="font-display font-black text-4xl mb-2 text-white drop-shadow-lg uppercase tracking-tight">Ranking Oficial</h2>
                                    <p className="text-[#C5A97D] text-xs font-black tracking-widest uppercase">Solo quinielas bloqueadas participan</p>
                                    <button onClick={() => { if(prompt("Contraseña:")==="26zorras27") setShowAdminModal(true); }} className="absolute top-4 right-4 bg-black/40 hover:bg-black/70 text-white/90 border border-[#C5A97D]/30 px-4 py-2 rounded-xl text-xs font-black tracking-widest transition-all backdrop-blur-sm">⚙️ ADMIN</button>
                                </div>
                                
                                {!profile.locked && (
                                    <div className="bg-red-900/40 border border-red-500/50 p-6 rounded-2xl text-center mb-6">
                                        <p className="text-white font-bold"><Icon name="alert-circle" className="inline mr-2 mb-1 text-red-400"/>Aún no apareces en el ranking. Debes ir a la Fase de Grupos y presionar "Guardar y Bloquear".</p>
                                    </div>
                                )}
                                
                                <div className="space-y-4">
                                    {Object.values(predicciones).filter(j => j.locked).sort((a,b) => (b.puntos||0) - (a.puntos||0)).map((jugador, idx) => (
                                        <div key={jugador.id} className={`p-5 rounded-3xl flex items-center justify-between shadow-lg transition-transform ${jugador.id === profile.id ? 'bg-white text-black ring-4 ring-[#D31145] scale-[1.02]' : 'panini-card text-white'}`}>
                                            <div className="flex items-center gap-5">
                                                <span className={`font-display font-black text-4xl w-12 text-center ${jugador.id === profile.id ? 'text-[#00623B]' : 'text-[#C5A97D]'}`}>{idx + 1}</span>
                                                <div>
                                                    <div className="flex items-center gap-3">
                                                        <span className="font-black text-xl uppercase truncate max-w-[180px]">{jugador.username}</span>
                                                        {jugador.id === profile.id && <span className="bg-[#D31145] text-white text-[10px] font-black px-2 py-0.5 rounded">TÚ</span>}
                                                    </div>
                                                    <span className={`text-xs font-bold uppercase tracking-wider ${jugador.id === profile.id ? 'text-gray-500' : 'text-[#C5A97D]/70'}`}><Icon name="lock" size={10} className="inline mr-1"/>Quiniela Bloqueada</span>
                                                </div>
                                            </div>
                                            <div className="text-right pr-4">
                                                <div className="font-display font-black text-5xl leading-none">{jugador.puntos || 0}</div>
                                                <div className={`text-[10px] font-black tracking-widest uppercase mt-1 ${jugador.id === profile.id ? 'text-[#D31145]' : 'text-white/50'}`}>Puntos</div>
                                            </div>
                                        </div>
                                    ))}
                                    {Object.values(predicciones).filter(j => j.locked).length === 0 && <p className="text-center text-white/50 font-bold py-10">Nadie ha bloqueado su quiniela aún.</p>}
                                </div>
                            </div>
                        )}
                    </main>

                    <div className="fixed bottom-2 right-4 text-[10px] text-white/10 font-black uppercase tracking-widest pointer-events-none z-0">zorras</div>

                    {/* ====== MODAL ADMIN ====== */}
                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-[#53121F] border-2 border-[#C5A97D] p-6 rounded-3xl max-w-md w-full relative">
                                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-white/50 bg-black/20 rounded-full p-2"><Icon name="x" size={24} /></button>
                                <h2 className="font-display font-black text-2xl text-white mb-6 border-b border-[#C5A97D]/20 pb-4">Panel de Control</h2>
                                
                                <div className="space-y-6 max-h-[65vh] overflow-y-auto pr-2 custom-scrollbar">
                                    
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Motor de Resultados</p>
                                        <button onClick={handleSyncAPI} disabled={isSyncing} className="w-full bg-[#00623B] text-white font-black py-3 rounded-xl shadow-lg mb-3 disabled:opacity-50 flex justify-center items-center gap-2">
                                            <Icon name={isSyncing ? "loader" : "globe"} size={16} className={isSyncing ? "animate-spin" : ""} /> 1. Sincronizar API en vivo
                                        </button>
                                        <button onClick={calcularPuntosGlobal} className="w-full bg-[#C5A97D] text-[#53121F] font-black py-3 rounded-xl shadow-lg">2. Forzar Recálculo Puntos</button>
                                    </div>

                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Torneo Base Oficial FIFA</p>
                                        <button onClick={borrarTodosLosPartidos} className="w-full bg-transparent border border-[#D31145] text-[#D31145] font-black py-2 rounded-xl hover:bg-[#D31145] hover:text-white transition-all mb-3">Borrar Todo</button>
                                        <button onClick={cargarPartidosBase} className="w-full bg-white text-[#00623B] font-black py-3 rounded-xl shadow-lg">Generar 72 Partidos Reales</button>
                                    </div>

                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Gestionar Usuarios</p>
                                        <div className="space-y-2">
                                            {Object.values(predicciones).map(j => (
                                                <div key={j.id} className="flex justify-between items-center bg-black/40 p-3 rounded-xl border border-white/5">
                                                    <span className="font-bold text-sm uppercase truncate max-w-[150px]">{j.username}</span>
                                                    <button onClick={() => handleDeleteUser(j.id, j.username)} className="bg-[#D31145] text-white px-3 py-1.5 rounded-lg text-xs font-black hover:bg-red-700 transition-colors">
                                                        Eliminar
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
