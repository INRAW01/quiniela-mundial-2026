    <script type="text/babel">

                'eye': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>,
                'x': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
                'check': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
                'search': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
                'flame': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>,
                'target': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>,
                'trending-up': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
            };
            return icons[name] || <svg width={size} height={size}></svg>;
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDdCGvIAt4A5AyF_yOvR5SPJsgPtMWpCYY",
            authDomain: "quiniela-2026-59b53.firebaseapp.com",
            projectId: "quiniela-2026-59b53",
            storageBucket: "quiniela-2026-59b53.firebasestorage.app",
            messagingSenderId: "1075755299669",
            appId: "1:1075755299669:web:f565bbd29ee371e60235dc"
        };

        let db = null;
        let auth = null;

        try {
            if (window.firebase) {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
            }
        } catch (e) {
            console.error("Error Firebase:", e);
        }

        const safeStorage = {
            get: function(key) { try { return window.localStorage.getItem(key); } catch(e) { return null; } },
            set: function(key, val) { try { window.localStorage.setItem(key, val); } catch(e) {} },
            remove: function(key) { try { window.localStorage.removeItem(key); } catch(e) {} }
        };

        const BANDERAS = {
            'México': '🇲🇽', 'Sudáfrica': '🇿🇦', 'Corea del Sur': '🇰🇷', 'República Checa': '🇨🇿',
            'Canadá': '🇨🇦', 'Bosnia y Herzegovina': '🇧🇦', 'Catar': '🇶🇦', 'Suiza': '🇨🇭',
            'Brasil': '🇧🇷', 'Marruecos': '🇲🇦', 'Haití': '🇭🇹', 'Escocia': '🏴󠁧󠁢󠁳󠁣󠁴󠁿',
            'Estados Unidos': '🇺🇸', 'Paraguay': '🇵🇾', 'Australia': '🇦🇺', 'Turquía': '🇹🇷',
            'Alemania': '🇩🇪', 'Curazao': '🇨🇼', 'Costa de Marfil': '🇨🇮', 'Ecuador': '🇪🇨',
            'Países Bajos': '🇳🇱', 'Japón': '🇯🇵', 'Túnez': '🇹🇳', 'Suecia': '🇸🇪',
            'Bélgica': '🇧🇪', 'Egipto': '🇪🇬', 'Irán': '🇮🇷', 'Nueva Zelanda': '🇳🇿',
            'España': '🇪🇸', 'Cabo Verde': '🇨🇻', 'Arabia Saudita': '🇸🇦', 'Uruguay': '🇺🇾',
            'Francia': '🇫🇷', 'Senegal': '🇸🇳', 'Noruega': '🇳🇴', 'Irak': '🇮🇶',
            'Argentina': '🇦🇷', 'Argelia': '🇩🇿', 'Austria': '🇦🇹', 'Jordania': '🇯🇴',
            'Portugal': '🇵🇹', 'Uzbekistán': '🇺🇿', 'Colombia': '🇨🇴', 'RD Congo': '🇨🇩',
            'Inglaterra': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'Croacia': '🇭🇷', 'Ghana': '🇬🇭', 'Panamá': '🇵🇦'
        };
        const getBandera = (pais) => BANDERAS[pais] || '🏳️';

        const normalizeName = (str) => {
            if(!str) return "";
            return String(str).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        };

        // Función vital para calcular el milisegundo exacto de inicio del partido
        const getMatchTimestamp = (fechaStr, horaStr) => {
            if (!fechaStr || !horaStr) return Infinity;
            let str = String(fechaStr).toLowerCase().replace(/ de /g, ' ').replace(/,/g, '');
            const partes = str.split(' ').filter(p => p);
            if (partes.length >= 3) {
                let dia = parseInt(partes[0]);
                let mesStr = partes[1].substring(0,3);
                const mesesMap = { 'ene':0, 'feb':1, 'mar':2, 'abr':3, 'may':4, 'jun':5, 'jul':6, 'ago':7, 'sep':8, 'oct':9, 'nov':10, 'dic':11 };
                let mes = mesesMap[mesStr] !== undefined ? mesesMap[mesStr] : 5; 
                let ano = parseInt(partes[2]); if(ano < 2000) ano = 2026;
                const [h, m] = horaStr.split(':').map(Number);
                return new Date(ano, mes, dia, h || 12, m || 0, 0).getTime();
            }
            return Infinity;
        };

        const parseFechaEs = (fechaStr) => {
            const ts = getMatchTimestamp(fechaStr, "12:00");
            return ts !== Infinity ? ts : 0;
        };

        const TRADUCTOR_API = {
            "usa": "estados unidos", "united states": "estados unidos", "south africa": "sudafrica", "south korea": "corea del sur", 
            "korea republic": "corea del sur", "czechia": "republica checa", "czech republic": "republica checa", 
            "bosnia and herzegovina": "bosnia y herzegovina", "qatar": "catar", "switzerland": "suiza", "brazil": "brasil",
            "morocco": "marruecos", "scotland": "escocia", "turkiye": "turquia", "turkey": "turquia", "germany": "alemania", 
            "cote d'ivoire": "costa de marfil", "ivory coast": "costa de marfil", "netherlands": "paises bajos", "japan": "japon", 
            "tunisia": "tunez", "sweden": "suecia", "belgium": "belgica", "egypt": "egipto", "ir iran": "iran", "iran": "iran",
            "new zealand": "nueva zelanda", "spain": "espana", "cape verde": "cabo verde", "saudi arabia": "arabia saudita", 
            "france": "francia", "norway": "noruega", "iraq": "irak", "algeria": "argelia", "jordan": "jordania", 
            "uzbekistan": "uzbekistan", "congo dr": "rd congo", "dr congo": "rd congo", "england": "inglaterra", "croatia": "croacia"
        };

        const traducirNombre = (nombreIngles) => {
            const normalizado = normalizeName(nombreIngles);
            return TRADUCTOR_API[normalizado] || normalizado;
        };

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#53121F]">
                        <Icon name="alert-triangle" size={64} className="text-[#C5A97D] mb-4 mx-auto" />
                        <h1 className="text-2xl font-black text-white mb-2">Error de Ejecución</h1>
                        <button onClick={() => window.location.reload()} className="bg-[#D31145] text-white px-6 py-3 rounded-xl font-black shadow-lg">REINICIAR</button>
                    </div>
                );
                return this.props.children;
            }
        }

        const App = () => {
            const [user, setUser] = React.useState(null);
            const [username, setUsername] = React.useState("");
            const [profile, setProfile] = React.useState(null);
            const [partidos, setPartidos] = React.useState([]);
            const [predicciones, setPredicciones] = React.useState({});
            
            const [isLoading, setIsLoading] = React.useState(true);
            const [isLoginExiting, setIsLoginExiting] = React.useState(false);
            const [showAdminModal, setShowAdminModal] = React.useState(false);
            const [isSyncing, setIsSyncing] = React.useState(false);
            const [currentTime, setCurrentTime] = React.useState(Date.now());
            
            const [spyUser, setSpyUser] = React.useState(null); 
            const [spySearchTerm, setSpySearchTerm] = React.useState("");
            const [spyFilter, setSpyFilter] = React.useState("all");
            
            // VARIABLES GLOBALES Y DE ADMINISTRADOR
            const [modoEspiaActivo, setModoEspiaActivo] = React.useState(false);
            const [premioMxn, setPremioMxn] = React.useState("$4,000");
            const [premioCrc, setPremioCrc] = React.useState("100,000");
            const [inputMxn, setInputMxn] = React.useState("$4,000");
            const [inputCrc, setInputCrc] = React.useState("100,000");
            
            // VISIBILIDAD DE PESTAÑAS (Modo Director)
            const [visibilidad, setVisibilidad] = React.useState({ grupos: true, ranking_grupos: true, eliminatoria: false, ranking_eliminatoria: false });
            const [inputVisibilidad, setInputVisibilidad] = React.useState({ grupos: true, ranking_grupos: true, eliminatoria: false, ranking_eliminatoria: false });
            const [activeTab, setActiveTab] = React.useState('grupos');

            const partidosRef = React.useRef([]);
            React.useEffect(() => { partidosRef.current = partidos; }, [partidos]);

            // Reloj en vivo para bloquear partidos (actualiza cada 15 segundos)
            React.useEffect(() => {
                const interval = setInterval(() => setCurrentTime(Date.now()), 15000);
                return () => clearInterval(interval);
            }, []);

            const hoyParseado = React.useMemo(() => {
                const hoy = new Date();
                return new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate(), 12, 0, 0).getTime();
            }, []);

            React.useEffect(() => {
                if (spyUser || showAdminModal) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = '';
                }
                return () => { document.body.style.overflow = ''; };
            }, [spyUser, showAdminModal]);

            // CÁLCULO PUNTOS: FASE DE GRUPOS (1 Punto por Tendencia)
            const calcularPuntosGrupos = (jugador) => {
                if (!partidos || partidos.length === 0) return 0;
                let aciertos = 0;
                const picks = jugador.picks || {};
                
                partidos.filter(p => String(p.grupo).toLowerCase().includes('grupo')).forEach(p => {
                    if (p.estado === 'finalizado') {
                        const suPick = picks[p.id];
                        if (suPick) {
                            let gl = Number(p.golesL_real); let gv = Number(p.golesV_real);
                            let resultadoReal = gl > gv ? 'local' : (gl < gv ? 'visitante' : 'empate');
                            if (resultadoReal === suPick) aciertos++;
                        }
                    }
                });
                return aciertos;
            };

            // CÁLCULO PUNTOS: FASE ELIMINATORIA (3 Exacto / 1 Tendencia)
            const calcularPuntosEliminatoria = (jugador) => {
                if (!partidos || partidos.length === 0) return { total: 0, exactos: 0, tendencias: 0 };
                let total = 0; let exactos = 0; let tendencias = 0;
                const picks = jugador.picks_eliminatoria || {};
                
                partidos.filter(p => !String(p.grupo).toLowerCase().includes('grupo')).forEach(p => {
                    if (p.estado === 'finalizado') {
                        const suPick = picks[p.id];
                        if (suPick && suPick.l !== undefined && suPick.v !== undefined) {
                            let rL = Number(p.golesL_real); let rV = Number(p.golesV_real);
                            let pL = Number(suPick.l); let pV = Number(suPick.v);
                            
                            let realTend = rL > rV ? 'L' : rL < rV ? 'V' : 'E';
                            let pickTend = pL > pV ? 'L' : pL < pV ? 'V' : 'E';
                            
                            if (rL === pL && rV === pV) {
                                total += 3; exactos++;
                            } else if (realTend === pickTend) {
                                total += 1; tendencias++;
                            }
                        }
                    }
                });
                return { total, exactos, tendencias };
            };

            React.useEffect(() => {
                if (!auth || !db) { setIsLoading(false); return; }

                const checarYRecuperarSesion = async (u) => {
                    try {
                        const savedUid = safeStorage.get('quiniela_user_uid');
                        if (savedUid && !u) {
                            await auth.signInAnonymously();
                            return; 
                        }
                        const uidActivo = savedUid || (u ? u.uid : null);
                        if (uidActivo) {
                            const doc = await db.collection('usuarios').doc(uidActivo).get();
                            if (doc.exists) { 
                                setProfile({ id: uidActivo, ...doc.data() }); 
                                setUser({ uid: uidActivo }); 
                            } else {
                                safeStorage.remove('quiniela_user_uid');
                                setUser(null);
                                setProfile(null);
                            }
                        }
                    } catch(e) { console.error(e); } finally { setIsLoading(false); }
                };

                const unsubAuth = auth.onAuthStateChanged((u) => checarYRecuperarSesion(u));
                return () => unsubAuth();
            }, []);

            React.useEffect(() => {
                if (!user || !db) return;
                
                const unsubPartidos = db.collection('partidos').onSnapshot(
                    snap => {
                        const pts = [];
                        snap.forEach(d => pts.push({ id: d.id, ...d.data() }));
                        setPartidos(pts);
                    },
                    err => console.error(err)
                );

                const unsubPreds = db.collection('usuarios').onSnapshot(
                    snap => {
                        const data = {};
                        snap.forEach(d => data[d.id] = { id: d.id, ...d.data() });
                        setPredicciones(data);
                        if (data[user.uid]) setProfile(data[user.uid]);
                    },
                    err => console.error(err)
                );

                return () => { unsubPartidos(); unsubPreds(); };
            }, [user]);

            React.useEffect(() => {
                if (!db) return;
                const unsubConfig = db.collection('sistema').doc('configuracion').onSnapshot(
                    doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            setModoEspiaActivo(data.modo_espia_activo || false);
                            setPremioMxn(data.premio_mxn || "$4,000");
                            setPremioCrc(data.premio_crc || "100,000");
                            if (data.visibilidad) {
                                setVisibilidad(data.visibilidad);
                                setInputVisibilidad(data.visibilidad);
                                // Si la pestaña actual se ocultó, mover al usuario a la primera disponible
                                if (!data.visibilidad[activeTab]) {
                                    if(data.visibilidad.grupos) setActiveTab('grupos');
                                    else if(data.visibilidad.eliminatoria) setActiveTab('eliminatoria');
                                }
                            }
                        }
                    },
                    err => console.error(err)
                );
                return () => unsubConfig();
            }, [activeTab]);

            React.useEffect(() => { setInputMxn(premioMxn); setInputCrc(premioCrc); }, [premioMxn, premioCrc]);

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!db || !auth) return;
                const inputName = username.trim();
                if (!inputName) return;
                setIsLoading(true);
                
                try {
                    if (!auth.currentUser) await auth.signInAnonymously();
                    const allUsersSnap = await db.collection('usuarios').get();
                    const existingUser = allUsersSnap.docs.find(doc => doc.data().username.toLowerCase() === inputName.toLowerCase());
                    let currentUserUid = existingUser ? existingUser.id : auth.currentUser.uid;

                    if (!existingUser) {
                        await db.collection('usuarios').doc(currentUserUid).set({
                            username: inputName, picks: {}, picks_eliminatoria: {}, puntos: 0, locked: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    setUser({ uid: currentUserUid });
                    safeStorage.set('quiniela_user_uid', currentUserUid);
                    const doc = await db.collection('usuarios').doc(currentUserUid).get();
                    setProfile({ id: currentUserUid, ...doc.data() });
                    setIsLoginExiting(true); 
                    setTimeout(() => { setIsLoginExiting(false); setIsLoading(false); }, 500);
                } catch (error) { setIsLoading(false); }
            };
            
            const guardarTendencia = async (partidoId, tendencia) => {
                if (!profile || profile.locked || !db) return;
                const picksActuales = profile.picks || {};
                const nuevoPick = { ...picksActuales, [partidoId]: tendencia };
                await db.collection('usuarios').doc(user.uid).update({ picks: nuevoPick });
            };

            const guardarMarcadorEliminatoria = async (partidoId, localValue, visitanteValue) => {
                if (!profile || !db) return;
                const picksActuales = profile.picks_eliminatoria || {};
                const currentPick = picksActuales[partidoId] || {};
                const newPick = { 
                    l: localValue !== '' ? Number(localValue) : currentPick.l, 
                    v: visitanteValue !== '' ? Number(visitanteValue) : currentPick.v 
                };
                await db.collection('usuarios').doc(user.uid).update({ picks_eliminatoria: { ...picksActuales, [partidoId]: newPick } });
            };

            const handleBloquearQuiniela = async () => {
                if (!db || !profile) return;
                const totalPicks = Object.keys(profile.picks || {}).length;

            const handleCloseSpy = () => { setSpyUser(null); setSpySearchTerm(""); setSpyFilter("all"); };

            // MOTOR DE API: ACTUALIZA GOLES Y BUSCA LLAVES NUEVAS
            const handleGenerarLlavesAPI = async () => {
                if (!db) return;
                setIsSyncing(true);
                try {
                    const res = await fetch("/api/sync-matches");
                    const data = await res.json();
                    if (!data.matches) return;

                    const batch = db.batch();
                    let agregados = 0;

                    // Fases eliminatorias comunes en APIs (adaptar según la tuya)
                    const stagesEliminatoria = ["LAST_32", "LAST_16", "QUARTER_FINALS", "SEMI_FINALS", "FINAL", "THIRD_PLACE"];
                    
                    data.matches.forEach(match => {
                        if (stagesEliminatoria.includes(match.stage)) {
                            const matchId = `elim_${match.id}`; // ID único
                            const ref = db.collection('partidos').doc(matchId);
                            
                            // Traducir nombre de la fase
                            let faseNombre = match.stage;
                            if(faseNombre === "LAST_32") faseNombre = "Dieciseisavos de Final";
                            if(faseNombre === "LAST_16") faseNombre = "Octavos de Final";
                            if(faseNombre === "QUARTER_FINALS") faseNombre = "Cuartos de Final";
                            if(faseNombre === "SEMI_FINALS") faseNombre = "Semifinales";
                            if(faseNombre === "FINAL") faseNombre = "Gran Final";

                            // Convertir fecha UTC de la API a formato legible local
                            const dateObj = new Date(match.utcDate);
                            const dia = dateObj.getDate();
                            const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
                            const mes = meses[dateObj.getMonth()];
                            const anio = dateObj.getFullYear();
                            const h = String(dateObj.getHours()).padStart(2, '0');
                            const m = String(dateObj.getMinutes()).padStart(2, '0');
                            
                            const pLocal = traducirNombre(match.homeTeam.name);
                            const pVisitante = traducirNombre(match.awayTeam.name);

                            // Solo lo agregamos si ya sabemos qué equipos juegan
                            if (pLocal && pVisitante && !pLocal.includes("Winner") && !pVisitante.includes("Winner")) {
                                batch.set(ref, {
                                    grupo: faseNombre,
                                    local: pLocal,
                                    visitante: pVisitante,
                                    fecha: `${dia} ${mes} ${anio}`,
                                    hora: `${h}:${m}`,
                                    sede: "Por definir",
                                    estado: match.status === 'FINISHED' ? 'finalizado' : 'pendiente',
                                    golesL_real: match.status === 'FINISHED' && match.score?.fullTime?.home !== null ? match.score.fullTime.home : null,
                                    golesV_real: match.status === 'FINISHED' && match.score?.fullTime?.away !== null ? match.score.fullTime.away : null
                                }, { merge: true }); // Merge asegura que no borramos si ya existía
                                agregados++;
                            }
                        }
                    });
                    
                    if (agregados > 0) {
                        await batch.commit();
                        alert(`¡Sincronización completa! Se procesaron ${agregados} llaves eliminatorias.`);
                    } else {
                        alert("No se encontraron nuevas llaves definidas en la API todavía.");
                    }
                } catch (error) {
                    console.error(error);
                    alert("Error consultando la API de llaves.");

            const ordenarPartidosEspecial = (listaPartidos) => {

                    const tB = parseFechaEs(b.fecha);
                    const esHoyA = tA === hoyParseado;
                    const esHoyB = tB === hoyParseado;
                    if (esHoyA && !esHoyB) return -1;
                    if (!esHoyA && esHoyB) return 1;
                    if (tA !== tB) return tA - tB;
                    return parseInt(a.hora) - parseInt(b.hora);

                                <div className="space-y-4">
                                    {rankingGrupos.map((jugador, idx) => (
                                        <div key={jugador.id} onClick={() => { if (modoEspiaActivo || jugador.id === (profile && profile.id)) setSpyUser(jugador); else alert("El Modo Espía está bloqueado."); }} className={`cursor-pointer p-4 rounded-3xl flex items-center justify-between transition-all transform hover:scale-[1.02] shadow-lg ${idx === 0 ? 'bg-gradient-to-r from-[#033B25] to-[#53121F] border-2 border-[#C5A97D]' : jugador.id === (profile && profile.id) ? 'bg-white text-black ring-4 ring-[#D31145]' : 'bg-[#033B25] border border-white/5 text-white'}`}>
                                            <div className="flex items-center gap-4">
                                                <div className={`w-12 shrink-0 flex items-center justify-center font-display font-black text-5xl md:text-6xl ${idx === 0 ? 'text-[#C5A97D]' : idx === 1 ? 'text-gray-300' : idx === 2 ? 'text-[#CD7F32]' : 'text-white/20 text-4xl'}`}>
                                                    {idx + 1}
                                                </div>
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-black text-xl uppercase truncate max-w-[140px] md:max-w-[200px]">{jugador.username}</span>
                                                        {jugador.id === (profile && profile.id) && <span className="bg-[#D31145] text-white text-[10px] font-black px-2 py-0.5 rounded">TÚ</span>}
                                                    </div>
                                                    <span className="text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 opacity-70">
                                                        <Icon name={modoEspiaActivo || jugador.id === (profile && profile.id) ? "eye" : "lock"} size={12} /> {modoEspiaActivo || jugador.id === (profile && profile.id) ? 'Toca para espiar' : 'Bloqueado 🔒'}
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="text-right pr-2">
                                                <div className="font-display font-black text-4xl leading-none">{jugador.puntosCalculados}</div>
                                                <div className="text-[10px] font-black tracking-widest uppercase mt-1">Puntos</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* --- TAB: FASE ELIMINATORIA (NUEVA) --- */}
                        {activeTab === 'eliminatoria' && (
                            <div className="animate-fade-in">
                                <div className="bg-gradient-to-r from-[#53121F] to-[#033B25] p-6 rounded-3xl border border-[#C5A97D] flex flex-col items-center mb-8 shadow-2xl relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-[#C5A97D] opacity-10 rounded-full blur-3xl transform translate-x-10 -translate-y-10"></div>
                                    <h3 className="text-3xl font-display font-black text-[#C5A97D] uppercase tracking-widest drop-shadow-lg mb-2">Fase Eliminatoria</h3>
                                    <p className="text-sm text-white/90 font-bold mb-4 text-center max-w-md">Ingresa el marcador exacto de los 90 minutos. Las tarjetas se auto-bloquean 60 segundos antes de cada partido.</p>
                                    <div className="flex gap-4 text-[10px] font-black uppercase tracking-widest">
                                        <div className="bg-black/40 px-3 py-2 rounded-xl border border-white/10"><span className="text-[#C5A97D] text-sm mr-1">🎯 3</span>Pts Exacto</div>
                                        <div className="bg-black/40 px-3 py-2 rounded-xl border border-white/10"><span className="text-white text-sm mr-1">📈 1</span>Pt Tendencia</div>
                                    </div>
                                </div>

                                {partidosEliminatoria.length === 0 ? <div className="text-center py-16 opacity-70"><p className="font-display font-bold">Esperando que se definan las llaves oficiales...</p></div> : 
                                    eliminatoriasNombres.map(fase => {
                                        const pFase = partidosEliminatoria.filter(p => p.grupo === fase).sort((a,b)=>parseFechaEs(a.fecha)-parseFechaEs(b.fecha) || parseInt(a.hora)-parseInt(b.hora));
                                        return (
                                            <div key={fase} className="mb-12">
                                                <h2 className="text-3xl font-display font-black text-white mb-6 border-b border-[#C5A97D]/30 pb-2 drop-shadow-md flex items-center gap-3"><Icon name="flame" className="text-[#C5A97D]"/>{fase}</h2>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    {pFase.map(partido => {
                                                        const miPick = profile.picks_eliminatoria && profile.picks_eliminatoria[partido.id];
                                                        
                                                        // RELOJ DE AUTO-BLOQUEO (60 segundos)
                                                        const tsPartido = getMatchTimestamp(partido.fecha, partido.hora);
                                                        const cerradoPorTiempo = currentTime >= (tsPartido - 60000);
                                                        const bloqueado = partido.estado === 'finalizado' || cerradoPorTiempo;

                                                        return (
                                                            <div key={partido.id} className={`bg-[#021A10] border rounded-3xl p-6 relative overflow-hidden transition-all ${bloqueado ? 'border-white/10 opacity-90' : 'border-[#C5A97D]/40 shadow-[0_10px_30px_rgba(197,169,125,0.1)] hover:-translate-y-1'}`}>
                                                                <div className="flex justify-between items-center mb-6 border-b border-[#C5A97D]/10 pb-3">
                                                                    <div className="flex gap-3 text-[#C5A97D] text-[10px] font-black uppercase tracking-wider">
                                                                        <span className="flex items-center gap-1"><Icon name="calendar" size={14}/> {partido.fecha}</span>
                                                                        <span className="flex items-center gap-1"><Icon name="clock" size={14}/> {partido.hora}</span>
                                                                    </div>
                                                                    {bloqueado ? 
                                                                        <span className="bg-black/60 text-red-400 text-[10px] px-3 py-1.5 rounded-full font-black uppercase flex items-center gap-1 border border-red-900/50"><Icon name="lock" size={12}/> Cerrado</span>
                                                                    : 
                                                                        <span className="bg-[#00623B] text-green-300 text-[10px] px-3 py-1.5 rounded-full font-black uppercase flex items-center gap-1 animate-pulse"><Icon name="unlock" size={12}/> Abierto</span>
                                                                    }
                                                                </div>

                                                                <div className="flex items-center justify-between gap-4">
                                                                    <div className="flex flex-col items-center gap-2 w-1/3">
                                                                        <span className="text-5xl drop-shadow-lg">{getBandera(partido.local)}</span>
                                                                        <span className="font-black text-xs text-center uppercase tracking-wide truncate w-full text-white/90">{partido.local}</span>
                                                                    </div>
                                                                    
                                                                    <div className="flex items-center gap-3 w-1/3 justify-center">
                                                                        <input type="number" min="0" max="15" disabled={bloqueado} value={miPick?.l !== undefined ? miPick.l : ''} onChange={(e) => guardarMarcadorEliminatoria(partido.id, e.target.value, '')} className={`w-14 h-16 text-center text-2xl font-display font-black rounded-xl outline-none transition-all ${bloqueado ? 'bg-black/30 text-white/50 border border-white/5' : 'bg-black/50 text-white border-2 border-[#C5A97D] focus:border-[#D31145] focus:bg-[#53121F]/20'}`} />
                                                                        <span className="text-[#C5A97D]/50 font-display font-black text-lg">-</span>
                                                                        <input type="number" min="0" max="15" disabled={bloqueado} value={miPick?.v !== undefined ? miPick.v : ''} onChange={(e) => guardarMarcadorEliminatoria(partido.id, '', e.target.value)} className={`w-14 h-16 text-center text-2xl font-display font-black rounded-xl outline-none transition-all ${bloqueado ? 'bg-black/30 text-white/50 border border-white/5' : 'bg-black/50 text-white border-2 border-[#C5A97D] focus:border-[#D31145] focus:bg-[#53121F]/20'}`} />
                                                                    </div>

                                                                    <div className="flex flex-col items-center gap-2 w-1/3">
                                                                        <span className="text-5xl drop-shadow-lg">{getBandera(partido.visitante)}</span>
                                                                        <span className="font-black text-xs text-center uppercase tracking-wide truncate w-full text-white/90">{partido.visitante}</span>
                                                                    </div>
                                                                </div>
                                                                {!bloqueado && <p className="text-center text-[9px] text-[#C5A97D]/60 mt-6 font-bold uppercase tracking-widest">Se guarda automático</p>}
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                        )
                                    })
                                }
                            </div>
                        )}

                        {/* --- TAB: RANKING ELIMINATORIA (NUEVO) --- */}
                        {activeTab === 'ranking_eliminatoria' && (
                            <div className="space-y-4 animate-fade-in pb-10">
                                <div className="bg-[#021A10] p-8 rounded-3xl text-center relative mb-10 border-4 border-[#C5A97D] shadow-2xl overflow-hidden">
                                    <h2 className="font-display font-black text-sm text-[#C5A97D] uppercase tracking-[0.3em] mb-2">Gran Premio Final</h2>
                                    <div className="font-display font-black text-6xl md:text-7xl text-white tracking-tighter leading-none">{premioMxn}<span className="text-3xl ml-1">MXN</span></div>
                                </div>
                                
                                <div className="space-y-4">
                                    {rankingEliminatoria.map((jugador, idx) => (
                                        <div key={`rk2-${jugador.id}`} className={`p-5 rounded-3xl flex flex-col shadow-xl ${idx === 0 ? 'bg-gradient-to-br from-[#C5A97D] to-[#8C734A] text-[#53121F]' : jugador.id === profile?.id ? 'bg-[#53121F] text-white ring-2 ring-[#C5A97D]' : 'bg-black/40 border border-white/5 text-white'}`}>
                                            <div className="flex items-center justify-between mb-3 border-b border-current pb-3 border-opacity-20">
                                                <div className="flex items-center gap-4">
                                                    <div className="font-display font-black text-4xl">{idx + 1}</div>
                                                    <span className="font-black text-xl uppercase leading-none">{jugador.username}</span>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-display font-black text-5xl leading-none">{jugador.puntosFase2}</div>
                                                    <div className="text-[10px] font-black tracking-widest uppercase">Pts Totales</div>
                                                </div>
                                            </div>
                                            <div className="flex justify-between items-center bg-black/20 rounded-xl p-3">
                                                <div className="flex gap-4">
                                                    <div className="flex flex-col leading-none">
                                                        <span className="font-black text-sm">{jugador.exactos} <span className="text-[9px] font-bold uppercase opacity-70 ml-1">x 3pts</span></span>
                                                        <span className="text-[9px] font-bold uppercase opacity-70">Marcadores Exactos</span>
                                                    </div>
                                                    <div className="w-px bg-current opacity-20"></div>
                                                    <div className="flex flex-col leading-none">
                                                        <span className="font-black text-sm">{jugador.tendencias} <span className="text-[9px] font-bold uppercase opacity-70 ml-1">x 1pt</span></span>
                                                        <span className="text-[9px] font-bold uppercase opacity-70">Tendencias</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL MODO ESPÍA: SCROLL REPARADO USANDO max-h-[85dvh] Y OVERFLOW */}
                    {spyUser && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[999] flex items-center justify-center p-4 overflow-hidden touch-none">
                            <div className="bg-[#033B25] border border-[#C5A97D]/50 rounded-3xl w-full max-w-2xl flex flex-col relative shadow-2xl" style={{ maxHeight: '85dvh' }}>
                                <div className="sticky top-0 bg-[#033B25] z-20 border-b border-[#C5A97D]/20 px-4 py-4 shrink-0 rounded-t-3xl">
                                    <div className="flex justify-between items-start mb-4">
                                        <h2 className="font-display font-black text-2xl text-white uppercase">Apuestas de <span className="text-[#C5A97D]">{spyUser.username}</span></h2>
                                        <button onClick={handleCloseSpy} className="text-[#C5A97D] bg-black/40 rounded-full p-3"><Icon name="x" size={24} /></button>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2 mb-4">
                                        <div className="bg-green-900/40 border border-green-500/50 rounded-xl p-2 flex flex-col items-center justify-center"><span className="text-xl md:text-2xl font-black text-green-400 leading-none">{spyStats.aciertos}</span><span className="text-[9px] md:text-[10px] uppercase font-bold text-green-200 mt-1">Aciertos</span></div>
                                        <div className="bg-red-900/40 border border-red-500/50 rounded-xl p-2 flex flex-col items-center justify-center"><span className="text-xl md:text-2xl font-black text-red-400 leading-none">{spyStats.fallos}</span><span className="text-[9px] md:text-[10px] uppercase font-bold text-red-200 mt-1">Fallos</span></div>
                                        <div className="bg-black/30 border border-[#C5A97D]/20 rounded-xl p-2 flex flex-col items-center justify-center"><span className="text-xl md:text-2xl font-black text-[#C5A97D] leading-none">{spyStats.pendientes}</span><span className="text-[9px] md:text-[10px] uppercase font-bold text-[#C5A97D]/70 mt-1">Pendientes</span></div>
                                    </div>
                                    <div className="flex flex-col gap-3">
                                        <div className="relative w-full"><div className="absolute inset-y-0 left-0 pl-3 flex items-center"><Icon name="search" size={16} className="text-[#C5A97D]/50" /></div><input type="text" placeholder="Buscar país..." value={spySearchTerm} onChange={e => setSpySearchTerm(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-xl py-3 pl-10 pr-4 text-white text-sm focus:outline-none focus:border-[#C5A97D]" /></div>
                                    </div>
                                </div>
                                <div className="overflow-y-auto custom-scrollbar p-4 flex-1">
                                    {spyPartidosHoy.length > 0 && (
                                        <div className="mb-6">
                                            <div className="bg-[#D31145] text-white px-3 py-1.5 rounded-lg mb-3 inline-flex items-center gap-1.5 text-xs font-black uppercase tracking-widest shadow-lg">Juegan Hoy</div>
                                            <div className="space-y-3">{spyPartidosHoy.map(partido => construirFilaSpy(partido, true))}</div>
                                        </div>
                                    )}
                                    <div className="space-y-3">
                                        {spyPartidosHoy.length > 0 && <h3 className="text-white/30 text-[10px] font-black uppercase tracking-widest mb-2 ml-1">Resto del Torneo</h3>}
                                        {spyPartidosResto.map(partido => construirFilaSpy(partido, false))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL PANEL DE ADMINISTRACIÓN + CONTROL DE PESTAÑAS Y LLAVES */}
                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[999] flex items-center justify-center p-4 overflow-hidden touch-none">
                            <div className="bg-[#53121F] border-2 border-[#C5A97D] p-6 rounded-3xl max-w-md w-full relative flex flex-col" style={{ maxHeight: '85dvh' }}>
                                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-white/50 bg-black/20 rounded-full p-2 z-10"><Icon name="x" size={24} /></button>
                                <h2 className="font-display font-black text-2xl text-white mb-6 border-b border-[#C5A97D]/20 pb-4 shrink-0">Panel de Control</h2>
                                <div className="space-y-6 overflow-y-auto pr-2 custom-scrollbar flex-1">
                                    
                                    <div className="bg-[#033B25] p-5 rounded-2xl border border-[#C5A97D]/30 shadow-lg">
                                        <p className="text-[10px] text-[#C5A97D] mb-4 font-black uppercase tracking-widest">Ocultar/Mostrar Pestañas</p>
                                        <div className="space-y-3">
                                            {[
                                                {id: 'grupos', label: 'Fase de Grupos'}, {id: 'ranking_grupos', label: 'Ranking Grupos'},
                                                {id: 'eliminatoria', label: 'Eliminatoria (Nueva)'}, {id: 'ranking_eliminatoria', label: 'Ranking Final (Nuevo)'}
                                            ].map(tab => (
                                                <label key={tab.id} className="flex justify-between items-center bg-black/40 p-3 rounded-xl cursor-pointer">
                                                    <span className="text-xs font-bold uppercase text-white/90">{tab.label}</span>
                                                    <input type="checkbox" checked={inputVisibilidad[tab.id]} onChange={e => setInputVisibilidad({...inputVisibilidad, [tab.id]: e.target.checked})} className="w-5 h-5" />
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Sincronización Avanzada API</p>
                                        <button onClick={handleGenerarLlavesAPI} disabled={isSyncing} className="w-full bg-[#C5A97D] text-[#53121F] font-black py-3 rounded-xl mb-3 active:scale-95 transition-transform">
                                            📥 Descargar Llaves Oficiales (Fase 2)
                                        </button>
                                    </div>

                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Carga Manual Rápida</p>
                                        <div className="max-h-48 overflow-y-auto custom-scrollbar pr-2 space-y-2 touch-pan">
                                            {partidosOrdenadosAdmin.map(p => (
                                                <div key={'admin-load-' + p.id} className="flex flex-col gap-2 bg-black/40 p-3 rounded-xl border border-white/10">
                                                    <div className="text-[8px] text-[#C5A97D] font-bold uppercase tracking-wider flex justify-between">
                                                        <span>{p.fecha} - {p.hora} Hrs</span>
                                                        <span>{p.grupo}</span>
                                                    </div>
                                                    <div className="flex items-center justify-between w-full">
                                                        <span className="text-xs font-bold w-1/3 truncate text-right pr-2">{p.local}</span>
                                                        <div className="flex items-center gap-1">
                                                            <input type="number" min="0" defaultValue={p.golesL_real !== null && p.golesL_real !== undefined ? p.golesL_real : ''} id={`golesL_${p.id}`} className="w-10 bg-black/50 border border-[#C5A97D]/50 text-center text-white rounded text-xs py-1.5 font-black" />
                                                            <span className="text-xs text-white/50 font-bold">-</span>
                                                            <input type="number" min="0" defaultValue={p.golesV_real !== null && p.golesV_real !== undefined ? p.golesV_real : ''} id={`golesV_${p.id}`} className="w-10 bg-black/50 border border-[#C5A97D]/50 text-center text-white rounded text-xs py-1.5 font-black" />
                                                        </div>
                                                        <span className="text-xs font-bold w-1/3 truncate text-left pl-2">{p.visitante}</span>
                                                    </div>
                                                    <button onClick={() => handleGuardarResultadoManual(p.id)} className="w-full bg-[#00623B] text-white px-2 py-2 rounded-lg text-[10px] font-black uppercase mt-1 transition-colors active:bg-green-700">Cerrar y Guardar</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <div className="space-y-3 mb-4">
                                            <div><label className="text-[10px] text-white/60 font-black uppercase">Premio MXN</label><input type="text" value={inputMxn} onChange={e => setInputMxn(e.target.value)} className="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-white text-sm" /></div>
                                        </div>
                                        <button onClick={handleActualizarConfig} className="w-full bg-gradient-to-r from-[#C5A97D] to-[#8C734A] text-[#53121F] font-black py-3 rounded-xl text-xs uppercase tracking-widest">Guardar Cambios Maestros</button>
                                    </div>
                                    
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <button onClick={toggleModoEspia} className="w-full bg-[#00623B] text-white font-black py-3 rounded-xl">{modoEspiaActivo ? 'BLOQUEAR ESPÍA' : 'HABILITAR ESPÍA'}</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
