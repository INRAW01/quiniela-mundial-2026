                'x': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
                'check': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
                'search': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
                'flame': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>,
                'target': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>,
                'crown': <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 4h20l-2 16H4z"/><path d="M12 12l4-8 4 8"/><path d="M12 12L8 4 4 12"/></svg>
            };
            return icons[name] || <svg width={size} height={size}></svg>;
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDdCGvIAt4A5AyF_yOvR5SPJsgPtMWpCYY",
            authDomain: "quiniela-2026-59b53.firebaseapp.com",
            projectId: "quiniela-2026-59b53",
            storageBucket: "quiniela-2026-59b53.firebasestorage.app",
            messagingSenderId: "1075755299669",
            appId: "1:1075755299669:web:f565bbd29ee371e60235dc"
        };

        let db = null;
        let auth = null;

        try {
            if (window.firebase) {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
            }
        } catch (e) {
            console.error("Error Firebase:", e);
        }

        const safeStorage = {
            get: function(key) { try { return window.localStorage.getItem(key); } catch(e) { return null; } },
            set: function(key, val) { try { window.localStorage.setItem(key, val); } catch(e) {} },
            remove: function(key) { try { window.localStorage.removeItem(key); } catch(e) {} }
        };

        const normalizeName = (str) => {
            if(!str) return "";
            return String(str).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        };

        const BANDERAS = {
            'mexico': '🇲🇽', 'sudafrica': '🇿🇦', 'corea del sur': '🇰🇷', 'republica checa': '🇨🇿',
            'canada': '🇨🇦', 'bosnia y herzegovina': '🇧🇦', 'catar': '🇶🇦', 'suiza': '🇨🇭',
            'brasil': '🇧🇷', 'marruecos': '🇲🇦', 'haiti': '🇭🇹', 'escocia': '🏴󠁧󠁢󠁳󠁣󠁴󠁿',
            'estados unidos': '🇺🇸', 'paraguay': '🇵🇾', 'australia': '🇦🇺', 'turquia': '🇹🇷',
            'alemania': '🇩🇪', 'curazao': '🇨🇼', 'costa de marfil': '🇨🇮', 'ecuador': '🇪🇨',
            'paises bajos': '🇳🇱', 'japon': '🇯🇵', 'tunez': '🇹🇳', 'suecia': '🇸🇪',
            'belgica': '🇧🇪', 'egipto': '🇪🇬', 'iran': '🇮🇷', 'nueva zelanda': '🇳🇿',
            'espana': '🇪🇸', 'cabo verde': '🇨🇻', 'arabia saudita': '🇸🇦', 'uruguay': '🇺🇾',
            'francia': '🇫🇷', 'senegal': '🇸🇳', 'noruega': '🇳🇴', 'irak': '🇮🇶',
            'argentina': '🇦🇷', 'argelia': '🇩🇿', 'austria': '🇦🇹', 'jordania': '🇯🇴',
            'portugal': '🇵🇹', 'uzbekistan': '🇺🇿', 'colombia': '🇨🇴', 'rd congo': '🇨🇩',
            'inglaterra': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'croacia': '🇭🇷', 'ghana': '🇬🇭', 'panama': '🇵🇦'
        };
        const getBandera = (pais) => BANDERAS[normalizeName(pais)] || '🏳️';

        const getMatchTimestamp = (fechaStr, horaStr) => {
            if (!fechaStr || !horaStr) return Infinity;
            let str = String(fechaStr).toLowerCase().replace(/ de /g, ' ').replace(/,/g, '');
            const partes = str.split(' ').filter(p => p);
            if (partes.length >= 3) {
                let dia = parseInt(partes[0]);
                let mesStr = partes[1].substring(0,3);
                const mesesMap = { 'ene':0, 'feb':1, 'mar':2, 'abr':3, 'may':4, 'jun':5, 'jul':6, 'ago':7, 'sep':8, 'oct':9, 'nov':10, 'dic':11 };
                let mes = mesesMap[mesStr] !== undefined ? mesesMap[mesStr] : 5; 
                let ano = parseInt(partes[2]); if(ano < 2000) ano = 2026;
                const [h, m] = horaStr.split(':').map(Number);
                return new Date(ano, mes, dia, h || 12, m || 0, 0).getTime();
            }
            return Infinity;
        };

        const parseFechaEs = (fechaStr) => {
            const ts = getMatchTimestamp(fechaStr, "12:00");
            return ts !== Infinity ? ts : 0;
        };

        const TRADUCTOR_API = {
            "usa": "estados unidos", "united states": "estados unidos", "south africa": "sudafrica", "south korea": "corea del sur", 
            "korea republic": "corea del sur", "czechia": "republica checa", "czech republic": "republica checa", 
            "bosnia and herzegovina": "bosnia y herzegovina", "qatar": "catar", "switzerland": "suiza", "brazil": "brasil",
            "morocco": "marruecos", "scotland": "escocia", "turkiye": "turquia", "turkey": "turquia", "germany": "alemania", 
            "cote d'ivoire": "costa de marfil", "ivory coast": "costa de marfil", "netherlands": "paises bajos", "japan": "japon", 
            "tunisia": "tunez", "sweden": "suecia", "belgium": "belgica", "egypt": "egipto", "ir iran": "iran", "iran": "iran",
            "new zealand": "nueva zelanda", "spain": "espana", "cape verde": "cabo verde", "saudi arabia": "arabia saudita", 
            "france": "francia", "norway": "noruega", "iraq": "irak", "algeria": "argelia", "jordan": "jordania", 
            "uzbekistan": "uzbekistan", "congo dr": "rd congo", "dr congo": "rd congo", "england": "inglaterra", "croatia": "croacia"
        };

        const traducirNombre = (nombreIngles) => {
            const normalizado = normalizeName(nombreIngles);
            return TRADUCTOR_API[normalizado] || normalizado;
        };

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#53121F]">
                        <Icon name="alert-triangle" size={64} className="text-[#C5A97D] mb-4 mx-auto" />
                        <h1 className="text-2xl font-black text-white mb-2">Error de Ejecución</h1>
                        <button onClick={() => window.location.reload()} className="bg-[#D31145] text-white px-6 py-3 rounded-xl font-black shadow-lg">REINICIAR</button>
                    </div>
                );
                return this.props.children;
            }
        }

        const App = () => {
            const [user, setUser] = React.useState(null);
            const [username, setUsername] = React.useState("");
            const [profile, setProfile] = React.useState(null);
            const [partidos, setPartidos] = React.useState([]);
            const [predicciones, setPredicciones] = React.useState({});
            
            const [activeTab, setActiveTab] = React.useState('eliminatoria');
            const [visibilidad, setVisibilidad] = React.useState({ grupos: true, ranking: true, eliminatoria: true, ranking_eliminatoria: true });
            
            const [premios, setPremios] = React.useState({ mxnFase1: "$4,000", crcFase1: "100,000", mxnFase2: "$10,000", crcFase2: "250,000", mxn2Lugar: "$2,000", crc2Lugar: "50,000" });
            const [inputPremios, setInputPremios] = React.useState({ mxnFase1: "$4,000", crcFase1: "100,000", mxnFase2: "$10,000", crcFase2: "250,000", mxn2Lugar: "$2,000", crc2Lugar: "50,000" });
            
            const [isLoading, setIsLoading] = React.useState(true);
            const [isLoginExiting, setIsLoginExiting] = React.useState(false);
            const [showAdminModal, setShowAdminModal] = React.useState(false);
            const [isSyncing, setIsSyncing] = React.useState(false);
            
            const [spyUser, setSpyUser] = React.useState(null); 
            const [spySearchTerm, setSpySearchTerm] = React.useState("");
            const [spyFilter, setSpyFilter] = React.useState("all");
            const [modoEspiaActivo, setModoEspiaActivo] = React.useState(false);

            const [currentTime, setCurrentTime] = React.useState(Date.now());
            React.useEffect(() => {
                const interval = setInterval(() => setCurrentTime(Date.now()), 1000);
                return () => clearInterval(interval);
            }, []);

            const partidosRef = React.useRef([]);
            React.useEffect(() => { partidosRef.current = partidos; }, [partidos]);

            const hoyParseado = React.useMemo(() => {
                const hoy = new Date();
                return new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate(), 12, 0, 0).getTime();
            }, []);

            React.useEffect(() => {
                if (spyUser || showAdminModal) document.body.style.overflow = 'hidden';
                else document.body.style.overflow = '';
                return () => { document.body.style.overflow = ''; };
            }, [spyUser, showAdminModal]);

            const calcularPuntosFase1 = (jugador) => {
                if (!partidos || partidos.length === 0) return 0;
                let aciertos = 0;
                const picks = jugador.picks || {};
                partidos.filter(p => String(p.grupo).toLowerCase().includes('grupo')).forEach(p => {
                    if (p.estado === 'finalizado') {
                        const suPick = picks[p.id];
                        if (suPick) {
                            let gl = Number(p.golesL_real); let gv = Number(p.golesV_real);
                            let resultadoReal = gl > gv ? 'local' : (gl < gv ? 'visitante' : 'empate');
                            if (resultadoReal === suPick) aciertos++;
                        }
                    }
                });
                return aciertos;
            };

            const calcularPuntosFase2 = (jugador) => {
                if (!partidos || partidos.length === 0) return 0;
                let aciertos = 0;
                const picks = jugador.picks || {};
                partidos.filter(p => !String(p.grupo).toLowerCase().includes('grupo')).forEach(p => {
                    if (p.estado === 'finalizado') {
                        let suPick = picks[p.id];
                        if (suPick) {
                            let gl = Number(p.golesL_real); let gv = Number(p.golesV_real);
                            let resultadoReal = gl > gv ? 'local' : (gl < gv ? 'visitante' : 'empate');
                            
                            let isSemi = p.grupo === 'Semifinales';
                            let isFinal = p.grupo === 'Gran Final';
                            let ptsMax = isFinal ? 3 : (isSemi ? 2 : 1);
                            
                            let resPick = typeof suPick === 'object' ? suPick.res : suPick;
                            let esExacto = typeof suPick === 'object' && Number(suPick.gl) === gl && Number(suPick.gv) === gv;

                            if (esExacto) aciertos += ptsMax;
                            else if (resPick === resultadoReal) aciertos += 1;
                        }
                    }
                });
                return aciertos;
            };

            React.useEffect(() => {
                if (!auth || !db) { setIsLoading(false); return; }
                const checarYRecuperarSesion = async (u) => {
                    try {
                        const savedUid = safeStorage.get('quiniela_user_uid');
                        if (savedUid && !u) { await auth.signInAnonymously(); return; }
                        const uidActivo = savedUid || (u ? u.uid : null);
                        if (uidActivo) {
                            const doc = await db.collection('usuarios').doc(uidActivo).get();
                            if (doc.exists) { setProfile({ id: uidActivo, ...doc.data() }); setUser({ uid: uidActivo }); } 
                            else { safeStorage.remove('quiniela_user_uid'); setUser(null); setProfile(null); }
                        }
                    } catch(e) { console.error(e); } finally { setIsLoading(false); }
                };
                const unsubAuth = auth.onAuthStateChanged((u) => checarYRecuperarSesion(u));
                return () => unsubAuth();
            }, []);

            React.useEffect(() => {
                if (!user || !db) return;
                const unsubPartidos = db.collection('partidos').onSnapshot(snap => {
                    const pts = []; snap.forEach(d => pts.push({ id: d.id, ...d.data() })); setPartidos(pts);
                });
                const unsubPreds = db.collection('usuarios').onSnapshot(snap => {
                    const data = {}; snap.forEach(d => data[d.id] = { id: d.id, ...d.data() }); setPredicciones(data);
                    if (data[user.uid]) setProfile(data[user.uid]);
                });
                return () => { unsubPartidos(); unsubPreds(); };
            }, [user]);

            React.useEffect(() => {
                if (!db) return;
                const unsubConfig = db.collection('sistema').doc('configuracion').onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        setModoEspiaActivo(data.modo_espia_activo || false);
                        const configPremios = {
                            mxnFase1: data.premios?.mxnFase1 || "$4,000",
                            crcFase1: data.premios?.crcFase1 || "100,000",
                            mxnFase2: data.premios?.mxnFase2 || "$10,000",
                            crcFase2: data.premios?.crcFase2 || "250,000",
                            mxn2Lugar: data.premios?.mxn2Lugar || "$2,000",
                            crc2Lugar: data.premios?.crc2Lugar || "50,000"
                        };
                        setPremios(configPremios); setInputPremios(configPremios);
                        if (data.visibilidad) setVisibilidad(data.visibilidad);
                    }
                });
                return () => unsubConfig();
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault(); if (!db || !auth) return;
                const inputName = username.trim(); if (!inputName) return;
                setIsLoading(true);
                try {
                    if (!auth.currentUser) await auth.signInAnonymously();
                    const allUsersSnap = await db.collection('usuarios').get();
                    const existingUser = allUsersSnap.docs.find(doc => doc.data().username.toLowerCase() === inputName.toLowerCase());
                    let currentUserUid = existingUser ? existingUser.id : auth.currentUser.uid;
                    if (!existingUser) { await db.collection('usuarios').doc(currentUserUid).set({ username: inputName, picks: {}, puntos: 0, locked: false, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); }
                    setUser({ uid: currentUserUid }); safeStorage.set('quiniela_user_uid', currentUserUid);
                    const doc = await db.collection('usuarios').doc(currentUserUid).get(); setProfile({ id: currentUserUid, ...doc.data() });
                    setIsLoginExiting(true); setTimeout(() => { setIsLoginExiting(false); setIsLoading(false); }, 500);
                } catch (error) { setIsLoading(false); }
            };
            
            const handleBloquearQuiniela = async () => {
                if (!profile || !db) return;
                if(confirm("¿Estás seguro de bloquear tu quiniela de Fase 1? Ya no podrás hacer más cambios y serás visible en el Ranking.")) {
                    await db.collection('usuarios').doc(user.uid).update({ locked: true });
                }
            };

            const guardarTendencia = async (partidoId, tendencia) => {
                if (!profile || !db) return;
                const partido = partidos.find(p => p.id === partidoId);
                const isFaseGrupos = String(partido.grupo).toLowerCase().includes('grupo');
                
                if (!profile.paseEspecial && isFaseGrupos && profile.locked) return; 
                
                const matchTime = getMatchTimestamp(partido.fecha, partido.hora);
                if (!profile.paseEspecial && (currentTime >= matchTime - 60000 || partido.estado === 'finalizado')) return; 

                const picksActuales = profile.picks || {};
                const nuevoPick = { ...picksActuales, [partidoId]: tendencia };
                await db.collection('usuarios').doc(user.uid).update({ picks: nuevoPick });
            };

            const guardarMarcadorExacto = async (partidoId, gl, gv) => {
                if (!profile || !db) return;
                const partido = partidos.find(p => p.id === partidoId);
                const matchTime = getMatchTimestamp(partido.fecha, partido.hora);
                
                if (!profile.paseEspecial && (currentTime >= matchTime - 60000 || partido.estado === 'finalizado')) return;
                
                let numL = Number(gl); let numV = Number(gv);

                                                    </div>
                                                    <div>
                                                        <div className="flex items-center gap-2"><span className="font-black text-xl uppercase truncate max-w-[140px] md:max-w-[200px]">{jugador.username}</span>{jugador.id === (profile && profile.id) && <span className={`${idx===0?'bg-[#53121F] text-white':'bg-white text-black'} text-[10px] font-black px-2 py-0.5 rounded`}>TÚ</span>}</div>
                                                        <span className="text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 opacity-80"><Icon name={modoEspiaActivo || jugador.id === (profile && profile.id) ? "eye" : "lock"} size={12} /> {modoEspiaActivo || jugador.id === (profile && profile.id) ? 'Toca para espiar' : 'Bloqueado 🔒'}</span>
                                                    </div>
                                                </div>
                                                <div className="text-right pr-2">
                                                    <div className="font-display font-black text-5xl leading-none">{jugador.puntosCalculados}</div>
                                                    <div className={`text-[10px] font-black tracking-widest uppercase mt-1 ${idx===0 ? 'text-[#53121F]/70' : 'opacity-60'}`}>Pts 2da Fase</div>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* VENTANA MODAL ESPÍA OPTIMIZADA MEDIANTE PORTAL */}
                    {spyUser && ReactDOM.createPortal(
                        <div className="fixed inset-0 w-full h-[100dvh] bg-black/95 backdrop-blur-md z-[9999] flex items-center justify-center p-4">
                            <div className="bg-[#033B25] border border-[#C5A97D]/50 rounded-3xl w-full max-w-2xl flex flex-col shadow-2xl h-auto max-h-[85dvh] overflow-hidden">
                                <div className="shrink-0 bg-[#033B25] z-20 border-b border-[#C5A97D]/20 p-4 md:p-6">
                                    <div className="flex justify-between items-start mb-4"><h2 className="font-display font-black text-2xl text-white uppercase leading-tight">Apuestas de <br className="md:hidden"/><span className="text-[#C5A97D]">{spyUser.data.username}</span></h2><button onClick={handleCloseSpy} className="text-[#C5A97D] bg-black/40 rounded-full p-3 ml-2"><Icon name="x" size={24} /></button></div>
                                    <div className="grid grid-cols-3 gap-2 mb-4">
                                        <div className="bg-green-900/40 border border-green-500/50 rounded-xl p-2 flex flex-col items-center justify-center"><span className="text-xl md:text-2xl font-black text-green-400 leading-none">{spyStats.aciertos}</span><span className="text-[9px] md:text-[10px] uppercase font-bold text-green-200 mt-1">Aciertos</span></div>
                                        <div className="bg-red-900/40 border border-red-500/50 rounded-xl p-2 flex flex-col items-center justify-center"><span className="text-xl md:text-2xl font-black text-red-400 leading-none">{spyStats.fallos}</span><span className="text-[9px] md:text-[10px] uppercase font-bold text-red-200 mt-1">Fallos</span></div>
                                        <div className="bg-black/30 border border-[#C5A97D]/20 rounded-xl p-2 flex flex-col items-center justify-center"><span className="text-xl md:text-2xl font-black text-[#C5A97D] leading-none">{spyStats.pendientes}</span><span className="text-[9px] md:text-[10px] uppercase font-bold text-[#C5A97D]/70 mt-1">Pendientes</span></div>
                                    </div>
                                    <div className="flex flex-col gap-3">
                                        <div className="relative w-full"><div className="absolute inset-y-0 left-0 pl-3 flex items-center"><Icon name="search" size={16} className="text-[#C5A97D]/50" /></div><input type="text" placeholder="Buscar país..." value={spySearchTerm} onChange={e => setSpySearchTerm(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-xl py-3 pl-10 pr-4 text-white text-sm focus:outline-none focus:border-[#C5A97D]" /></div>
                                        <div className="flex gap-2 w-full overflow-x-auto hide-scrollbar pb-1">
                                            {['all', 'aciertos', 'fallos'].map(f => (<button key={f} onClick={() => setSpyFilter(f)} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest whitespace-nowrap ${spyFilter === f ? 'bg-[#C5A97D] text-[#53121F]' : 'bg-black/30 text-[#C5A97D]/70 border border-white/5'}`}>{f === 'all' ? 'Todos' : f === 'aciertos' ? '✅ Aciertos' : '❌ Fallos'}</button>))}
                                        </div>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto custom-scrollbar p-4 pb-8 touch-pan overscroll-contain" style={{ WebkitOverflowScrolling: 'touch' }}>
                                    {spyPartidosHoy.length > 0 && spySearchTerm === '' && spyFilter === 'all' && (
                                        <div className="mb-6">
                                            <div className="bg-[#D31145] text-white px-3 py-1.5 rounded-lg mb-3 inline-flex items-center gap-1.5 text-xs font-black uppercase tracking-widest shadow-lg"><Icon name="flame" size={14} /> Juegan Hoy</div>
                                            <div className="space-y-3">{spyPartidosHoy.map(partido => construirFilaSpy(partido, true))}</div>
                                            <div className="w-full h-px bg-white/10 my-6"></div>
                                        </div>
                                    )}
                                    <div className="space-y-3">
                                        {spyPartidosHoy.length > 0 && spySearchTerm === '' && spyFilter === 'all' && <h3 className="text-white/30 text-[10px] font-black uppercase tracking-widest mb-2 ml-1">Resto del Torneo</h3>}
                                        {spyPartidosResto.map(partido => construirFilaSpy(partido, false))}
                                        {spyPartidosResto.length === 0 && spyPartidosHoy.length === 0 && <p className="text-center text-white/40 text-xs font-bold mt-4">No se encontraron predicciones.</p>}
                                    </div>
                                </div>
                            </div>
                        </div>,
                        document.body
                    )}

                    {/* VENTANA MODAL ADMIN OPTIMIZADA MEDIANTE PORTAL */}
                    {showAdminModal && ReactDOM.createPortal(
                        <div className="fixed inset-0 w-full h-[100dvh] bg-black/95 backdrop-blur-md z-[9999] flex items-center justify-center p-4">
                            <div className="bg-[#53121F] border-2 border-[#C5A97D] p-6 rounded-3xl max-w-md w-full relative flex flex-col h-auto max-h-[85dvh] overflow-hidden shadow-[0_0_50px_rgba(197,169,125,0.2)]">
                                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-white/50 bg-black/20 rounded-full p-2 z-10"><Icon name="x" size={24} /></button>
                                <h2 className="font-display font-black text-2xl text-white mb-6 border-b border-[#C5A97D]/20 pb-4 shrink-0 flex items-center gap-2"><Icon name="target" /> Panel de Control</h2>
                                <div className="space-y-6 flex-1 overflow-y-auto pr-2 custom-scrollbar touch-pan pb-6 overscroll-contain" style={{ WebkitOverflowScrolling: 'touch' }}>
                                    <div className="bg-[#033B25] p-5 rounded-2xl border border-[#C5A97D]/30 shadow-lg">
                                        <p className="text-[10px] text-[#C5A97D] mb-4 font-black uppercase tracking-widest">Visibilidad Pestañas</p>
                                        <div className="space-y-3">
                                            {[{id: 'grupos', label: 'Fase de Grupos'}, {id: 'ranking', label: 'Ranking Grupos'}, {id: 'eliminatoria', label: 'Fase Eliminatoria'}, {id: 'ranking_eliminatoria', label: 'Ranking Final'}].map(tab => (
                                                <label key={tab.id} className="flex justify-between items-center bg-black/40 p-3 rounded-xl cursor-pointer">
                                                    <span className="text-xs font-bold uppercase text-white/90">{tab.label}</span>
                                                    <input type="checkbox" checked={visibilidad[tab.id] !== false} onChange={e => handleToggleVisibilidad(tab.id, e.target.checked)} className="w-5 h-5 accent-[#C5A97D]" />
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Sincronización Avanzada</p>
                                        <button onClick={() => handleSyncAPI(false)} disabled={isSyncing} className="w-full bg-[#00623B] text-white font-black py-3 rounded-xl mb-3 flex items-center justify-center gap-2 active:scale-95 transition-transform"><Icon name="clock" size={16}/> Sincronizar API Oficial</button>
                                    </div>
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-4 font-black uppercase tracking-widest">Configuración Premios</p>
                                        <div className="mb-4 p-3 bg-black/40 rounded-xl border border-white/5"><h4 className="text-xs font-bold text-white mb-2 uppercase">Fase 1</h4><div className="space-y-2"><div className="flex justify-between items-center"><label className="text-[10px] text-white/60 font-black uppercase w-1/3">1er MXN</label><input type="text" value={inputPremios.mxnFase1} onChange={e => setInputPremios({...inputPremios, mxnFase1: e.target.value})} className="w-2/3 bg-black/50 border border-white/10 rounded-lg px-2 py-1.5 text-white text-xs" /></div><div className="flex justify-between items-center"><label className="text-[10px] text-white/60 font-black uppercase w-1/3">1er CRC</label><input type="text" value={inputPremios.crcFase1} onChange={e => setInputPremios({...inputPremios, crcFase1: e.target.value})} className="w-2/3 bg-black/50 border border-white/10 rounded-lg px-2 py-1.5 text-white text-xs" /></div></div></div>
                                        <div className="mb-4 p-3 bg-black/40 rounded-xl border border-white/5"><h4 className="text-xs font-bold text-white mb-2 uppercase flex items-center gap-1">Fase Final </h4><div className="space-y-2"><div className="flex justify-between items-center"><label className="text-[10px] text-yellow-500/80 font-black uppercase w-1/3">1er MXN</label><input type="text" value={inputPremios.mxnFase2} onChange={e => setInputPremios({...inputPremios, mxnFase2: e.target.value})} className="w-2/3 bg-black/50 border border-yellow-500/30 rounded-lg px-2 py-1.5 text-white text-xs" /></div><div className="flex justify-between items-center"><label className="text-[10px] text-yellow-500/80 font-black uppercase w-1/3">1er CRC</label><input type="text" value={inputPremios.crcFase2} onChange={e => setInputPremios({...inputPremios, crcFase2: e.target.value})} className="w-2/3 bg-black/50 border border-yellow-500/30 rounded-lg px-2 py-1.5 text-white text-xs" /></div><div className="h-px bg-white/10 my-2"></div><div className="flex justify-between items-center"><label className="text-[10px] text-gray-400 font-black uppercase w-1/3">2do MXN</label><input type="text" value={inputPremios.mxn2Lugar} onChange={e => setInputPremios({...inputPremios, mxn2Lugar: e.target.value})} className="w-2/3 bg-black/50 border border-gray-500/30 rounded-lg px-2 py-1.5 text-white text-xs" /></div><div className="flex justify-between items-center"><label className="text-[10px] text-gray-400 font-black uppercase w-1/3">2do CRC</label><input type="text" value={inputPremios.crc2Lugar} onChange={e => setInputPremios({...inputPremios, crc2Lugar: e.target.value})} className="w-2/3 bg-black/50 border border-gray-500/30 rounded-lg px-2 py-1.5 text-white text-xs" /></div></div></div>
                                        <button onClick={handleActualizarPremios} className="w-full bg-[#C5A97D] text-[#53121F] font-black py-2.5 rounded-xl text-xs uppercase tracking-widest active:scale-95 transition-transform">Guardar Premios</button>
                                    </div>
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5"><button onClick={toggleModoEspia} className="w-full bg-[#00623B] text-white font-black py-3 rounded-xl">{modoEspiaActivo ? 'BLOQUEAR ESPÍA' : 'HABILITAR ESPÍA'}</button></div>
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Asignación Manual de Llaves</p>
                                        <div className="max-h-64 overflow-y-auto custom-scrollbar pr-2 space-y-4 touch-pan overscroll-contain">
                                            {partidosOrdenadosAdmin.filter(p => !String(p.grupo).toLowerCase().includes('grupo')).map(p => (
                                                <div key={'admin-llave-' + p.id} className="flex flex-col gap-2 bg-black/40 p-3 rounded-xl border border-white/10">
                                                    <div className="text-[8px] text-[#C5A97D] font-bold uppercase tracking-wider flex justify-between"><span>{p.fecha} - {p.hora}</span><span>{p.grupo}</span></div>
                                                    <div className="flex items-center gap-2">
                                                        <input type="text" id={`admin_loc_${p.id}`} defaultValue={p.local} placeholder="Local" className="w-1/2 bg-black/50 border border-white/10 rounded px-2 py-1 text-xs" />
                                                        <span className="text-[10px] italic opacity-50">VS</span>
                                                        <input type="text" id={`admin_vis_${p.id}`} defaultValue={p.visitante} placeholder="Visita" className="w-1/2 bg-black/50 border border-white/10 rounded px-2 py-1 text-xs" />
                                                    </div>
                                                    <button onClick={() => handleAsignarLlave(p.id)} className="w-full bg-[#D31145]/80 text-white px-2 py-2 rounded-lg text-[10px] font-black uppercase transition-colors hover:bg-[#D31145]">Cargar Nombres Reales</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Resultados Manuales y Penales</p>
                                        <div className="max-h-64 overflow-y-auto custom-scrollbar pr-2 space-y-4 touch-pan overscroll-contain">
                                            {partidosOrdenadosAdmin.map(p => (
                                                <div key={'admin-load-' + p.id} className="flex flex-col gap-2 bg-black/40 p-3 rounded-xl border border-white/10 relative">
                                                    {p.bloqueo_manual && <div className="absolute -top-2 -right-2 bg-yellow-600 text-white text-[8px] font-black px-2 py-1 rounded-full shadow-lg flex items-center gap-1 z-10"><Icon name="lock" size={8}/> PROTEGIDO</div>}
                                                    
                                                    <div className="text-[8px] text-[#C5A97D] font-bold uppercase tracking-wider flex justify-between"><span>{p.fecha} - {p.hora}</span><span>{p.grupo}</span></div>
                                                    <div className="flex items-center justify-between w-full"><span className="text-[10px] font-bold w-1/3 truncate text-right pr-2">{p.local}</span><div className="flex items-center gap-1"><input type="number" min="0" defaultValue={p.golesL_real !== null && p.golesL_real !== undefined ? p.golesL_real : ''} id={`golesL_${p.id}`} className="w-10 bg-black/50 border border-[#C5A97D]/50 text-center text-white rounded text-xs py-1.5 font-black outline-none" /><span className="text-xs text-white/50 font-bold">-</span><input type="number" min="0" defaultValue={p.golesV_real !== null && p.golesV_real !== undefined ? p.golesV_real : ''} id={`golesV_${p.id}`} className="w-10 bg-black/50 border border-[#C5A97D]/50 text-center text-white rounded text-xs py-1.5 font-black outline-none" /></div><span className="text-[10px] font-bold w-1/3 truncate text-left pl-2">{p.visitante}</span></div>
                                                    
                                                    <div className="flex gap-2 w-full mt-1">
                                                        <button onClick={() => handleGuardarResultadoManual(p.id)} className="flex-1 bg-[#00623B] text-white px-2 py-2 rounded-lg text-[10px] font-black uppercase transition-colors hover:bg-green-700">Guardar 90 Mins</button>
                                                        {p.bloqueo_manual && <button onClick={() => handleDesbloquearManual(p.id)} title="Quitar protección para que la API vuelva a actualizarlo" className="bg-red-900/80 border border-red-500 text-white px-3 py-2 rounded-lg text-[10px] font-black uppercase transition-colors hover:bg-red-600"><Icon name="unlock" size={12}/></button>}
                                                    </div>
                                                    
                                                    {!String(p.grupo).toLowerCase().includes('grupo') && (
                                                        <div className="flex gap-2 mt-1">
                                                            <button onClick={() => handleMarcarPenales(p.id, 'local')} className="flex-1 bg-yellow-600/30 border border-yellow-500/50 text-yellow-400 py-1 rounded text-[8px] font-bold">Avanza Loc</button>
                                                            <button onClick={() => handleMarcarPenales(p.id, 'visitante')} className="flex-1 bg-yellow-600/30 border border-yellow-500/50 text-yellow-400 py-1 rounded text-[8px] font-bold">Avanza Vis</button>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5"><p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Gestión de Usuarios</p>{Object.values(predicciones).map(j => (<div key={j.id} className="flex justify-between items-center bg-black/40 p-3 rounded-xl border border-white/5 mb-2"><span className="font-bold text-xs uppercase text-white flex items-center gap-1">{j.locked ? '🔒' : '🔓'} {j.paseEspecial ? '⭐' : ''} {j.username}</span><div className="flex gap-2 flex-wrap justify-end"><button onClick={() => handleTogglePaseEspecial(j.id, j.paseEspecial, j.username)} className={`${j.paseEspecial ? 'bg-yellow-600' : 'bg-gray-600'} text-white px-2 py-1 rounded text-[10px] font-black active:scale-95 transition-transform`}>{j.paseEspecial ? 'Quitar Pase' : 'Dar Pase'}</button>{j.locked && <button onClick={() => handleUnlockUser(j.id, j.username)} className="bg-[#00623B] text-white px-2 py-1 rounded text-[10px] font-black active:scale-95 transition-transform">Desbloquear</button>}<button onClick={() => handleDeleteUser(j.id, j.username)} className="bg-[#D31145] text-white px-2 py-1 rounded text-[10px] font-black active:scale-95 transition-transform">Eliminar</button></div></div>))}</div>
                                </div>
                            </div>
                        </div>,
                        document.body
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
