            }

                return { hasError: true, error };

                            <div className="space-y-4 animate-fade-in pb-10">
                                <div className="panini-gradient p-8 rounded-3xl text-center relative mb-10 border-4 border-[#C5A97D] shadow-[0_0_40px_rgba(197,169,125,0.4)] overflow-hidden">
                                    <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white/20 via-transparent to-transparent opacity-60"></div>
                                    <h2 className="font-display font-black text-sm text-[#C5A97D] uppercase tracking-[0.3em] mb-1 drop-shadow-md">Gran Premio</h2>
                                    <div className="font-display font-black text-5xl md:text-7xl text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.6)] tracking-tighter mb-0 leading-none">
                                        {premioMxn}<span className="text-2xl md:text-3xl ml-1">MXN</span>
                                    </div>
                                    <div className="text-[#C5A97D] font-black text-base md:text-lg uppercase tracking-widest opacity-90 drop-shadow-md mt-2">o {premioCrc} CRC</div>
                                    <button onClick={(e) => { e.preventDefault(); if(window.prompt("Contraseña:") === "26zorras27") setShowAdminModal(true); }} className="absolute top-3 right-3 bg-black/50 text-[#C5A97D] border border-[#C5A97D]/30 px-3 py-2 rounded-xl text-[10px] font-black tracking-widest z-[60] shadow-xl hover:bg-black">
                                        ⚙️ ADMIN
                                    </button>
                                </div>
                                
                                {!profile?.locked && (
                                    <div className="bg-red-900/40 border border-red-500/50 p-6 rounded-2xl text-center mb-6">
                                        <p className="text-white font-bold"><Icon name="alert-circle" className="inline mr-2 mb-1 text-red-400"/>Ve a Grupos y presiona "Guardar y Bloquear" para aparecer aquí.</p>
                                    </div>
                                )}
                                
                                <div className="space-y-4">
                                    {Object.values(predicciones).filter(j => j.locked).sort((a,b) => (b.puntos||0) - (a.puntos||0)).map((jugador, idx) => (
                                        <div key={jugador.id} onClick={() => { if (modoEspiaActivo || jugador.id === profile?.id) setSpyUser(jugador); else alert("El Modo Espía está bloqueado."); }} className={`cursor-pointer p-4 rounded-3xl flex items-center justify-between transition-all transform hover:scale-[1.02] active:scale-95 shadow-lg ${idx === 0 ? 'bg-gradient-to-r from-[#033B25] to-[#53121F] border-2 border-[#C5A97D] shadow-[0_0_20px_rgba(197,169,125,0.3)]' : jugador.id === profile?.id ? 'bg-white text-black ring-4 ring-[#D31145]' : 'bg-[#033B25] border border-white/5 text-white'}`}>
                                            <div className="flex items-center gap-4">
                                                <div className={`w-12 shrink-0 flex items-center justify-center font-display font-black text-5xl md:text-6xl drop-shadow-xl ${idx === 0 ? 'text-[#C5A97D] drop-shadow-[0_0_15px_rgba(197,169,125,0.8)]' : idx === 1 ? 'text-gray-300 drop-shadow-[0_0_15px_rgba(209,213,219,0.6)]' : idx === 2 ? 'text-[#CD7F32] drop-shadow-[0_0_15px_rgba(205,127,50,0.6)]' : 'text-white/20 text-4xl'}`}>
                                                    {idx + 1}
                                                </div>
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <span className={`font-black text-xl uppercase truncate max-w-[140px] md:max-w-[200px] ${idx === 0 ? 'text-white drop-shadow-md' : ''}`}>{jugador.username}</span>
                                                        {jugador.id === profile?.id && <span className="bg-[#D31145] text-white text-[10px] font-black px-2 py-0.5 rounded">TÚ</span>}
                                                    </div>
                                                    <span className={`text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 ${jugador.id === profile?.id ? 'text-gray-500' : 'text-[#C5A97D]/80'}`}>
                                                        <Icon name={modoEspiaActivo || jugador.id === profile?.id ? "eye" : "lock"} size={12} /> {modoEspiaActivo || jugador.id === profile?.id ? 'Toca para espiar' : 'Bloqueado 🔒'}
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="text-right pr-2">
                                                <div className="font-display font-black text-4xl leading-none">{jugador.puntos || 0}</div>
                                                <div className={`text-[10px] font-black tracking-widest uppercase mt-1 ${jugador.id === profile?.id ? 'text-[#D31145]' : 'text-[#C5A97D]'}`}>Puntos</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {spyUser && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[90] flex items-center justify-center p-2 md:p-4 animate-fade-in">
                            <div className="bg-[#033B25] border border-[#C5A97D]/50 rounded-3xl w-full max-w-2xl max-h-[95vh] flex flex-col relative shadow-[0_0_40px_rgba(197,169,125,0.3)] overflow-hidden">
                                <div className="sticky top-0 bg-[#033B25] z-20 border-b border-[#C5A97D]/20 px-4 py-4 md:px-6 md:py-5 shadow-lg">
                                    <div className="flex justify-between items-start mb-4">
                                        <h2 className="font-display font-black text-2xl text-white uppercase tracking-wide drop-shadow-md leading-tight">Apuestas de <br className="block md:hidden"/><span className="text-[#C5A97D]">{spyUser.username}</span></h2>
                                        <button onClick={handleCloseSpy} className="text-[#C5A97D] bg-black/40 rounded-full p-3 hover:bg-black transition-colors"><Icon name="x" size={24} /></button>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2 mb-4">
                                        <div className="bg-green-900/40 border border-green-500/50 rounded-xl p-2 flex flex-col items-center justify-center"><span className="text-xl md:text-2xl font-black text-green-400 leading-none">{spyStats.aciertos}</span><span className="text-[9px] md:text-[10px] uppercase font-bold text-green-200 mt-1">Aciertos</span></div>
                                        <div className="bg-red-900/40 border border-red-500/50 rounded-xl p-2 flex flex-col items-center justify-center"><span className="text-xl md:text-2xl font-black text-red-400 leading-none">{spyStats.fallos}</span><span className="text-[9px] md:text-[10px] uppercase font-bold text-red-200 mt-1">Fallos</span></div>
                                        <div className="bg-black/30 border border-[#C5A97D]/20 rounded-xl p-2 flex flex-col items-center justify-center"><span className="text-xl md:text-2xl font-black text-[#C5A97D] leading-none">{spyStats.pendientes}</span><span className="text-[9px] md:text-[10px] uppercase font-bold text-[#C5A97D]/70 mt-1">Pendientes</span></div>
                                    </div>
                                    <div className="flex flex-col gap-3">
                                        <div className="relative w-full"><div className="absolute inset-y-0 left-0 pl-3 flex items-center"><Icon name="search" size={16} className="text-[#C5A97D]/50" /></div><input type="text" placeholder="Buscar..." value={spySearchTerm} onChange={e => setSpySearchTerm(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-xl py-3 pl-10 pr-4 text-white text-sm font-bold focus:outline-none focus:border-[#C5A97D]" /></div>
                                        <div className="flex gap-2 w-full overflow-x-auto hide-scrollbar pb-1">
                                            {['all', 'aciertos', 'fallos'].map(f => (
                                                <button key={f} onClick={() => setSpyFilter(f)} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest whitespace-nowrap transition-all ${spyFilter === f ? 'bg-[#C5A97D] text-[#53121F]' : 'bg-black/30 text-[#C5A97D]/70 border border-white/5'}`}>{f === 'all' ? 'Todos' : f === 'aciertos' ? '✅ Aciertos' : '❌ Fallos'}</button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="overflow-y-auto custom-scrollbar p-4 space-y-3 bg-[#033B25]/90 flex-1">
                                    {spyPartidosFiltrados.map(partido => {
                                        const suPick = spyUser.picks?.[partido.id];
                                        let esCorrecto = null;
                                        if (partido.estado === 'finalizado') {
                                            let gl = Number(partido.golesL_real); let gv = Number(partido.golesV_real);
                                            esCorrecto = ((gl > gv ? 'local' : (gl < gv ? 'visitante' : 'empate')) === suPick);
                                        }
                                        return (
                                            <div key={partido.id} className={`flex items-center justify-between p-3 rounded-2xl border ${esCorrecto === true ? 'bg-green-900/40 border-green-500' : esCorrecto === false ? 'bg-red-900/40 border-red-500' : 'bg-black/40 border-white/10'}`}>
                                                <div className="flex items-center gap-2 w-1/2 md:gap-3"><span className="text-2xl">{getBandera(partido.local)}</span><span className="text-[10px] text-white/40 font-black italic">VS</span><span className="text-2xl">{getBandera(partido.visitante)}</span></div>
                                                <div className="w-1/2 flex justify-end">
                                                    <span className={`text-[9px] md:text-[10px] font-black uppercase tracking-widest px-3 py-2 rounded-xl text-center shadow-inner flex items-center gap-1 ${esCorrecto === true ? 'bg-green-500 text-white' : esCorrecto === false ? 'bg-red-500 text-white' : 'bg-[#C5A97D] text-[#53121F]'}`}>
                                                        {esCorrecto === true && <Icon name="check" size={14} />}{esCorrecto === false && <Icon name="x" size={14} />}{suPick === 'local' ? partido.local : suPick === 'visitante' ? partido.visitante : 'Empate'}
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-[#53121F] border-2 border-[#C5A97D] p-6 rounded-3xl max-w-md w-full relative">
                                <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-white/50 bg-black/20 rounded-full p-2"><Icon name="x" size={24} /></button>
                                <h2 className="font-display font-black text-2xl text-white mb-6 border-b border-[#C5A97D]/20 pb-4">Panel de Control</h2>
                                <div className="space-y-6 max-h-[65vh] overflow-y-auto pr-2 custom-scrollbar">
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <p className="text-[10px] text-[#C5A97D] mb-3 font-black uppercase tracking-widest">Carga Manual de Resultados</p>
                                        <div className="max-h-48 overflow-y-auto custom-scrollbar pr-2 space-y-2">
                                            {partidos.map(p => (
                                                <div key={p.id} className="flex flex-col gap-2 bg-black/40 p-3 rounded-xl border border-white/10">
                                                    <div className="flex items-center justify-between w-full">
                                                        <span className="text-xs font-bold w-1/3 truncate text-right pr-2">{p.local}</span>
                                                        <div className="flex items-center gap-1">
                                                            <input type="number" min="0" defaultValue={p.golesL_real ?? ''} id={`golesL_${p.id}`} className="w-10 bg-black/50 border border-[#C5A97D]/50 text-center text-white rounded text-xs py-1.5" />
                                                            <span className="text-xs text-white/50 font-bold">-</span>
                                                            <input type="number" min="0" defaultValue={p.golesV_real ?? ''} id={`golesV_${p.id}`} className="w-10 bg-black/50 border border-[#C5A97D]/50 text-center text-white rounded text-xs py-1.5" />
                                                        </div>
                                                        <span className="text-xs font-bold w-1/3 truncate text-left pl-2">{p.visitante}</span>
                                                    </div>
                                                    <button onClick={() => handleGuardarResultadoManual(p.id)} className="w-full bg-[#00623B] text-white px-2 py-2 rounded-lg text-[10px] font-black uppercase mt-1">Cerrar y Puntear</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <button onClick={() => handleSyncAPI(false)} disabled={isSyncing} className="w-full bg-[#00623B] text-white font-black py-3 rounded-xl shadow-lg mb-3">Sincronizar API y Puntos</button>
                                        <button onClick={calcularPuntosGlobal} className="w-full bg-[#C5A97D] text-[#53121F] font-black py-3 rounded-xl shadow-lg">Forzar Recálculo</button>
                                    </div>
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        <div className="space-y-3 mb-4">
                                            <div><label className="text-[10px] text-white/60 font-black uppercase">Premio MXN</label><input type="text" value={inputMxn} onChange={e => setInputMxn(e.target.value)} className="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-white text-sm" /></div>
                                            <div><label className="text-[10px] text-white/60 font-black uppercase">Premio CRC</label><input type="text" value={inputCrc} onChange={e => setInputCrc(e.target.value)} className="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-white text-sm" /></div>
                                        </div>
                                        <button onClick={handleActualizarPremios} className="w-full bg-[#C5A97D] text-[#53121F] font-black py-2.5 rounded-xl text-xs uppercase">Guardar Montos</button>
                                    </div>
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5"><button onClick={toggleModoEspia} className="w-full bg-[#00623B] text-white font-black py-3 rounded-xl">{modoEspiaActivo ? 'BLOQUEAR ESPÍA' : 'HABILITAR ESPÍA'}</button></div>
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5"><button onClick={borrarTodosLosPartidos} className="w-full border border-[#D31145] text-[#D31145] font-black py-2 rounded-xl mb-3">Borrar Todo</button><button onClick={cargarPartidosBase} className="w-full bg-white text-[#00623B] font-black py-3 rounded-xl">Generar 72 Partidos</button></div>
                                    <div className="bg-black/30 p-5 rounded-2xl border border-white/5">
                                        {Object.values(predicciones).map(j => (
                                            <div key={j.id} className="flex justify-between items-center bg-black/40 p-3 rounded-xl border border-white/5 mb-2">
                                                <span className="font-bold text-xs uppercase">{j.locked ? '🔒' : '🔓'} {j.username}</span>
                                                <div className="flex gap-2">
                                                    {j.locked && <button onClick={() => handleUnlockUser(j.id, j.username)} className="bg-[#00623B] text-white px-2 py-1 rounded text-[10px] font-black">Desbloquear</button>}
                                                    <button onClick={() => handleDeleteUser(j.id, j.username)} className="bg-[#D31145] text-white px-2 py-1 rounded text-[10px] font-black">Eliminar</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
